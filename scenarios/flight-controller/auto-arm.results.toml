# Results of auto-arm.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Auto-arm arms on the first throttle raise that passes the arming checks, and only Reset or a Failsafe drop disarms"

[[expect]]
what     = "the Quad arms, first over 0 s to 2 s"
basis    = "Rule"
expected = "never"
measured = "never"

[[expect]]
what     = "the Quad arms, first over 2 s to 2.1 s"
basis    = "Rule"
expected = "0.004125 s ± 0.000001 s"
measured = "0.00413 s"

[[expect]]
what     = "mixer throttle at 2.005 s"
basis    = "Rule"
expected = "0% ± 0%"
measured = "0%"

[[expect]]
what     = "mixer throttle at 2.009 s"
basis    = "Rule"
expected = "15% ± 0.001%"
measured = "15.0%"

[[expect]]
what     = "the Quad disarms, first over 2 s to 4 s"
basis    = "Rule"
expected = "never"
measured = "never"

[[expect]]
what     = "the Quad disarms, first over 3.9 s to 4.1 s"
basis    = "Rule"
expected = "0.100125 s ± 0.000001 s"
measured = "0.100 s"

[[expect]]
what     = "the Quad arms, first over 4 s to 6.5 s"
basis    = "Rule"
expected = "never"
measured = "never"

[[expect]]
what     = "the Quad arms, first over 6.5 s to 6.6 s"
basis    = "Rule"
expected = "0.004125 s ± 0.000001 s"
measured = "0.00413 s"

[[expect]]
what     = "the Quad disarms, first over 7 s to 9 s"
basis    = "Source"
expected = "between 1.497 s and 1.5082 s"
measured = "1.50 s"

[[expect]]
what     = "Failsafe ends, first over 9 s to 10.5 s"
basis    = "Source"
expected = "between 1.0 s and 1.0112 s"
measured = "1.01 s"

[[expect]]
what     = "the Quad arms, first over 9 s to 11 s"
basis    = "Rule"
expected = "never"
measured = "never"

[[expect]]
what     = "the Quad arms, first over 11 s to 11.1 s"
basis    = "Rule"
expected = "0.004125 s ± 0.000001 s"
measured = "0.00413 s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

