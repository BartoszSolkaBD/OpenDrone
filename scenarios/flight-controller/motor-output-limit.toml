# A motor output limit below 100% cuts the top of the motors' range and
# leaves idle where it was, as Betaflight 2026.6.2's `dshotInitEndpoints`
# (src/main/drivers/dshot.c) sets it. The Test Quad
# test/freestyle-5-output-limit-80 is the Freestyle 5″ with
# `motor_output_limit` at 80%, and with the Flight Controller's filters and
# loop shaping off, as in mixer-and-airmode.toml, so RC smoothing (#49) and
# throttle boost (#50) don't change a case's first frame: every number here is
# what Betaflight 2026.6.2 gives on that Tune, and stays so when those tickets
# land. Each case is a fresh, armed Flight Controller, one Radio Link frame and
# one loop, with nothing to correct but the centre stick's 0.11 °/s.
format = 2
name   = "A motor output limit of 80% cuts the top of the motors' range"

[start]
kind              = "flight controller"
quad              = "test/freestyle-5-output-limit-80"
attitude          = "level, heading 0°"
rotation          = "0 °/s"
armed             = true
flight_controller = "fresh"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

# Zero throttle: idle doesn't move.
[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "on"
crash_flip = "off"

[[case.expect]]
what  = "motor 1 DShot"
value = "158 ± 0"
basis = "source: dshotInitEndpoints: the limit moves only the top; idle stays 48 + 5.5% × 1999 = 157.9, sent as 158"

# Half throttle: half of the shorter range.
[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "0%"
throttle = "50%"
arm      = "on"
crash_flip = "off"

[[case.expect]]
what  = "motor 1 DShot"
value = "862 ± 1"
basis = "source: dshotInitEndpoints and applyMixToMotors, with RC smoothing and throttle boost off: the top is 2047 - 1999 × (1 - 0.80) = 1647.2; 50% stick gives a throttle of 0.473, so 157.9 + (1647.2 - 157.9) × 0.473 = 862"

# Full throttle: the cut top.
[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "0%"
throttle = "100%"
arm      = "on"
crash_flip = "off"

[[case.expect]]
what  = "motor 3 DShot"
value = "1647 ± 0"
basis = "source: dshotInitEndpoints, with RC smoothing off so full stick is full throttle on the first loop: the top is 2047 - 1999 × (1 - 0.80) = 1647.2, sent as 1647"
