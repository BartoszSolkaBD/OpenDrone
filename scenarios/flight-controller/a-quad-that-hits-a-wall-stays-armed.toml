# A Freestyle 5″ flown into a wall at 10 m/s stays armed: a crash never
# disarms or resets the Quad on its own (ADR-0012). Betaflight 2026.6.2's
# defaults disarm on no hit: `crash_recovery` is OFF and
# `landing_disarm_threshold` is 0 (src/main/flight/pid.c). Only the Arm
# switch, Failsafe or Reset disarm, and armed, Airmode keeps every motor at
# idle or above.
#
# One default could: runaway takeoff prevention (`runaway_takeoff_prevention`
# ON, a guard against wiring and orientation mistakes, not simulated yet, #54)
# disarms a Quad whose PID sum on any axis stays at 600 or more (60% of the
# motor range) with the gyro moving for 75 ms, until half a second of normal
# flight switches it off (src/main/fc/core.c). Flown with the sticks centred
# below 40% throttle, as here, a Quad never counts as in that normal flight
# (core.c L885–895), so it would still be on. Since Prop Strikes (#45) the hit
# holds the pitch sum above 600 for about 300 ms (see below), long enough for
# it to disarm a real Quad on Betaflight's defaults. Ours doesn't simulate it
# yet, so this Scenario flies test/freestyle-5-no-runaway-takeoff-prevention,
# the Freestyle 5″ with that one setting off in its Tune, as other Scenarios
# do for settings not simulated yet; #54 can turn it back on.
#
# What the hit does (since the air, #42, and Prop Strikes, #45): rotor and
# body drag slow the Quad from 10 m/s to 7.8 m/s before it reaches the wall
# at about 0.555 s. Its front props strike the wall first and stop, and it
# bounces back at about 2 m/s. Their ESCs find them stalled and restart them,
# 0.1 s later and capped at the start-up power limit at first, so they run
# again by about 0.86 s; until then the Flight Controller asks for all the
# nose-up pitch it can, the pitch sum above 600 from about 0.556 s to 0.86 s,
# and the Quad tumbles. Running again, it settles in Acro about 51° nose down,
# so its thrust carries it back east into the wall at about 1.42 s, and it
# ends up pressed against the wall's face, nose in, still armed and flying.
# The first hit's first step kicks the PID sums to their limits (the gyro
# jumps in one step); the second is a series of knocks from about 1.41 s to
# 1.55 s, and the PID sums spike past ±20,000 at each. The Expectations leave
# those out.
#
# Since ground and ceiling effect (#119): tipped into the wall, its rotors
# blow at the wall's face and over its top, which cushions them, so the PID
# sums moved a little (the roll sum's lowest from 1.6 s to 3 s from 5.64 to
# 2.08, the speed east at 1 s from -0.0915 to -0.0858 m/s). The hit, the
# restarts, the second hit at about 1.41 s and where it ends up are the same.
#
# It starts 2 m up on the Test Map with a wall (its face 5 m east, facing
# west), level and armed, its motors "settled", flying east at 10 m/s with
# the sticks centred and the throttle at 30%.
format = 1
name   = "A Quad that hits a wall stays armed"

[start]
kind              = "flight"
quad              = "test/freestyle-5-no-runaway-takeoff-prevention"
map               = "test/wall"
position          = "0 m east, 0 m north, 2 m up"
attitude          = "level, heading 90°"
speed             = "10 m/s east, 0 m/s north, 0 m/s up"
rotation          = "0 °/s"
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s", roll = "0%", pitch = "0%", yaw = "0%", throttle = "30%", arm = "on" },
]

[[expect]]
what    = "distance east"
over    = "0 s to 1 s"
highest = "between 4.7 m and 5 m"
basis   = "rule: the wall's face is at 5 m east and the Quad never passes through it (ADR-0012), so it reaches the wall, its nose half its length short of the face"

[[expect]]
what  = "speed east"
at    = "1 s"
value = "-0.09 m/s ± 0.5 m/s"
basis = "observed: its front props strike the wall and it bounces back at about 2 m/s; running again, its props carry it back toward the wall, and at 1 s it is turning back (it was 1.36 m/s before Prop Strikes, #45, and 0.374 m/s with no air, #42)"

[[expect]]
what  = "the Quad disarms"
over  = "0 s to 3 s"
first = "never"
basis = "source: Betaflight 2026.6.2's defaults (crash_recovery OFF, landing_disarm_threshold 0, pid.c): nothing disarms on a hit, and the Arm switch stays on; runaway takeoff prevention, which on its defaults would disarm this Quad (see the PID sums below), is off in this Scenario's Tune, because the Flight Controller doesn't simulate that guard yet; #54 can turn it back on once it does"

[[expect]]
what   = "motor 1 DShot"
over   = "0.5 s to 3 s"
lowest = "between 158 and 2047"
basis  = "source: armed, Betaflight's mixer with Airmode never drops a motor below idle (48 + 5.5% × 1999 = 157.9, sent as 158)"

# While its struck front props restart, the pitch sum stays above 600 for
# about 300 ms; roll and yaw stay well below it. Pressed against the wall
# after the second hit, it asks next to nothing.

[[expect]]
what    = "pitch PID sum"
over    = "0 s to 0.55 s"
highest = "between -600 and 600"
basis   = "observed: before the hit, level flight asks next to nothing"

[[expect]]
what    = "pitch PID sum"
over    = "0.59 s to 1.04 s"
highest = "between 2000 and 3000"
basis   = "observed: with its front props struck and stopped, the Flight Controller asks for all the nose-up pitch it can until they run again"

[[expect]]
what   = "pitch PID sum"
over   = "0.556 s to 0.85 s"
lowest = "between 600 and 3000"
basis  = "observed: the pitch sum is above 600 from just after the hit until the struck props run again, about 0.86 s: about 300 ms, far longer than the 75 ms Betaflight's runaway takeoff prevention needs (RUNAWAY_TAKEOFF_ACTIVATE_DELAY, core.c)"

[[expect]]
what   = "pitch PID sum"
over   = "0.52 s to 1.4 s"
lowest = "between -600 and 600"
basis  = "observed: until the second hit, it never goes below -600"

[[expect]]
what   = "pitch PID sum"
over   = "1.04 s to 1.07 s"
lowest = "between -600 and 600"
basis  = "observed: its props running again, it flies back toward the wall nose down, asking next to nothing"

[[expect]]
what   = "pitch PID sum"
over   = "1.07 s to 1.10 s"
lowest = "between -600 and 600"
basis  = "observed: its props running again, it flies back toward the wall nose down, asking next to nothing"

[[expect]]
what   = "pitch PID sum"
