# Results of feedforward-at-250-hz.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "At 250 Hz, feedforward pushes ahead of the stick with boost, jitter attenuation, the max-rate limit, averaging and yaw hold"

[[expect]]
what     = "roll F term, mean over 0.6 s to 0.7 s"
basis    = "Source"
expected = "4.3377 ± 0.0001"
measured = "4.34"

[[expect]]
what     = "roll F term at 0.52 s"
basis    = "Source"
expected = "5.5138 ± 0.0001"
measured = "5.51"

[[expect]]
