expected = "-0.0009 ± 0.0001"
measured = "-0.000944"

[[expect]]
what     = "roll F term at 1.004 s"
basis    = "Source"
expected = "31.513 ± 0.001"
measured = "31.5"

[[expect]]
what     = "roll F term, highest over 1 s to 1.1 s"
basis    = "Source"
expected = "71.423 ± 0.001"
measured = "71.4"

[[expect]]
what     = "yaw F term at 1.6 s"
basis    = "Source"
expected = "19.580 ± 0.001"
measured = "19.6"

[[expect]]
what     = "yaw F term at 1.7 s"
basis    = "Source"
expected = "7.344 ± 0.001"
measured = "7.34"

[[expect]]
what     = "yaw F term at 1.9 s"
basis    = "Source"
expected = "1.033 ± 0.001"
measured = "1.03"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

