# Results of raceflight-rates.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Raceflight rates turn each stick into the rotation speed Betaflight gives"

[[expect]]
what     = "roll setpoint with the sticks at rest"
basis    = "Source"
expected = "0.29 °/s ± 0.01 °/s"
measured = "0.286 °/s"

[[expect]]
what     = "roll setpoint with roll 25%"
basis    = "Source"
expected = "60.94 °/s ± 0.01 °/s"
measured = "60.9 °/s"

[[expect]]
what     = "roll setpoint with roll 50%"
basis    = "Source"
expected = "168.86 °/s ± 0.01 °/s"
measured = "169 °/s"

[[expect]]
what     = "roll setpoint with roll 75%"
basis    = "Source"
expected = "365.44 °/s ± 0.01 °/s"
measured = "365 °/s"

[[expect]]
what     = "roll setpoint with roll 100%"
basis    = "Source"
expected = "666.00 °/s ± 0.01 °/s"
measured = "666 °/s"

[[expect]]
what     = "roll setpoint with roll -50%"
basis    = "Source"
expected = "-167.83 °/s ± 0.01 °/s"
measured = "-168 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "f047463a313d0d7a"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "abe42d7dc144feea"   # the Flight Controller's whole state after each of 6 cases, in order

[fingerprints.checkpoints]   # the Flight Controller's whole state after each case
