# The PID loop's terms follow Betaflight 2026.6.2's scaling, and I stops at
# its limit (`pidController`, src/main/flight/pid.c; the gains' scaling in
# `pidInitConfig`, src/main/flight/pid_init.c, and src/main/flight/pid.h).
#
# The Flight Controller alone, armed at half throttle (so I runs), fed gyro
# readings: still until 0.5 s, then rolling left at 1 °/s, then from 0.6 s
# rolling left at 100 °/s and yawing right at 100 °/s. The Freestyle 5″'s
# gains: roll P/I/D 45/80/30, yaw P/I 45/80. Each loop is 1/8000 s.
#
# It flies the Test Quad test/freestyle-5-filters-and-shaping-off: the
# Freestyle 5″ with the Flight Controller's filters and loop shaping switched
# off in its Tune, the way Betaflight 2026.6.2 reads "off": the gyro, D-term
# and yaw P low-passes, RC smoothing and feedforward (which come with #49),
# the dynamic notch (which waits for gyro noise, #21), and Dynamic D,
# I-term relax, anti-gravity, TPA and throttle boost (#50). So every number
# here is what Betaflight 2026.6.2 gives on that Tune, and stays so when
# those tickets land. On the 5″'s own
# Tune they would come out otherwise: its D-term low-passes would take the
# D term's kick down to about 1, for one.
#
# Centred sticks reach Betaflight at 1500.77 µs over CRSF (see
# actual-rates.toml), so Actual 70/670 asks for 0.10966 °/s on each axis: the
# roll error is 0.10966 °/s while still, 1.10966 °/s rolling left at 1 °/s and
# 100.10966 °/s at 100 °/s.
#
# Terms are on Betaflight's scale (1000 is the whole motor range), signed the
# pilot's way: a positive roll term pushes the Quad to roll right, a negative
# yaw term pushes the nose left.
format = 2
name   = "The PID loop's terms follow Betaflight's scaling, and I stops at its limit"

[start]
kind              = "flight controller"
quad              = "test/freestyle-5-filters-and-shaping-off"
attitude          = "level, heading 0°"
rotation          = "0 °/s"
armed             = true
flight_controller = "fresh"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s",   roll = "0%", pitch = "0%", yaw = "0%", throttle = "50%", arm = "on", crash_flip = "off" },
  { at = "0.5 s", rotation = "roll -1 °/s, pitch 0 °/s, yaw 0 °/s" },
  { at = "0.6 s", rotation = "roll -100 °/s, pitch 0 °/s, yaw 100 °/s" },
]

[[expect]]
what  = "roll I term"
at    = "0.5 s"
value = "1.0719 ± 0.0001"
basis = "source: pidController, with anti-gravity and I-term relax off: I grows by 0.244381 × I gain × error ÷ 8000 each loop: 4000 loops at 0.10966 °/s give 0.244381 × 80 × 0.10966 × 4000 ÷ 8000 = 1.0719"

[[expect]]
what  = "roll D term"
at    = "0.500125 s"
value = "126.96 ± 0.01"
basis = "source: pidController, with the gyro and D-term low-passes, TPA and Dynamic D off: D = 0.000529 × D gain × how fast the gyro falls, per second; on the first loop rolling left the gyro reading drops by 1 °/s in 1/8000 s, so D = 0.000529 × 30 × 1 × 8000 = 126.96"

[[expect]]
what  = "roll D term"
at    = "0.55 s"
value = "0 ± 0"
basis = "source: pidController: D works on the gyro's change, and a steady roll doesn't change it"

[[expect]]
what  = "roll P term"
at    = "0.55 s"
value = "1.5994 ± 0.0001"
basis = "source: pidController: P = 0.032029 × P gain × error = 0.032029 × 45 × 1.10966 = 1.5994"

[[expect]]
what  = "roll I term"
at    = "0.61 s"
value = "22.813 ± 0.001"
basis = "source: pidController, with anti-gravity, I-term relax and the gyro low-passes off: 0.244381 × 80 ÷ 8000 × (4000 loops × 0.10966 + 800 loops × 1.10966 + 80 loops × 100.10966) = 22.813"

[[expect]]
what  = "roll P term"
at    = "0.7 s"
value = "144.29 ± 0.01"
basis = "source: pidController: P = 0.032029 × 45 × 100.10966 = 144.29"

[[expect]]
what  = "yaw P term"
at    = "0.7 s"
value = "-143.97 ± 0.01"
basis = "source: pidController, with the yaw P low-pass off: yawing right at 100 °/s against a setpoint of 0.10966 °/s nose right, the error is 99.89 °/s nose left: P = 0.032029 × 45 × 99.89 = 143.97, pushing the nose left"

[[expect]]
what  = "roll I term"
at    = "1.5 s"
value = "400 ± 0"
basis = "source: pidInitConfig and pidController: I stops at iterm_windup 80% of pidsum_limit 500 = 400; growing 0.24 a loop, it got there 0.2 s after 0.6 s"

[[expect]]
what  = "yaw I term"
at    = "1.5 s"
value = "-320 ± 0"
basis = "source: pidInitConfig and pidController: yaw's I stops at iterm_windup 80% of pidsum_limit_yaw 400 = 320; yaw's I gain counts 2.5 times, so it got there 0.07 s after 0.6 s"

[[expect]]
what  = "roll PID sum"
at    = "1.5 s"
value = "544.29 ± 0.01"
basis = "source: pidController: P + I + D = 144.29 + 400 + 0; the PID-sum limit, 500, is the mixer's to apply"
