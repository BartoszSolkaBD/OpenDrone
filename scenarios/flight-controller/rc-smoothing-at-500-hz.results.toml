# Results of rc-smoothing-at-500-hz.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "At 500 Hz, RC smoothing smooths the setpoints and the throttle at 187 Hz"

