# Results of crash-flip-switch.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Crash Flip switch works only at the moment of arming, and turning it off disarms"

