# Feedforward follows Betaflight 2026.6.2 (`calculateFeedforward` and
# `updateFeedforwardFilters`, src/main/fc/rc.c; `pidInitConfig`,
# src/main/flight/pid_init.c; the F term in `pidController`,
# src/main/flight/pid.c; the Betaflight research §3 and §3.1), with the
# Freestyle 5″'s defaults: F 120 on roll and yaw, averaging 2_POINT, smooth
# factor 65, jitter factor 7, boost 15, max-rate limit 90, yaw hold gain 15
# over 100 ms. This is the 250 Hz half of a pair: feedforward-at-500-hz.toml
# flies the same Timeline over a 500 Hz Radio Link.
#
# Once a frame, each axis's feedforward is the setpoint's change times the
# frame's rate (the stick's speed, in °/s²), smoothed by two first-order
# low-passes (on the speed and on its change), each moving 0.35 of the way a
# frame at 250 Hz: time constant (1/250 s × 0.65) ÷ 0.35 = 7.43 ms, k =
# 4 ms ÷ (4 ms + 7.43 ms). Then:
#
# - Boost (roll, pitch): plus the smoothed change × 250 × 15 ÷ 1000.
# - Jitter attenuation: × min(1, (the stick's change over the last two
#   frames, averaged, in µs, + 1) ÷ (1 + 7)).
# - Max-rate limit (roll, pitch): pushing outwards, held within (670 °/s −
#   |setpoint|) × 90.
# - Yaw hold (yaw): plus 15 × (the setpoint − the setpoint low-passed with a
#   100 ms time constant).
# - Averaging: the mean of this frame's and the last.
#
# RC smoothing's PT3 at 93 Hz (rc-smoothing-at-250-hz.toml) then smooths it
# every loop, and F = 0.013754 × 120 ÷ 100 × feedforward = 0.016505 ×
# feedforward. The receiver is ExpressLRS on CRSF, for which Betaflight
# doesn't treat repeated frames specially (`feedforwardInterpolate` is off).
#
# The Rates are Actual with center sensitivity and max rate both 670 °/s, so
# the setpoint is a straight line, 670 °/s × the stick: 1.34 °/s for each µs.
# The Flight Controller alone, armed, the sticks centred, the throttle at
# 0%. From 0.5 s to 0.7 s the roll stick ramps from 0% to 20%, 512 µs a
# second, about 2.05 µs a frame (3 or 4 receiver steps of 0.62477 µs); at
# 1 s it jumps to 90% (618.05 °/s) and at 1.2 s back to centre; at 1.5 s
# the yaw stick jumps to 30% right (206.15 °/s) and holds.
#
# Each value is worked out frame by frame and loop by loop from Betaflight's
# formulas; each basis says which part shows, and what the value would be
# without it.
#
# It flies the Test Quad test/freestyle-5-loop-shaping-off, with the loop
# shaping #50 brings off.
format = 2
name   = "At 250 Hz, feedforward pushes ahead of the stick with boost, jitter attenuation, the max-rate limit, averaging and yaw hold"

[start]
kind              = "flight controller"
quad              = "test/freestyle-5-loop-shaping-off"
attitude          = "level, heading 0°"
rotation          = "0 °/s"
armed             = true
flight_controller = "fresh"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
type               = "Actual"
roll               = "center sensitivity 670 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 670 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 670 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s",   roll = "0%", pitch = "0%", yaw = "0%", throttle = "0%", arm = "on", crash_flip = "off" },
  { at = "0.5 s", roll = "0%" },
  { at = "0.7 s", roll = "ramp to 20%" },
  { at = "1 s",   roll = "90%" },
  { at = "1.2 s", roll = "0%" },
  { at = "1.5 s", yaw = "30%" },
]

[[expect]]
what  = "roll F term"
over  = "0.6 s to 0.7 s"
mean  = "4.3377 ± 0.0001"
basis = "source: calculateFeedforward: the ramp's speed is about 2.05 µs × 1.34 °/s per µs × 250 = 686 °/s², and jitter attenuation lets (2.05 + 1) ÷ 8 = 0.38 of it through: F ≈ 0.016505 × 686 × 0.38 = 4.3; frame by frame, with the steps' 3s and 4s, the mean is 4.3377. At 500 Hz each frame moves the stick half as far, so attenuation lets less through (feedforward-at-500-hz.toml: 2.8655)"

[[expect]]
what  = "roll F term"
at    = "0.52 s"
value = "5.5138 ± 0.0001"
basis = "source: calculateFeedforward: 20 ms into the ramp, boost adds the stick's acceleration as the speed's low-pass catches up; without boost it would be 3.1215"

[[expect]]
what  = "roll F term"
at    = "0.8 s"
value = "-0.0009 ± 0.0001"
basis = "source: calculateFeedforward: 100 ms after the stick stops, the speed has fallen to nothing; boost pulled a little the other way as it slowed"

[[expect]]
what  = "roll F term"
at    = "1.004 s"
value = "31.513 ± 0.001"
basis = "source: calculateFeedforward: the frame at 1 s jumps the setpoint by 480.5 °/s, but pushing outwards near the max rate feedforward is held within (670 − 618.05) × 90 = 4675.7; averaged with the frame before's 0 that is 2337.9, of which RC smoothing's PT3 has passed 81.7% by the next frame: 0.016505 × 2337.9 × 0.817 = 31.513. Without averaging it would be twice that"

[[expect]]
what    = "roll F term"
over    = "1 s to 1.1 s"
highest = "71.423 ± 0.001"
basis   = "source: calculateFeedforward: the max-rate limit holds it under 0.016505 × 4675.7 = 77.17 while the speed fades; without the limit the jump would give 1098.1"

[[expect]]
what  = "yaw F term"
at    = "1.6 s"
value = "19.580 ± 0.001"
basis = "source: calculateFeedforward: 100 ms after the yaw stick stops moving, its speed is long gone, but yaw hold still adds 15 × (206.15 °/s − the setpoint low-passed over 100 ms), about 15 × 206.15 × e⁻¹: without yaw hold it would be 0.0017"

[[expect]]
what  = "yaw F term"
at    = "1.7 s"
value = "7.344 ± 0.001"
basis = "source: calculateFeedforward: yaw hold fades with its 100 ms time constant, about e⁻² of the jump by now"

[[expect]]
what  = "yaw F term"
at    = "1.9 s"
value = "1.033 ± 0.001"
basis = "source: calculateFeedforward: yaw hold, 400 ms after the jump"
