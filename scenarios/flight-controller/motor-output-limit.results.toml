# Results of motor-output-limit.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A motor output limit of 80% cuts the top of the motors' range"

[[expect]]
what     = "motor 1 DShot with arm on"
basis    = "Source"
expected = "158 ± 0"
measured = "158"

[[expect]]
what     = "motor 1 DShot with throttle 50%, arm on"
basis    = "Source"
expected = "862 ± 1"
measured = "862"

[[expect]]
what     = "motor 3 DShot with throttle 100%, arm on"
basis    = "Source"
expected = "1647 ± 0"
measured = "1650"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "0cfe864fbce222d0"   # test/freestyle-5-output-limit-80: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "079e5f6a7c1cda8f"   # the Flight Controller's whole state after each of 3 cases, in order

[fingerprints.checkpoints]   # the Flight Controller's whole state after each case
"case 1" = "29a34b2004ee0209"
"case 2" = "7e6dc34e5f204e8e"
"case 3" = "6c07e1a9ee3b37f2"
