# Results of motor-output-limit.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A motor output limit of 80% cuts the top of the motors' range"

[[expect]]
what     = "motor 1 DShot with arm on"
basis    = "Source"
expected = "158 ± 0"
measured = "158"

[[expect]]
what     = "motor 1 DShot with throttle 50%, arm on"
basis    = "Source"
expected = "862 ± 1"
measured = "862"

[[expect]]
what     = "motor 3 DShot with throttle 100%, arm on"
basis    = "Source"
expected = "1647 ± 0"
measured = "1650"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "50e217087618f889"   # test/freestyle-5-output-limit-80: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "c14d08426e013378"   # the Flight Controller's whole state after each of 3 cases, in order

[fingerprints.checkpoints]   # the Flight Controller's whole state after each case
"case 1" = "4d5ec472ef093de0"
"case 2" = "3841cbfee45a17b7"
"case 3" = "7ea03fbd08d5012f"
