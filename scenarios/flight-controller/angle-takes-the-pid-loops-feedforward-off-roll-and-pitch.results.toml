# Results of angle-takes-the-pid-loops-feedforward-off-roll-and-pitch.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "In Angle, the PID loop's F term is 0 on roll and pitch, and yaw keeps its own"

[[expect]]
what     = "roll F term, highest over 0.5 s to 0.8 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "roll F term, lowest over 0.5 s to 0.8 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "pitch F term, highest over 0.5 s to 0.8 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "pitch F term, lowest over 0.5 s to 0.8 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "yaw F term, mean over 0.55 s to 0.7 s"
basis    = "Source"
expected = "between 5 and 40"
measured = "26.1"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "397d2701f3212342"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "569850fa173e5bde"   # the whole state after each of 6400 steps at 8000 Hz, in order

