# Results of endless-battery-off-lets-the-charge-fall.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "With Endless Battery off, the same punch draws the charge down and the voltage sags the same"

[[expect]]
what     = "battery charge at 8 s"
basis    = "Rule"
expected = "97.1% ± 0.1%"
measured = "97.1%"

[[expect]]
what     = "battery current, highest over 5 s to 7 s"
basis    = "Observed"
expected = "18.4 A ± 0.5 A"
measured = "18.3 A"

[[expect]]
what     = "battery sag, highest over 5 s to 7 s"
basis    = "Rule"
expected = "0.72 V ± 0.02 V"
measured = "0.716 V"

[[expect]]
what     = "battery charge used at 8 s"
basis    = "Observed"
expected = "9.24 mAh ± 0.3 mAh"
measured = "9.20 mAh"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "7e45b8c6b4fcd541"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "3e062625bd586178"   # the whole state after each of 64000 steps at 8000 Hz, in order

