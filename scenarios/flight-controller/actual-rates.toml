# The Flight Controller alone, fed one stick at a time: Actual rates (the
# Betaflight App's center sensitivity, max rate and expo) give each axis's
# setpoint as Betaflight 2026.6.2 does. Each case is a fresh Flight
# Controller, one Radio Link frame and one loop. Pitch forward and yaw right
# show the directions; full yaw shows the rate limit.
#
# Each stick reaches the Flight Controller as an ExpressLRS receiver hands it
# over CRSF (ELRS puts -100%, centre and +100% at steps 172, 992 and 1811),
# and Betaflight 2026.6.2 reads step s as 0.62477120 × s + 881 µs
# (`crsfReadRawRC`, src/main/rx/crsf.c). The stick's deflection is then
# (µs - 1500) ÷ 500, held within -1 to 1, and turned round for yaw
# (`updateRcCommands`, src/main/fc/rc.c), so it sits a little off the
# percent, as on a real quad on ELRS:
#
# | Stick | CRSF step | µs       | Deflection |
# |-------|-----------|----------|------------|
# |    0% |       992 | 1500.773 |    0.00155 |
# |   25% |      1196 | 1628.226 |    0.25645 |
# |   50% |      1401 | 1756.304 |    0.51261 |
# |   75% |      1606 | 1884.383 |    0.76877 |
# |  100% |      1811 | 2012.461 |    1.00000 |
# |  -50% |       582 | 1244.617 |   -0.51077 |
#
# Full stick reads 2012.46 µs, more than 500 µs from centre, so its deflection
# is held at exactly 1.
format = 1
name   = "Actual rates turn each stick into the rotation speed Betaflight gives"

[start]
kind              = "flight controller"
quad              = "opendrone/freestyle-5"
attitude          = "level, heading 0°"
rotation          = "0 °/s"
armed             = false
flight_controller = "fresh"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.54"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.54"
yaw                = "center sensitivity 200 °/s, max rate 1000 °/s, expo 0.00"
rate_limit         = "roll 1998 °/s, pitch 1998 °/s, yaw 800 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "0.11 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): 70 °/s × x + (670 - 70) °/s × |x| × (0.54 x⁵ + 0.46 x), with x = 0.00155 for 0% roll"

[[case]]
roll     = "25%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "36.20 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): 70 °/s × x + (670 - 70) °/s × |x| × (0.54 x⁵ + 0.46 x), with x = 0.25645 for 25% roll"

[[case]]
roll     = "50%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "114.28 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): 70 °/s × x + (670 - 70) °/s × |x| × (0.54 x⁵ + 0.46 x), with x = 0.51261 for 50% roll"

[[case]]
roll     = "75%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "283.81 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): 70 °/s × x + (670 - 70) °/s × |x| × (0.54 x⁵ + 0.46 x), with x = 0.76877 for 75% roll"

[[case]]
roll     = "100%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "670.00 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): 70 °/s × x + (670 - 70) °/s × |x| × (0.54 x⁵ + 0.46 x), with x = 1.00000 for 100% roll"

[[case]]
roll     = "-50%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "-113.51 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): 70 °/s × x + (670 - 70) °/s × |x| × (0.54 x⁵ + 0.46 x), with x = -0.51077 for -50% roll"

[[case]]
roll     = "0%"
pitch    = "50%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "pitch setpoint"
value = "-114.28 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): pitch forward asks for nose down, so the pitch setpoint is the roll curve's 114.28 °/s at x = 0.51261, nose down"

[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "50%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "yaw setpoint"
value = "312.74 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): 200 °/s × x + (1000 - 200) °/s × |x| × x, with x = 0.51261 for 50% yaw right, nose right"

[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "100%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "yaw setpoint"
value = "800.00 °/s ± 0.01 °/s"
basis = "source: applyActualRates and the rate limit (Betaflight 2026.6.2, src/main/fc/rc.c): full yaw asks for the max rate, 1000 °/s, held at yaw's rate limit, 800 °/s"
