expected = "186.059 ± 0.001"
measured = "186"

[[expect]]
what     = "yaw I term at 0.6 s"
basis    = "Source"
expected = "3.2158 ± 0.0001"
measured = "3.22"

[[expect]]
what     = "roll P term at 1.01 s"
