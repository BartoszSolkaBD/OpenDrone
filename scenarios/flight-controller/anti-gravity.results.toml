# Results of anti-gravity.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Anti-gravity strengthens I and P while the throttle moves fast, most at low throttle"

[[expect]]
what     = "roll P term at 0.5 s"
basis    = "Source"
expected = "14.5711 ± 0.0001"
measured = "14.6"

[[expect]]
what     = "roll I term at 0.5 s"
basis    = "Source"
expected = "98.824 ± 0.001"
measured = "98.8"

[[expect]]
what     = "roll P term at 0.51 s"
basis    = "Source"
expected = "29.303 ± 0.001"
measured = "29.3"

[[expect]]
what     = "roll P term at 0.6 s"
basis    = "Source"
expected = "16.4376 ± 0.001"
measured = "16.4"

[[expect]]
what     = "roll I term at 0.6 s"
basis    = "Source"
expected = "186.059 ± 0.001"
measured = "186"

[[expect]]
what     = "yaw I term at 0.6 s"
basis    = "Source"
expected = "3.2158 ± 0.0001"
measured = "3.22"

[[expect]]
what     = "roll P term at 1.01 s"
basis    = "Source"
expected = "16.555 ± 0.001"
measured = "16.6"

[[expect]]
what     = "roll I term at 1.1 s"
basis    = "Source"
expected = "297.172 ± 0.001"
measured = "297"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

