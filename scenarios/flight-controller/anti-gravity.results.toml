# Results of anti-gravity.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Anti-gravity strengthens I and P while the throttle moves fast, most at low throttle"

[[expect]]
what     = "roll P term at 0.5 s"
basis    = "Source"
expected = "14.5711 ± 0.0001"
measured = "14.6"

[[expect]]
what     = "roll I term at 0.5 s"
basis    = "Source"
expected = "98.824 ± 0.001"
measured = "98.8"

[[expect]]
