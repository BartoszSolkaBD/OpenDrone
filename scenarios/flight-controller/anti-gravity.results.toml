expected = "186.059 ± 0.001"
measured = "186"

[[expect]]
what     = "yaw I term at 0.6 s"
basis    = "Source"
expected = "3.2158 ± 0.0001"
measured = "3.22"

[[expect]]
what     = "roll P term at 1.01 s"
basis    = "Source"
expected = "16.555 ± 0.001"
measured = "16.6"

[[expect]]
what     = "roll I term at 1.1 s"
basis    = "Source"
expected = "297.172 ± 0.001"
measured = "297"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

