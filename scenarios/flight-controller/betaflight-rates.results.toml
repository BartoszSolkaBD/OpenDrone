# Results of betaflight-rates.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Betaflight rates turn each stick into the rotation speed Betaflight gives"

[[expect]]
what     = "roll setpoint with the sticks at rest"
basis    = "Source"
expected = "0.25 °/s ± 0.01 °/s"
measured = "0.248 °/s"

[[expect]]
what     = "roll setpoint with roll 25%"
basis    = "Source"
expected = "50.22 °/s ± 0.01 °/s"
measured = "50.2 °/s"

[[expect]]
what     = "roll setpoint with roll 50%"
basis    = "Source"
expected = "132.23 °/s ± 0.01 °/s"
measured = "132 °/s"

[[expect]]
what     = "roll setpoint with roll 75%"
basis    = "Source"
expected = "296.57 °/s ± 0.01 °/s"
measured = "297 °/s"

[[expect]]
what     = "roll setpoint with roll 100%"
basis    = "Source"
expected = "666.67 °/s ± 0.01 °/s"
measured = "667 °/s"

[[expect]]
what     = "roll setpoint with roll -50%"
basis    = "Source"
expected = "-131.44 °/s ± 0.01 °/s"
measured = "-131 °/s"

[[expect]]
what     = "pitch setpoint with pitch 25%"
basis    = "Source"
expected = "-319.31 °/s ± 0.01 °/s"
measured = "-319 °/s"

[[expect]]
what     = "pitch setpoint with pitch 75%"
basis    = "Source"
expected = "-1500.00 °/s ± 0.01 °/s"
measured = "-1500 °/s"

[[expect]]
what     = "yaw setpoint with yaw 50%"
basis    = "Source"
expected = "102.52 °/s ± 0.01 °/s"
measured = "103 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

