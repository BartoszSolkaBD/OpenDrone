quad = "f047463a313d0d7a"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "cd2831041fb0f223"   # test/wall
run  = "85c62d4a2e835b10"   # the whole state after each of 8000 steps at 8000 Hz, in order

