# Results of a-quad-pinned-against-a-wall-right-after-arming-disarms.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Quad pinned against a wall right after arming disarms, as runaway takeoff prevention does"

[[expect]]
what     = "the Quad disarms, first over 0 s to 0.55 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "pitch PID sum, lowest over 0.556 s to 0.63 s"
basis    = "Observed"
expected = "between 600 and 3000"
measured = "2160"

[[expect]]
what     = "the Quad disarms, first over 0.55 s to 1 s"
basis    = "Source"
expected = "0.0805 s ± 0.002 s"
measured = "0.0808 s"

[[expect]]
what     = "RUNAWAY blocks arming, first over 0.55 s to 1 s"
basis    = "Source"
expected = "0.0805 s ± 0.002 s"
measured = "0.0808 s"

[[expect]]
what     = "runaway takeoff prevention switches off, first over 0 s to 1 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "motor 1 DShot, highest over 0.7 s to 1 s"
basis    = "Source"
expected = "between 0 and 20"
measured = "0"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "397d2701f3212342"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "cd2831041fb0f223"   # test/wall
run  = "05ab61a1f03554f2"   # the whole state after each of 8000 steps at 8000 Hz, in order

