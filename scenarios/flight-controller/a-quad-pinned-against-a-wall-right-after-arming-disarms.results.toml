quad = "4c5647a527aa025f"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "cd2831041fb0f223"   # test/wall
run  = "103d0ab9097058be"   # the whole state after each of 8000 steps at 8000 Hz, in order

