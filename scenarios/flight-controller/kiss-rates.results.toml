# Results of kiss-rates.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "KISS rates turn each stick into the rotation speed Betaflight gives"

[[expect]]
what     = "roll setpoint with the sticks at rest"
basis    = "Source"
expected = "0.25 °/s ± 0.01 °/s"
measured = "0.248 °/s"

[[expect]]
what     = "roll setpoint with roll 25%"
basis    = "Source"
expected = "50.83 °/s ± 0.01 °/s"
measured = "50.8 °/s"

[[expect]]
what     = "roll setpoint with roll 50%"
basis    = "Source"
expected = "136.32 °/s ± 0.01 °/s"
measured = "136 °/s"

[[expect]]
what     = "roll setpoint with roll 75%"
basis    = "Source"
expected = "305.67 °/s ± 0.01 °/s"
measured = "306 °/s"

[[expect]]
what     = "roll setpoint with roll 100%"
basis    = "Source"
expected = "666.67 °/s ± 0.01 °/s"
measured = "667 °/s"

[[expect]]
what     = "roll setpoint with roll -50%"
basis    = "Source"
expected = "-135.50 °/s ± 0.01 °/s"
measured = "-135 °/s"

[[expect]]
what     = "pitch setpoint with pitch 50%"
basis    = "Source"
expected = "-530.80 °/s ± 0.01 °/s"
measured = "-531 °/s"

[[expect]]
what     = "pitch setpoint with pitch 100%"
basis    = "Source"
expected = "-1998.00 °/s ± 0.01 °/s"
measured = "-2000 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

