# Results of mirrored-sticks.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Mirrored sticks give a mirrored flight"

[[expect]]
what     = "roll rate at 0.9 s, as a share of the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "-100% ± 0.001%"
measured = "-100%"

[[expect]]
what     = "yaw rate at 0.9 s, as a share of the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "-100% ± 0.001%"
measured = "-100%"

[[expect]]
what     = "pitch rate at 0.9 s, minus the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "0 °/s ± 0.001 °/s"
measured = "0.000000000000254 °/s"

[[expect]]
what     = "distance east at 1 s, as a share of the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "-100% ± 0.001%"
measured = "-100%"

[[expect]]
what     = "distance north at 1 s, minus the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "0 m ± 0.000001 m"
measured = "-0.0000000000000107 m"

[[expect]]
what     = "height at 1 s, minus the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "0 m ± 0.000001 m"
measured = "-0.00000000000000711 m"

[[expect]]
what     = "roll rate at 0.65 s, as a share of the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "-100% ± 0.001%"
measured = "-100%"

[[expect]]
what     = "yaw rate at 0.65 s, as a share of the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "-100% ± 0.001%"
measured = "-100%"

[[expect]]
what     = "pitch rate at 0.65 s, minus the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "0 °/s ± 0.001 °/s"
measured = "0.0000000000000827 °/s"

[[expect]]
what     = "distance east at 0.65 s, as a share of the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "-100% ± 0.001%"
measured = "-100%"

[[expect]]
what     = "distance north at 0.65 s, minus the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "0 m ± 0.000001 m"
measured = "-0.00000000000000400 m"

[[expect]]
what     = "height at 0.65 s, minus the same run with roll and yaw mirrored"
basis    = "Rule"
expected = "0 m ± 0.000001 m"
measured = "0 m"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

