# Results of pid-scaling-and-limits.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The PID loop's terms follow Betaflight's scaling, and I stops at its limit"

[[expect]]
what     = "roll I term at 0.5 s"
basis    = "Source"
expected = "1.0719 ± 0.0001"
measured = "1.07"

[[expect]]
what     = "roll D term at 0.500125 s"
basis    = "Source"
expected = "126.96 ± 0.01"
measured = "127"

[[expect]]
what     = "roll D term at 0.55 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "roll P term at 0.55 s"
basis    = "Source"
expected = "1.5994 ± 0.0001"
measured = "1.60"

[[expect]]
what     = "roll I term at 0.61 s"
basis    = "Source"
expected = "22.813 ± 0.001"
measured = "22.8"

[[expect]]
what     = "roll P term at 0.7 s"
basis    = "Source"
expected = "144.29 ± 0.01"
measured = "144"

[[expect]]
what     = "yaw P term at 0.7 s"
basis    = "Source"
expected = "-143.97 ± 0.01"
measured = "-144"

[[expect]]
what     = "roll I term at 1.5 s"
basis    = "Source"
expected = "400 ± 0"
measured = "400"

[[expect]]
what     = "yaw I term at 1.5 s"
basis    = "Source"
expected = "-320 ± 0"
measured = "-320"

[[expect]]
what     = "roll PID sum at 1.5 s"
basis    = "Source"
expected = "544.29 ± 0.01"
measured = "544"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

