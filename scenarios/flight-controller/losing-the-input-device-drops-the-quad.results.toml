# Results of losing-the-input-device-drops-the-quad.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Losing the Input Device drops the Quad"

[[expect]]
what     = "mixer throttle at 1.29 s"
basis    = "Source"
expected = "25.7% ± 0.001%"
measured = "25.7%"

[[expect]]
what     = "mixer throttle at 1.4 s"
basis    = "Source"
expected = "0% ± 0.01%"
measured = "0%"

[[expect]]
what     = "motor 1 DShot at 1.4 s"
basis    = "Source"
expected = "between 158 and 200"
measured = "159"

[[expect]]
what     = "the Quad disarms, first over 1 s to 3 s"
basis    = "Source"
expected = "between 1.497 s and 1.5082 s"
measured = "1.50 s"

[[expect]]
what     = "motor 1 DShot at 2.6 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "motor 1 speed at 3 s"
basis    = "Observed"
expected = "between 0 RPM and 3000 RPM"
measured = "140 RPM"

[[expect]]
what     = "vertical speed at 4 s"
basis    = "Observed"
expected = "-18.8 m/s ± 0.5 m/s"
measured = "-18.8 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

