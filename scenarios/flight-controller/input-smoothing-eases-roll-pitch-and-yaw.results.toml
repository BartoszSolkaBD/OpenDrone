basis    = "Rule"
expected = "-67.73% ± 0.15%"
measured = "-67.7%"

[[expect]]
what     = "yaw channel at 1.012125 s"
basis    = "Rule"
expected = "67.73% ± 0.15%"
measured = "67.8%"

[[expect]]
what     = "roll channel at 1.032125 s"
basis    = "Rule"
expected = "95.10% ± 0.15%"
measured = "95.1%"

[[expect]]
what     = "roll channel at 1.100125 s"
basis    = "Rule"
expected = "100% ± 0.1%"
measured = "100%"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

