# Results of input-smoothing-eases-roll-pitch-and-yaw.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Input smoothing eases roll, pitch and yaw with a gentle 15 Hz low-pass and leaves the throttle"

[[expect]]
what     = "roll channel at 1.000125 s"
basis    = "Rule"
expected = "0.06% ± 0.01%"
measured = "0.0610%"

[[expect]]
what     = "throttle channel at 1.000125 s"
basis    = "Rule"
expected = "50% ± 0.1%"
measured = "50.0%"

[[expect]]
what     = "roll channel at 1.012125 s"
basis    = "Rule"
expected = "67.73% ± 0.15%"
measured = "67.8%"

[[expect]]
what     = "pitch channel at 1.012125 s"
basis    = "Rule"
expected = "-67.73% ± 0.15%"
measured = "-67.7%"

[[expect]]
what     = "yaw channel at 1.012125 s"
basis    = "Rule"
expected = "67.73% ± 0.15%"
measured = "67.8%"

[[expect]]
what     = "roll channel at 1.032125 s"
basis    = "Rule"
expected = "95.10% ± 0.15%"
measured = "95.1%"

[[expect]]
what     = "roll channel at 1.100125 s"
basis    = "Rule"
expected = "100% ± 0.1%"
measured = "100%"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

