# Results of input-smoothing-eases-roll-pitch-and-yaw.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Input smoothing eases roll, pitch and yaw with a gentle 15 Hz low-pass and leaves the throttle"

[[expect]]
what     = "roll channel at 1.000125 s"
basis    = "Rule"
expected = "0.06% ± 0.01%"
measured = "0.0610%"

[[expect]]
