basis    = "Rule"
expected = "50% ± 0.1%"
measured = "50.0%"

[[expect]]
what     = "roll channel at 1.012125 s"
basis    = "Rule"
expected = "67.73% ± 0.15%"
measured = "67.8%"

[[expect]]
