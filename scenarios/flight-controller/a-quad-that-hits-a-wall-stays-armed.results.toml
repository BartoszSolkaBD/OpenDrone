# Results of a-quad-that-hits-a-wall-stays-armed.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Quad that hits a wall stays armed"

[[expect]]
what     = "distance east, highest over 0 s to 1 s"
basis    = "Rule"
expected = "between 4.7 m and 5 m"
measured = "4.86 m"

[[expect]]
what     = "speed east at 1 s"
basis    = "Observed"
expected = "0.374 m/s ± 0.5 m/s"
measured = "0.374 m/s"

[[expect]]
what     = "the Quad disarms, first over 0 s to 3 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "motor 1 DShot, lowest over 0.5 s to 3 s"
basis    = "Source"
expected = "between 158 and 2047"
measured = "158"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "b62cbcad064b73da"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "cd2831041fb0f223"   # test/wall
run  = "f6d31125cc5e95c3"   # the whole state after each of 24000 steps at 8000 Hz, in order

