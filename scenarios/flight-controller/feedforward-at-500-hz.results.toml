# Results of feedforward-at-500-hz.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "At 500 Hz, the same stick moves give feedforward tuned to the faster link"

[[expect]]
what     = "roll F term, mean over 0.6 s to 0.7 s"
basis    = "Source"
expected = "2.8655 ± 0.0001"
measured = "2.87"

[[expect]]
what     = "roll F term at 0.52 s"
basis    = "Source"
expected = "4.1326 ± 0.0001"
measured = "4.13"

[[expect]]
what     = "roll F term, highest over 1 s to 1.1 s"
basis    = "Source"
expected = "76.773 ± 0.001"
measured = "76.8"

[[expect]]
what     = "yaw F term at 1.6 s"
basis    = "Source"
expected = "19.135 ± 0.001"
measured = "19.1"

[[expect]]
what     = "yaw F term at 1.7 s"
basis    = "Source"
expected = "7.109 ± 0.001"
measured = "7.11"

[[expect]]
what     = "yaw F term at 1.9 s"
basis    = "Source"
expected = "0.981 ± 0.001"
measured = "0.981"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

