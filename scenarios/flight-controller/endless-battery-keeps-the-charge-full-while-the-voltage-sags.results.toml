# Results of endless-battery-keeps-the-charge-full-while-the-voltage-sags.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "With Endless Battery on, the charge stays full while the voltage sags under a punch"

[[expect]]
what     = "battery charge, lowest over 0 s to 8 s"
basis    = "Rule"
expected = "100% ± 0.0001%"
measured = "100%"

[[expect]]
what     = "battery current, highest over 5 s to 7 s"
basis    = "Observed"
expected = "13.8 A ± 0.5 A"
measured = "13.8 A"

[[expect]]
what     = "battery sag, highest over 5 s to 7 s"
basis    = "Rule"
expected = "0.54 V ± 0.02 V"
measured = "0.540 V"

[[expect]]
what     = "battery charge used at 8 s"
basis    = "Observed"
expected = "9.24 mAh ± 0.3 mAh"
measured = "9.23 mAh"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "536ddc3d29a1db34"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "f67af2e1e6d4c9d5"   # the whole state after each of 64000 steps at 8000 Hz, in order

