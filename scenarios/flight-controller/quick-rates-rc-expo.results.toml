# Results of quick-rates-rc-expo.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Quick rates with RC expo bend the stick itself, as Betaflight does"

[[expect]]
what     = "pitch setpoint with pitch 25%"
basis    = "Source"
expected = "-33.33 °/s ± 0.01 °/s"
measured = "-33.3 °/s"

[[expect]]
what     = "pitch setpoint with pitch 50%"
basis    = "Source"
expected = "-101.08 °/s ± 0.01 °/s"
measured = "-101 °/s"

[[expect]]
what     = "pitch setpoint with pitch 75%"
basis    = "Source"
expected = "-265.48 °/s ± 0.01 °/s"
measured = "-265 °/s"

[[expect]]
what     = "pitch setpoint with pitch 100%"
basis    = "Source"
expected = "-670.00 °/s ± 0.01 °/s"
measured = "-670 °/s"

[[expect]]
what     = "pitch setpoint with pitch -50%"
basis    = "Source"
expected = "100.36 °/s ± 0.01 °/s"
measured = "100 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "0c4f9e5d0678cca4"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "01b99333c37c7a87"   # the Flight Controller's whole state after each of 5 cases, in order

[fingerprints.checkpoints]   # the Flight Controller's whole state after each case
