# Results of quick-rates.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Quick rates turn each stick into the rotation speed Betaflight gives"

[[expect]]
what     = "roll setpoint with the sticks at rest"
basis    = "Source"
expected = "0.31 °/s ± 0.01 °/s"
measured = "0.310 °/s"

[[expect]]
what     = "roll setpoint with roll 25%"
basis    = "Source"
expected = "62.54 °/s ± 0.01 °/s"
measured = "62.5 °/s"

[[expect]]
what     = "roll setpoint with roll 50%"
basis    = "Source"
expected = "160.09 °/s ± 0.01 °/s"
measured = "160 °/s"

[[expect]]
what     = "roll setpoint with roll 75%"
basis    = "Source"
expected = "333.73 °/s ± 0.01 °/s"
measured = "334 °/s"

[[expect]]
what     = "roll setpoint with roll 100%"
basis    = "Source"
expected = "670.00 °/s ± 0.01 °/s"
measured = "670 °/s"

[[expect]]
what     = "roll setpoint with roll -50%"
basis    = "Source"
expected = "-159.19 °/s ± 0.01 °/s"
measured = "-159 °/s"

[[expect]]
what     = "pitch setpoint with pitch 25%"
basis    = "Source"
expected = "-56.73 °/s ± 0.01 °/s"
measured = "-56.7 °/s"

[[expect]]
what     = "pitch setpoint with pitch 50%"
basis    = "Source"
expected = "-132.64 °/s ± 0.01 °/s"
measured = "-133 °/s"

[[expect]]
what     = "pitch setpoint with pitch 75%"
basis    = "Source"
expected = "-269.27 °/s ± 0.01 °/s"
measured = "-269 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

