basis    = "Source"
expected = "1 ± 0"
measured = "1.00"

[[expect]]
what     = "roll D term at 0.500125 s"
basis    = "Source"
expected = "126.960 ± 0.001"
measured = "127"

[[expect]]
what     = "TPA factor at 0.65 s"
