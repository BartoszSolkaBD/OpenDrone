# Results of tpa-cuts-the-d-term.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "TPA cuts the D term, and low-throttle TPA stops once the throttle passes its breakpoint"

