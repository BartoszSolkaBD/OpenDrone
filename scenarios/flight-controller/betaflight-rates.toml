# The Flight Controller alone, fed one stick at a time: "Betaflight" rates (RC
# rate, super rate and RC expo) give each axis's setpoint as Betaflight
# 2026.6.2 does. Each case is a fresh Flight Controller, one Radio Link frame
# and one loop. Pitch's RC rate of 2.20 shows the extra steepness above 2,
# and its rate limit cuts 75% stick.
#
# Each stick reaches the Flight Controller as an ExpressLRS receiver hands it
# over CRSF (ELRS puts -100%, centre and +100% at steps 172, 992 and 1811),
# and Betaflight 2026.6.2 reads step s as 0.62477120 × s + 881 µs
# (`crsfReadRawRC`, src/main/rx/crsf.c). The stick's deflection is then
# (µs - 1500) ÷ 500, held within -1 to 1, and turned round for yaw
# (`updateRcCommands`, src/main/fc/rc.c), so it sits a little off the
# percent, as on a real quad on ELRS:
#
# | Stick | CRSF step | µs       | Deflection |
# |-------|-----------|----------|------------|
# |    0% |       992 | 1500.773 |    0.00155 |
# |   25% |      1196 | 1628.226 |    0.25645 |
# |   50% |      1401 | 1756.304 |    0.51261 |
# |   75% |      1606 | 1884.383 |    0.76877 |
# |  100% |      1811 | 2012.461 |    1.00000 |
# |  -50% |       582 | 1244.617 |   -0.51077 |
#
# Full stick reads 2012.46 µs, more than 500 µs from centre, so its deflection
# is held at exactly 1.
format = 1
name   = "Betaflight rates turn each stick into the rotation speed Betaflight gives"

[start]
kind              = "flight controller"
quad              = "opendrone/freestyle-5"
attitude          = "level, heading 0°"
rotation          = "0 °/s"
armed             = false
flight_controller = "fresh"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
type               = "Betaflight"
roll               = "rc rate 1.00, rate 0.70, rc expo 0.20"
pitch              = "rc rate 2.20, rate 0.70, rc expo 0.00"
yaw                = "rc rate 1.00, rate 0.00, rc expo 0.00"
rate_limit         = "roll 1998 °/s, pitch 1500 °/s, yaw 1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "0.25 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): 200 °/s × 1.00 × (0.20 x|x|³ + 0.80 x) ÷ (1 - 0.70 |x|), with x = 0.00155 for 0% roll"

[[case]]
roll     = "25%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "50.22 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): 200 °/s × 1.00 × (0.20 x|x|³ + 0.80 x) ÷ (1 - 0.70 |x|), with x = 0.25645 for 25% roll"

[[case]]
roll     = "50%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "132.23 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): 200 °/s × 1.00 × (0.20 x|x|³ + 0.80 x) ÷ (1 - 0.70 |x|), with x = 0.51261 for 50% roll"

[[case]]
roll     = "75%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "296.57 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): 200 °/s × 1.00 × (0.20 x|x|³ + 0.80 x) ÷ (1 - 0.70 |x|), with x = 0.76877 for 75% roll"

[[case]]
roll     = "100%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "666.67 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): 200 °/s × 1.00 × (0.20 x|x|³ + 0.80 x) ÷ (1 - 0.70 |x|), with x = 1.00000 for 100% roll"

[[case]]
roll     = "-50%"
pitch    = "0%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "roll setpoint"
value = "-131.44 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): 200 °/s × 1.00 × (0.20 x|x|³ + 0.80 x) ÷ (1 - 0.70 |x|), with x = -0.51077 for -50% roll"

[[case]]
roll     = "0%"
pitch    = "25%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "pitch setpoint"
value = "-319.31 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): an RC rate above 2 counts 14.54 more for each unit past 2, so 2.20 counts 5.108: 200 °/s × 5.108 × x ÷ (1 - 0.70 |x|) at x = 0.25645 gives 319.31 °/s, nose down for pitch forward"

[[case]]
roll     = "0%"
pitch    = "75%"
yaw      = "0%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "pitch setpoint"
value = "-1500.00 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates and the rate limit (Betaflight 2026.6.2, src/main/fc/rc.c): 75% pitch asks for 1700 °/s, held at pitch's rate limit, 1500 °/s, nose down"

[[case]]
roll     = "0%"
pitch    = "0%"
yaw      = "50%"
throttle = "0%"
arm      = "off"

[[case.expect]]
what  = "yaw setpoint"
value = "102.52 °/s ± 0.01 °/s"
basis = "source: applyBetaflightRates (Betaflight 2026.6.2, src/main/fc/rc.c): with no super rate and no expo the curve is a straight line, 200 °/s × 1.00 × x, with x = 0.51261 for 50% yaw right, nose right"
