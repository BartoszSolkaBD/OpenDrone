expected = "between 1.497 s and 1.5082 s"
measured = "1.50 s"

[[expect]]
what     = "FAILSAFE blocks arming, first over 1 s to 3 s"
basis    = "Source"
expected = "between 1.497 s and 1.5082 s"
measured = "1.50 s"

[[expect]]
