basis    = "Source"
expected = "between 1.497 s and 1.5082 s"
measured = "1.50 s"

[[expect]]
what     = "FAILSAFE blocks arming, first over 1 s to 3 s"
basis    = "Source"
expected = "between 1.497 s and 1.5082 s"
measured = "1.50 s"

[[expect]]
what     = "motor 1 DShot at 2.6 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "NOT_DISARMED blocks arming, first over 4 s to 4.1 s"
