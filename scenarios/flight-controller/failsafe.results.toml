measured = "0.500 s"

[[expect]]
what     = "Failsafe ends, first over 4 s to 6 s"
basis    = "Source"
expected = "1.005125 s ± 0.000001 s"
measured = "1.01 s"

[[expect]]
what     = "FAILSAFE stops blocking arming, first over 4 s to 6 s"
basis    = "Source"
expected = "1.005125 s ± 0.000001 s"
measured = "1.01 s"

[[expect]]
what     = "the Quad arms, first over 4 s to 5.4 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "ARM_SWITCH stops blocking arming, first over 5.2 s to 5.3 s"
basis    = "Source"
expected = "0.000125 s ± 0.000001 s"
measured = "0.000125 s"

[[expect]]
what     = "the Quad arms, first over 5.4 s to 6 s"
basis    = "Source"
expected = "0.004125 s ± 0.000001 s"
measured = "0.00413 s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

