basis    = "Source"
expected = "47.3% ± 0.001%"
measured = "47.3%"

[[expect]]
what     = "mixer throttle at 1.4 s"
basis    = "Source"
expected = "0% ± 0.01%"
measured = "0%"

[[expect]]
