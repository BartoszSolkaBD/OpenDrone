# Results of failsafe.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Losing the Input Device runs Failsafe as Betaflight does, and flying again needs the link back and the Arm switch cycled"

[[expect]]
what     = "roll setpoint at 1.14 s"
basis    = "Source"
expected = "193.54 °/s ± 0.01 °/s"
measured = "194 °/s"

[[expect]]
what     = "RXLOSS blocks arming, first over 1 s to 2 s"
basis    = "Source"
expected = "between 0.146 s and 0.1465 s"
measured = "0.146 s"

[[expect]]
what     = "roll setpoint at 1.29 s"
basis    = "Source"
expected = "193.54 °/s ± 0.01 °/s"
measured = "194 °/s"

[[expect]]
