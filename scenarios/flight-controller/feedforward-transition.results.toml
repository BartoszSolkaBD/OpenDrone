# Results of feedforward-transition.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Feedforward's transition fades feedforward in from centre stick"

[[expect]]
what     = "roll F term, mean over 0.6 s to 0.7 s"
basis    = "Source"
expected = "1.2847 ± 0.0001"
measured = "1.28"

[[expect]]
what     = "roll F term at 0.65 s"
basis    = "Source"
expected = "1.3643 ± 0.0001"
measured = "1.36"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

