# Results of angle-asks-for-a-tilt.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "In Angle the sticks ask for a tilt, and the Flight Controller turns the Quad towards it"

[[expect]]
what     = "roll PID setpoint with throttle 50%, arm on"
basis    = "Source"
expected = "0.0491 °/s ± 0.0001 °/s"
measured = "0.0491 °/s"

[[expect]]
what     = "yaw PID setpoint with throttle 50%, arm on"
