quad = "59c46e1cf781ecbe"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "15cbeb4e88c44e72"   # test/flat-floor
run  = "9ee930502292b1ce"   # the whole state after each of 24000 steps at 8000 Hz, in order

