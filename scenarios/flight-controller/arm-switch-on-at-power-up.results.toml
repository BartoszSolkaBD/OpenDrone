quad = "aec02cafcbd83670"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "15cbeb4e88c44e72"   # test/flat-floor
run  = "235608086c78bb31"   # the whole state after each of 24000 steps at 8000 Hz, in order

