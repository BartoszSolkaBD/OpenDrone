# Results of runaway-takeoff-prevention-switches-off-once-the-flight-counts-as-stable.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Runaway takeoff prevention switches off once the flight counts as stable, and then never disarms"

[[expect]]
what     = "runaway takeoff prevention switches off, first over 0 s to 0.7 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "runaway takeoff prevention switches off, first over 0.7 s to 0.8 s"
basis    = "Source"
expected = "0.004125 s ± 0.000001 s"
measured = "0.00413 s"

[[expect]]
what     = "roll PID sum at 1 s"
basis    = "Source"
expected = "-1156.18 ± 0.01"
measured = "-1160"

[[expect]]
what     = "the Quad disarms, first over 0.9 s to 1.5 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "397d2701f3212342"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "d9f7a131466bd56e"   # the whole state after each of 12000 steps at 8000 Hz, in order

