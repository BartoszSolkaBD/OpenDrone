# The Freestyle 5″ with the loop shaping #50 brings switched off.    id: test/freestyle-5-loop-shaping-off
#
# The Flight Controller Scenarios that check the gyro's, the D term's and
# yaw P's low-passes, RC smoothing and feedforward (#49) work their numbers
# out from Betaflight's maths with those in place, and nothing else in
# between. On the 5″'s own Tune, Betaflight 2026.6.2 also puts Dynamic D,
# I-term relax, anti-gravity, TPA and throttle boost in the loop, which the
# Flight Controller doesn't simulate yet (#50): low-throttle TPA alone would
# cut the D term by up to 20% at zero throttle. This Test Quad switches each
# of them off in the Tune, the way Betaflight reads "off", so those
# Scenarios' numbers are what Betaflight 2026.6.2 gives on this Tune today,
# and still will once #50 lands. It switches off the dynamic notch too (it
# waits for gyro noise, #21), and runaway takeoff prevention, which would
# disarm a fresh Flight Controller holding a PID sum of 600 or more, with
# the gyro moving, for 75 ms. The filters, RC smoothing and feedforward are
# the Freestyle 5″'s.
#
# A Test Quad lists only what it changes, so any other change to the Freestyle
# 5″ carries into it. Only the Scenario runner reads Test Quads; pilots never
# fly them.
format   = 1
based_on = "opendrone/freestyle-5"
why      = "Dynamic D, I-term relax, anti-gravity, TPA, throttle boost and runaway takeoff prevention off, so Flight Controller Scenarios can check the filters, RC smoothing and feedforward on their own"

# Tune changes keep Betaflight's own units, as `tune.txt` does. Each is off as
# Betaflight 2026.6.2 reads it.
[tune]
d_max_roll = 0             # Dynamic D: a D max not above D gives no boost (pid_init.c)
d_max_pitch = 0
iterm_relax = "OFF"        # I-term relax off
anti_gravity_gain = 0      # anti-gravity: no I or P boost (pid.c, pidController)
tpa_rate = 0               # TPA: no cut above the breakpoint (pid_init.c)
tpa_low_rate = 0           # low-throttle TPA: no cut below its breakpoint
throttle_boost = 0         # no throttle boost (mixer.c, mixTable)
dyn_notch_count = 0        # the dynamic notch off (dyn_notch_filter.c, isDynNotchActive)
runaway_takeoff_prevention = "OFF" # no disarm on a PID sum held at 60% for 75 ms (core.c)
