# The Freestyle 5″ with runaway takeoff prevention off.    id: test/freestyle-5-no-runaway-takeoff-prevention
#
# Betaflight 2026.6.2 switches `runaway_takeoff_prevention` on by default: it
# disarms a Quad whose PID sum on any axis stays at 600 or more with the gyro
# moving for 75 ms, until the flight has counted as stable
# (src/main/fc/core.c), and the Flight Controller simulates it (#54). A
# Scenario that holds a PID sum that high before the flight counts as stable,
# such as a wall strike or a spin from a mid-air start, disarms on the
# Freestyle 5″'s own Tune, as a-quad-pinned-against-a-wall-right-after-arming-disarms.toml
# shows. This Test Quad switches the guard off as Betaflight reads "off", so
# such a Scenario shows what the Quad does with no guard to disarm it: the
# other half of that pair. Nothing else changes: unlike the other Test Quads
# that change the Tune, it keeps the Freestyle 5″'s filters and loop shaping,
# so a flight on it is the real Quad's flight.
#
# A Test Quad lists only what it changes, so any other change to the Freestyle
# 5″ carries into it. Only the Scenario runner reads Test Quads; pilots never
# fly them.
format   = 1
based_on = "opendrone/freestyle-5"
why      = "Runaway takeoff prevention off, so a Scenario that holds a PID sum high before the flight counts as stable shows what the Quad does without the guard disarming it"

# Tune changes keep Betaflight's own units, as `tune.txt` does.
[tune]
runaway_takeoff_prevention = "OFF" # no disarm on a PID sum held at 60% for 75 ms (core.c)
