# The Whoop 65 with its ducts' ram drag as its only drag.    id: test/whoop-65-ducts-only
#
# A Test Quad lists only what it changes, so any other change to the Whoop 65
# carries into it. Only the Scenario runner reads Test Quads; pilots never fly
# them.
format   = 1
based_on = "opendrone/whoop-65"
why      = "No body drag, no rotor drag and no Prop Wash, so what its ducts do shows on its own"

# Deliberate test values: no Confidence or source. Prop Wash is off too: a
# flare sinks the rotors into their own air, and its flicker would blur what
# the drag does on its own.
[frame]
drag_area = "front 0, side 0, top 0 cm²"

[props]
rotor_drag = "0 s⁻¹"

[feel]
prop_wash_strength = "0%"
