# The Freestyle 5″ with a feedforward transition of 50.    id: test/freestyle-5-feedforward-transition
#
# Betaflight 2026.6.2's `feedforward_transition` fades each axis's feedforward
# (yaw's too, not only roll and pitch's) towards centre stick: below a
# deflection of the setting's hundredths, feedforward is scaled by the
# deflection ÷ that (`calculateFeedforward`, src/main/fc/rc.c). Its default, which the Freestyle 5″ keeps, is 0: no
# fade. This Test Quad sets it to 50, so a Flight Controller Scenario can
# check the fade below half stick.
#
# As test/freestyle-5-loop-shaping-off does, it switches off Dynamic D,
# I-term relax, anti-gravity, TPA and throttle boost (#50), the dynamic notch
# (#21) and runaway takeoff prevention.
#
# A Test Quad lists only what it changes, so any other change to the Freestyle
# 5″ carries into it. Only the Scenario runner reads Test Quads; pilots never
# fly them.
format   = 1
based_on = "opendrone/freestyle-5"
why      = "A feedforward transition of 50, with the loop shaping #50 brings off, so a Flight Controller Scenario can check feedforward fading towards centre stick"

# Tune changes keep Betaflight's own units, as `tune.txt` does.
[tune]
feedforward_transition = 50 # below half stick, feedforward × deflection ÷ 0.5
d_max_roll = 0              # Dynamic D: a D max not above D gives no boost (pid_init.c)
d_max_pitch = 0
iterm_relax = "OFF"         # I-term relax off
anti_gravity_gain = 0       # anti-gravity: no I or P boost (pid.c, pidController)
tpa_rate = 0                # TPA: no cut above the breakpoint (pid_init.c)
tpa_low_rate = 0            # low-throttle TPA: no cut below its breakpoint
throttle_boost = 0          # no throttle boost (mixer.c, mixTable)
dyn_notch_count = 0         # the dynamic notch off (dyn_notch_filter.c, isDynNotchActive)
runaway_takeoff_prevention = "OFF" # no disarm on a PID sum held at 60% for 75 ms (core.c)
