# Results of whoop-falls-nose-first-faster.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Whoop 65 falling nose first reaches a faster terminal speed, 18.3 m/s"

[[expect]]
what     = "vertical speed at 1 s"
basis    = "Rule"
expected = "-8.9631 m/s ± 0.1%"
measured = "-8.96 m/s"

[[expect]]
what     = "vertical speed at 10 s"
basis    = "Rule"
expected = "-18.251 m/s ± 0.1%"
measured = "-18.3 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

