# Results of settled-motors-hold-a-hover.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Settled motors hold a Whoop 65 in a hover from the first step"

[[expect]]
what     = "motor 1 speed at 0 s"
basis    = "Rule"
expected = "22733 RPM ± 0.01%"
measured = "22700 RPM"

[[expect]]
what     = "total thrust at 0 s"
basis    = "Rule"
expected = "31.211 gf ± 0.01%"
measured = "31.2 gf"

[[expect]]
what     = "vertical acceleration at 0.000125 s"
basis    = "Rule"
expected = "0 m/s² ± 0.01 m/s²"
measured = "0.000744 m/s²"

[[expect]]
what     = "height, lowest over 0 s to 1 s"
basis    = "Observed"
expected = "2 m ± 0.002 m"
measured = "2.00 m"

[[expect]]
what     = "height, highest over 0 s to 1 s"
basis    = "Observed"
expected = "2.01 m ± 0.005 m"
measured = "2.01 m"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "9f1ad58d056c8465"   # test/whoop-65-no-drag: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "fa9e65accdce2f1a"   # the whole state after each of 8000 steps at 8000 Hz, in order

