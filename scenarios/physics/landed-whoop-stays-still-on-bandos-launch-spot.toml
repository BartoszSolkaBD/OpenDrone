# Bando's Launch Spot is in the yard, 17 m south of the building, at 0 m east
# and -17 m north of the Map's origin, facing north (heading 0°) at the tower.
# The Whoop 65 landed there with its motors stopped must stay exactly where it
# is for ten seconds: the Map's colliders reach the Simulation, hold the
# Quad's weight and push it nowhere. It starts resting on its body box, 20 mm
# tall round its centre of mass, so its centre is 0.01 m up. Basis for the
# place: packs/opendrone/maps/bando (its Launch Spot, #64).
format = 2
name   = "A landed whoop stays still on Bando's Launch Spot"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-drag"
map               = "opendrone/bando"
position          = "0 m east, -17 m north, 0.01 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "height"
over    = "0 s to 10 s"
lowest  = "0.01 m ± 0.000001 m"
basis   = "rule: landed with its motors stopped on Bando's yard, nothing moves the Quad: the yard's ground holds its weight and nothing pushes it sideways, so it stays exactly where it landed (E29 in #10)"

[[expect]]
what    = "height"
over    = "0 s to 10 s"
highest = "0.01 m ± 0.000001 m"
basis   = "rule: landed with its motors stopped on Bando's yard, nothing moves the Quad: the yard's ground holds its weight and nothing pushes it sideways, so it stays exactly where it landed (E29 in #10)"

[[expect]]
