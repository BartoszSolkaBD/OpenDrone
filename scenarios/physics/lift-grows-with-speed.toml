# A Whoop 65 flying level at 8 m/s, its motors "settled": spinning at the
# speed that holds its height at that motion. Hovering, settled motors turn at
# 22,732 RPM ("Settled motors hold a Whoop 65 in a hover from the first
# step"); flying at 8 m/s they need only 19,659 RPM, because air crossing a
# rotor makes it lift more at the same speed. Proves E11 in #10: lift grows
# with speed.
#
# The working (momentum theory at the same power, flight-dynamics research
# §4.3; crates/physics/src/air.rs, "Inflow"):
#
# - Hovering, each rotor carries a quarter of the weight, W/4 = 0.076518 N,
#   and pushes air down through its disc at v_h = √(W/4 / 2ρA) = 5.6975 m/s
#   (35 mm props, A = 9.6211 × 10⁻⁴ m²).
# - Level at 8 m/s the air crosses each disc at w = 8 / 5.6975 = 1.40412 v_h
#   and none arrives along its axis. A rotor whose thrust on the thrust stand
#   is ū·W/4 (so whose own still-air flow is √ū·v_h) gives W/4 there when
#   ū²·√((w/√ū)² + ū²) = 1, which is (ū³)² + w²·ū³ = 1: ū³ =
#   (−w² + √(w⁴ + 4)) / 2 = 0.418416, ū = 0.747944.
# - So each rotor needs only 74.8% of its hover thrust on the thrust stand:
#   speed √0.747944 = 0.864838 times the hover speed, 22,731.6 RPM × 0.864838
#   = 19,659.1 RPM.
#
# The drag here (rotor, duct and body) acts across the Quad, level: it slows
# it but never holds it up, so it doesn't change the settled speed.
format = 2
name   = "Flying level at 8 m/s, a Whoop 65 holds its height with its rotors 13.5% slower than hovering"

[start]
kind              = "physics"
quad              = "opendrone/whoop-65"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 2 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s east, 8 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# 31.1%: the drive that holds 19,659 RPM on this pack once it has sagged under
# that load.
timeline = [
  { at = "0 s", motors = "31.1%" },
]

[[expect]]
what  = "motor 1 speed"
at    = "0 s"
value = "19659.1 RPM ± 0.01%"
basis = "rule: momentum theory: level at 8 m/s, each rotor carries a quarter of the weight with 74.8% of its hover thrust on the thrust stand, so it turns at √0.747944 × 22,731.6 RPM = 19,659.1 RPM (working above)"

[[expect]]
what  = "total thrust"
at    = "0 s"
value = "31.211 gf ± 0.01%"
basis = "rule: settled motors hold the height, and level, the thrust alone does that: it is the weight, 0.0312 kg × 9.81 m/s² = 31.211 gf"

[[expect]]
what  = "vertical acceleration"
at    = "0.000125 s"
value = "0 m/s² ± 0.02 m/s²"
basis = "rule: on the first step the thrust still carries the weight; a motor moves only 1/280 of the way towards a new command in one step, and the drag acts across the Quad"
