# Results of whoop-is-pulled-onto-the-ceiling.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Whoop 65 one rotor radius under the ceiling is pulled onto it, on a drive that sinks it in open air"

[[expect]]
what     = "height, highest over 0 s to 2 s"
basis    = "Rule"
expected = "between 3.0795 m and 3.0820 m"
measured = "3.08 m"

[[expect]]
what     = "height, lowest over 0 s to 2 s"
basis    = "Observed"
expected = "3.0745 m ± 0.0001 m"
measured = "3.07 m"

[[expect]]
what     = "height at 0.5 s"
basis    = "Observed"
expected = "3.082 m ± 0.0005 m"
measured = "3.08 m"

[[expect]]
what     = "height at 2 s"
basis    = "Observed"
expected = "3.082 m ± 0.0005 m"
measured = "3.08 m"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "3232af5450196812"   # opendrone/whoop-65: what the Simulation receives from it
map  = "c99bed06a155f2a3"   # test/floor-and-ceiling
run  = "295acba38344a540"   # the whole state after each of 16000 steps at 8000 Hz, in order

