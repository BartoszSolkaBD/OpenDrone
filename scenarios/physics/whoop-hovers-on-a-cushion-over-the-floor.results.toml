# Results of whoop-hovers-on-a-cushion-over-the-floor.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Two rotor radii over the floor, a Whoop 65's rotors give 9.6% more thrust, so it hovers on slower motors"

[[expect]]
what     = "motor 1 speed at 0 s"
basis    = "Source"
expected = "21710.9 RPM ± 0.01%"
measured = "21700 RPM"

[[expect]]
what     = "total thrust at 0 s"
basis    = "Rule"
expected = "31.211 gf ± 0.01%"
measured = "31.2 gf"

[[expect]]
what     = "vertical acceleration at 0.000125 s"
basis    = "Rule"
expected = "0 m/s² ± 0.01 m/s²"
measured = "0.000692 m/s²"

[[expect]]
what     = "height, lowest over 0 s to 0.5 s"
basis    = "Observed"
expected = "0.027 m ± 0.002 m"
measured = "0.0270 m"

[[expect]]
what     = "height, highest over 0 s to 0.5 s"
basis    = "Observed"
expected = "0.027 m ± 0.002 m"
measured = "0.0289 m"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "9c08ee377f648787"   # opendrone/whoop-65: what the Simulation receives from it
map  = "c99bed06a155f2a3"   # test/floor-and-ceiling
run  = "7ded7aa6a582b600"   # the whole state after each of 4000 steps at 8000 Hz, in order

