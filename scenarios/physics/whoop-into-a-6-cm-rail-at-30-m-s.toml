# The Whoop 65 flies level at 30 m/s straight at the 6 cm rail on the Thin
# rail Test Map, which runs north–south 1 m up at 3 m east, square across its
# path at the height of its centre. At 8 kHz it moves 3.75 mm a step, more
# than its 1.5 mm duct wall: only the continuous check stops a step carrying
# a part through the rail. Proves the thin-rail half of E29 in #10.
format = 1
name   = "A whoop at 30 m/s never passes through a 6 cm rail"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-drag"
map               = "test/thin-rail"
position          = "2 m east, 0 m north, 1 m up"
attitude          = "level, heading 90°"
speed             = "30 m/s east, 0 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "distance east"
over    = "0 s to 0.04 s"
highest = "between 2 m and 2.97 m"
basis   = "rule: the rail's near side is 3 m - 3 cm = 2.97 m east. Flying free, the whoop's front duct rings, 43 mm ahead of its centre, would reach it at 0.031 s, and its centre would pass it at 0.032 s and be 3.2 m east by 0.04 s. Its centre is inside its shape, so by 0.04 s only passing through the rail could take its centre to 2.97 m: the rail runs 5 m either side; going under it needs a 45 mm drop (from its top, 15 mm above its centre, to the rail's underside, 30 mm below), and gravity gives 8 mm in 0.04 s; going over it needs a 40 mm climb in the 9 ms after its ducts meet the rail"

[[expect]]
what  = "speed east"
at    = "0.25 s"
value = "-7.83 m/s ± 0.5 m/s"
basis = "observed: it comes back off the rail at about 8 m/s; its bounce of 0.3 gives 9 m/s where its ducts hit, 8 mm above its centre of mass, and the hit also sets it pitching"

[[expect]]
what  = "distance east"
at    = "0.25 s"
value = "1.21 m ± 0.05 m"
basis = "observed: where it is 0.25 s after the start, on its way back west"
