# The Whoop 65, nose north and rolled 10° right, slides north at 3 m/s
# along the Wall Test Map's wall, 1 mm from it at the start. Its motors are
# "settled", spinning at the speed whose thrust carries its weight along
# their axis, so the roll leans that thrust into the wall and keeps the Quad
# pressed against it as it slides. Its right-hand duct rings, round props 1
# and 2, reach 3.5 mm further east than the props, so the rings take the
# contact and the props never touch: no Prop Strike. Proves #26 §1's "the
# whoop's duct ring keeps most things off its props" (#26 §6).
format = 1
name   = "A whoop sliding along a wall at 3 m/s has no Prop Strike: its duct rings take the contact"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-drag"
map               = "test/wall"
position          = "4.9557 m east, 0 m north, 1.5 m up"
attitude          = "roll 10°, pitch 0°, heading 0°"
speed             = "0 m/s east, 3 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
# 37.3%: about the drive that holds settled motors at their speed on this
# pack (as in "Settled motors hold a Whoop 65 in a hover from the first
# step").
timeline = [
  { at = "0 s", motors = "37.3%" },
]

[[expect]]
what    = "prop 1 rub"
over    = "0 s to 0.3 s"
highest = "0 N ± 0 N"
basis   = "rule: each prop spins inside its duct ring, whose inside is 1 mm clear of the prop's tip all round, so nothing reaches the prop without first meeting the ring: rolled 10° into the wall, the ring's outside reaches 20.9 mm east of the hub and the prop's tip 17.4 mm. The rings take every touch, and the props never strike"

[[expect]]
what    = "prop 2 rub"
over    = "0 s to 0.3 s"
highest = "0 N ± 0 N"
basis   = "rule: as for prop 1, the other prop on the wall side: its ring reaches the wall 3.5 mm before it can"

[[expect]]
what    = "prop 3 rub"
over    = "0 s to 0.3 s"
highest = "0 N ± 0 N"
basis   = "rule: prop 3 is on the side away from the wall"

[[expect]]
what    = "prop 4 rub"
over    = "0 s to 0.3 s"
highest = "0 N ± 0 N"
basis   = "rule: prop 4 is on the side away from the wall"

[[expect]]
what  = "speed north"
at    = "0.1 s"
value = "between 2.5 m/s and 2.99 m/s"
basis = "rule: the lean presses the Quad against the wall, and friction where it touches slows its slide north (nothing else acts along the wall: no drag, and the thrust leans only east). The props rub nothing, and its body box is 28 mm short of the wall, so the duct rings are what touch it"

[[expect]]
what  = "speed north"
at    = "0.1 s"
value = "2.92 m/s ± 0.01 m/s"
basis = "observed: the rings' friction (0.5 times the push) slows the slide by 0.08 m/s in 0.1 s, while the wall's push, high on the rings, rolls the Quad upright and then away from the wall"

[[expect]]
what   = "motor 1 speed"
over   = "0 s to 0.3 s"
lowest = "between 22300 RPM and 23000 RPM"
basis  = "rule: with no rub, nothing brakes motor 1: it never falls below 22,300 RPM, the 22,400 RPM it settled at less a 100 RPM margin (the speed whose thrust, in the air it flies through at 3 m/s, carries the Quad's weight along the motors' axis), and only rises as its 37.3% drive takes it"

[[expect]]
what   = "motor 2 speed"
over   = "0 s to 0.3 s"
lowest = "between 22300 RPM and 23000 RPM"
basis  = "rule: with no rub, nothing brakes motor 2 either"
