# Results of whoop-thrown-into-a-ceiling.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A whoop thrown into a ceiling"

[[expect]]
what     = "height, highest over 0 s to 0.4 s"
basis    = "Rule"
expected = "between 3 m and 3.0851 m"
measured = "3.08 m"

[[expect]]
what     = "height, lowest over 0 s to 3 s"
basis    = "Rule"
expected = "between 0.0099 m and 1 m"
measured = "0.0106 m"

[[expect]]
what     = "vertical speed at 0.4 s"
basis    = "Observed"
expected = "-2.17 m/s ± 0.05 m/s"
measured = "-2.17 m/s"

[[expect]]
what     = "speed, highest over 2.5 s to 3 s"
basis    = "Observed"
expected = "0 m/s ± 0.000001 m/s"
measured = "0 m/s"

[[expect]]
what     = "height at 3 s"
basis    = "Observed"
expected = "0.015 m ± 0.0001 m"
measured = "0.0150 m"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

