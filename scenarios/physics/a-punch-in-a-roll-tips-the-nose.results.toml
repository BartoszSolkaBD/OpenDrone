# Results of a-punch-in-a-roll-tips-the-nose.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Rolling, a punch on its anticlockwise pair tips a Whoop 65's nose down"

[[expect]]
what     = "pitch rate at 0.01 s"
basis    = "Rule"
expected = "between -1000 °/s and -0.1 °/s"
measured = "-8.32 °/s"

[[expect]]
what     = "pitch rate at 0.01 s"
basis    = "Observed"
expected = "-8.32 °/s ± 0.3 °/s"
measured = "-8.32 °/s"

[[expect]]
what     = "yaw rate at 0.01 s"
basis    = "Observed"
expected = "137 °/s ± 5 °/s"
measured = "137 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "39b0e5a5b192890e"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "20ec6bfea9fd6a53"   # the whole state after each of 80 steps at 8000 Hz, in order

