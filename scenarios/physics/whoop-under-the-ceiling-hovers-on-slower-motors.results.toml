# Results of whoop-under-the-ceiling-hovers-on-slower-motors.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "One rotor radius under the ceiling, a Whoop 65's rotors give 2% more thrust, so it hovers on slower motors"

[[expect]]
what     = "motor 1 speed at 0 s"
basis    = "Source"
expected = "22506.3 RPM ± 0.01%"
measured = "22500 RPM"

[[expect]]
what     = "total thrust at 0 s"
basis    = "Rule"
expected = "31.211 gf ± 0.01%"
measured = "31.2 gf"

[[expect]]
what     = "vertical acceleration at 0.000125 s"
basis    = "Rule"
expected = "0 m/s² ± 0.01 m/s²"
measured = "0.000990 m/s²"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "9c08ee377f648787"   # opendrone/whoop-65: what the Simulation receives from it
map  = "c99bed06a155f2a3"   # test/floor-and-ceiling
run  = "7e071aae4fa06a61"   # the whole state after each of 1 steps at 8000 Hz, in order

[fingerprints.checkpoints]   # the whole state after each tenth of the run
"0.000125 s" = "b49787dc8bd641ff"
