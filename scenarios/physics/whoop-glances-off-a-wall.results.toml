# Results of whoop-glances-off-a-wall.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A whoop glances off a wall"

[[expect]]
what     = "distance east, highest over 0 s to 0.5 s"
basis    = "Rule"
expected = "between 4 m and 5 m"
measured = "4.96 m"

[[expect]]
what     = "speed east at 0.4 s"
basis    = "Observed"
expected = "-1.46 m/s ± 0.1 m/s"
measured = "-1.46 m/s"

[[expect]]
what     = "speed north at 0.4 s"
basis    = "Observed"
expected = "4.17 m/s ± 0.3 m/s"
measured = "4.17 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

