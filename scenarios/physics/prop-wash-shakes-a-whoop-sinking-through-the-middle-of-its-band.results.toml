# Results of prop-wash-shakes-a-whoop-sinking-through-the-middle-of-its-band.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Sinking through the middle of its band, a Whoop 65 is shaken by Prop Wash"

[[expect]]
what     = "roll rate, highest over 0 s to 0.5 s"
basis    = "Source"
expected = "between 1 °/s and 10000 °/s"
measured = "185 °/s"

[[expect]]
what     = "roll rate, lowest over 0 s to 0.5 s"
basis    = "Source"
expected = "between -10000 °/s and -1 °/s"
measured = "-189 °/s"

[[expect]]
what     = "pitch rate, highest over 0 s to 0.5 s"
basis    = "Source"
expected = "between 1 °/s and 10000 °/s"
measured = "296 °/s"

[[expect]]
what     = "pitch rate, lowest over 0 s to 0.5 s"
basis    = "Source"
expected = "between -10000 °/s and -1 °/s"
measured = "-231 °/s"

[[expect]]
what     = "motor 1 speed at 0 s"
basis    = "Observed"
expected = "21147 RPM ± 0.1%"
measured = "21100 RPM"

[[expect]]
what     = "motor 1 thrust, lowest over 0 s to 0.1 s"
basis    = "Rule"
expected = "between 5.774 gf and 8.504 gf"
measured = "6.89 gf"

[[expect]]
what     = "motor 1 thrust, highest over 0 s to 0.1 s"
basis    = "Rule"
expected = "between 5.774 gf and 8.504 gf"
measured = "7.88 gf"

[[expect]]
what     = "motor 1 thrust, lowest over 0 s to 0.5 s"
basis    = "Observed"
expected = "5.83 gf ± 0.3 gf"
measured = "5.81 gf"

[[expect]]
what     = "motor 1 thrust, highest over 0 s to 0.5 s"
basis    = "Observed"
expected = "7.93 gf ± 0.3 gf"
measured = "8.04 gf"

[[expect]]
what     = "roll at 0.5 s"
basis    = "Observed"
expected = "-4.61° ± 5°"
measured = "-4.61°"

[[expect]]
what     = "pitch at 0.5 s"
basis    = "Observed"
expected = "4.18° ± 5°"
measured = "4.18°"

[[expect]]
what     = "vertical speed at 0.5 s"
basis    = "Observed"
expected = "-4.92 m/s ± 0.1 m/s"
measured = "-4.98 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

