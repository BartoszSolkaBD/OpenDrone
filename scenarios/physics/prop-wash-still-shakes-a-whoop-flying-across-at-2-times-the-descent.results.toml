# Results of prop-wash-still-shakes-a-whoop-flying-across-at-2-times-the-descent.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Flying forward at only 2 times its descent, a Whoop 65 is still shaken by Prop Wash"

[[expect]]
what     = "roll rate, highest over 0 s to 1 s"
basis    = "Source"
expected = "between 0.1 °/s and 10000 °/s"
measured = "238 °/s"

[[expect]]
what     = "roll rate, lowest over 0 s to 1 s"
basis    = "Source"
expected = "between -10000 °/s and -0.1 °/s"
measured = "-96.4 °/s"

[[expect]]
what     = "pitch rate, highest over 0 s to 1 s"
basis    = "Source"
expected = "between 0.1 °/s and 10000 °/s"
measured = "75.4 °/s"

[[expect]]
what     = "pitch rate, lowest over 0 s to 1 s"
basis    = "Source"
expected = "between -10000 °/s and -0.1 °/s"
measured = "-178 °/s"

[[expect]]
what     = "roll at 1 s"
basis    = "Observed"
expected = "46.8° ± 10°"
measured = "46.8°"

[[expect]]
what     = "pitch at 1 s"
basis    = "Observed"
expected = "-30.7° ± 10°"
measured = "-30.7°"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "bb331df5a141eda0"   # test/whoop-65-no-drag: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "acf3505d76af0277"   # the whole state after each of 8000 steps at 8000 Hz, in order

