# Results of prop-wash-still-shakes-a-whoop-flying-across-at-2-times-the-descent.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Flying forward at only 2 times its descent, a Whoop 65 is still shaken by Prop Wash"

[[expect]]
what     = "roll rate at 1 s, how far from the same run with random seed 2"
basis    = "Source"
expected = "between 0.001 °/s and 10000 °/s"
measured = "52.4 °/s"

[[expect]]
what     = "pitch rate at 1 s, how far from the same run with random seed 2"
basis    = "Source"
expected = "between 0.001 °/s and 10000 °/s"
measured = "2.98 °/s"

[[expect]]
what     = "roll at 1 s"
basis    = "Observed"
expected = "-2.49° ± 10°"
measured = "-2.49°"

[[expect]]
what     = "pitch at 1 s"
basis    = "Observed"
expected = "-9.42° ± 10°"
measured = "-9.42°"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "9f1ad58d056c8465"   # test/whoop-65-no-drag: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "219f3bc3a3b9d9a5"   # the whole state after each of 8000 steps at 8000 Hz, in order

