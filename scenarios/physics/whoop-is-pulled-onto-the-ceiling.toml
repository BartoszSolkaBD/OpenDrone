# A Whoop 65 hovering with its props 17.5 mm (one rotor radius) below the
# ceiling, its motors "settled" at the speed that holds it there, while its
# ESCs get 37.2%: just short of the drive that hovers it in open air (37.3%,
# "Settled motors hold a Whoop 65 in a hover from the first step"), so away
# from the ceiling it would sink slowly ("With no ceiling effect, a Whoop 65
# on a slowly sinking drive sinks away from the ceiling"). Under the ceiling
# it rises instead, and the closer it gets the harder the ceiling pulls: it is
# sucked up onto the ceiling and stays there, held by its duct rings (E21 in
# #10; user story 31 in #37, "get sucked towards a ceiling", as under the
# Bando's 3.1 m ceilings; crates/physics/src/ground_and_ceiling.rs).
#
# Why it rises: the ceiling lets its settled motors hover 1% slower (22,506.3
# RPM, "One rotor radius under the ceiling, a Whoop 65's rotors give 2% more
# thrust"), and the drive spins them back up towards the open-air hover
# speed. The ceiling effect at the same power is γ^⅔, with γ = ½ + ½·√(1 +
# α₀/(8·(z/R)²)) (Hsiao & Chirarattananon 2019, S13; α₀ = 1): +2.0% at one
# rotor radius, growing to +7.4% at half a radius, the closest the formula is
# used. Its duct rings stand 7 mm above its props, so pressed against the
# ceiling its props are 7 mm (0.4 rotor radius) below it.
format = 1
name   = "A Whoop 65 one rotor radius under the ceiling is pulled onto it, on a drive that sinks it in open air"

[start]
kind              = "physics"
quad              = "opendrone/whoop-65"
map               = "test/floor-and-ceiling"
position          = "0 m east, 0 m north, 3.0745 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s", motors = "37.2%" },
]

[[expect]]
what    = "height"
over    = "0 s to 2 s"
highest = "3.085 m ± 0.0002 m"
basis   = "rule: it reaches the ceiling at 3.1 m but never passes into it: its duct rings' tops, 15 mm above its centre (8 mm up to its props, then half the rings' 14 mm), stop it"

[[expect]]
what   = "height"
over   = "0 s to 2 s"
lowest = "3.0745 m ± 0.0001 m"
basis  = "observed: it never sinks; from the start it rises"

[[expect]]
what  = "height"
at    = "0.5 s"
value = "3.085 m ± 0.0002 m"
basis = "observed: it is on the ceiling by 0.35 s"

[[expect]]
what  = "height"
at    = "2 s"
value = "3.085 m ± 0.0002 m"
basis = "observed: it stays pressed against the ceiling: there the ceiling's pull is 7.4% of each rotor's thrust, far more than the drive lacks"
