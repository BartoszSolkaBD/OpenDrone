# Results of rotor-drag-slows-the-quad-and-lifts-its-nose.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Rotor drag slows a Whoop 65 at 8 m/s and lifts its nose"

[[expect]]
what     = "acceleration north at 0.000125 s"
basis    = "Rule"
expected = "-2.0756 m/s² ± 0.5%"
measured = "-2.08 m/s²"

[[expect]]
what     = "pitch rate at 0.000125 s"
basis    = "Rule"
expected = "0.41227 °/s ± 0.5%"
measured = "0.412 °/s"

[[expect]]
what     = "pitch rate at 0.2 s"
basis    = "Observed"
expected = "453 °/s ± 20 °/s"
measured = "453 °/s"

[[expect]]
what     = "speed north at 0.2 s"
basis    = "Observed"
expected = "6.87 m/s ± 0.1 m/s"
measured = "6.87 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

