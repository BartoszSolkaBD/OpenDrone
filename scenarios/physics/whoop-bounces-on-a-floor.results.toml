# Results of whoop-bounces-on-a-floor.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A dropped whoop bounces and settles"

[[expect]]
what     = "height, lowest over 0 s to 2 s"
basis    = "Rule"
expected = "0.01 m ± 0.0001 m"
measured = "0.0100 m"

[[expect]]
what     = "vertical speed, highest over 0.45 s to 0.6 s"
basis    = "Observed"
expected = "1.33 m/s ± 0.02 m/s"
measured = "1.33 m/s"

[[expect]]
what     = "height, highest over 0.5 s to 0.7 s"
basis    = "Observed"
expected = "0.1 m ± 0.005 m"
measured = "0.100 m"

[[expect]]
what     = "speed, highest over 1.5 s to 2 s"
basis    = "Observed"
expected = "0 m/s ± 0.000001 m/s"
measured = "0 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

