# A Whoop 65 hovering on settled motors spins its anticlockwise pair (motors 2
# and 3, front right and rear left with the props in) faster than its
# clockwise pair, and holds them there. Each prop's drag twists the frame
# against the prop's own spin, so the faster anticlockwise props win: the
# rotors' net spin is anticlockwise, and the Quad yaws clockwise, nose right.
# Proves E4 in #10: the Quad yaws against the motors' net spin.
#
# Being opposite each other, each pair's thrust neither rolls nor pitches it.
# The rotors' drag, as the Quad turns, slows the turn (crates/physics/src/
# air.rs, "Rotor drag"), so the yaw rate settles rather than growing for ever.
format = 1
name   = "A Whoop 65 yaws against its rotors' net spin"

[start]
kind              = "physics"
quad              = "opendrone/whoop-65"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 2 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# Motors in Betaflight's order: rear right, front right, rear left, front left.
timeline = [
  { at = "0 s", motors = "30%, 45%, 45%, 30%" },
]

[[expect]]
what   = "yaw rate"
over   = "0.001 s to 1 s"
lowest = "between 0.01 °/s and 10000 °/s"
basis  = "rule: the anticlockwise props turn faster, so their drag twists the frame clockwise harder than the clockwise props' twists it back: it yaws right, nose right, throughout"

[[expect]]
what   = "roll rate"
over   = "0 s to 1 s"
highest = "0 °/s ± 0.001 °/s"
basis  = "rule: each pair sits on a diagonal, so its thrust neither rolls nor pitches the Quad"

[[expect]]
what  = "yaw rate"
at    = "1 s"
value = "546 °/s ± 10 °/s"
basis = "observed: after a second it yaws right at 546 °/s"
