# Results of whoop-slows-after-a-sprint.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Whoop 65 sprinting at 8 m/s slows at once when it lets go"

[[expect]]
what     = "acceleration north at 0.000125 s"
basis    = "Rule"
expected = "-13.560 m/s² ± 0.5%"
measured = "-13.6 m/s²"

[[expect]]
what     = "speed north, highest over 0 s to 0.1 s"
basis    = "Rule"
expected = "between 0 m/s and 8 m/s"
measured = "8.00 m/s"

[[expect]]
what     = "speed north at 0.1 s"
basis    = "Observed"
expected = "6.50 m/s ± 0.1 m/s"
measured = "6.58 m/s"

[[expect]]
what     = "pitch at 0.1 s"
basis    = "Observed"
expected = "35.5° ± 2°"
measured = "34.9°"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "39b0e5a5b192890e"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "518b5588d4fcc1f2"   # the whole state after each of 800 steps at 8000 Hz, in order

