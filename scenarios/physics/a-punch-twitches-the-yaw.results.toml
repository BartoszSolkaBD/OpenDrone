# Results of a-punch-twitches-the-yaw.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A punch on its anticlockwise pair twitches a Whoop 65's nose right at once, and the chop twitches it back"

[[expect]]
what     = "yaw rate, lowest over 0 s to 0.1 s"
basis    = "Rule"
expected = "0 °/s ± 0.05 °/s"
measured = "0 °/s"

[[expect]]
what     = "yaw rate, highest over 0 s to 0.1 s"
basis    = "Rule"
expected = "0 °/s ± 0.05 °/s"
measured = "0 °/s"

[[expect]]
what     = "yaw rate at 0.100125 s"
basis    = "Rule"
expected = "between 1 °/s and 3 °/s"
measured = "1.93 °/s"

[[expect]]
what     = "yaw rate at 0.11 s"
basis    = "Observed"
expected = "137 °/s ± 5 °/s"
measured = "137 °/s"

[[expect]]
what     = "yaw rate at 0.3 s"
basis    = "Observed"
expected = "1290 °/s ± 30 °/s"
measured = "1290 °/s"

[[expect]]
what     = "yaw rate at 0.31 s"
basis    = "Observed"
expected = "1180 °/s ± 30 °/s"
measured = "1180 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "7e45b8c6b4fcd541"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "7dc25c6caeccbc50"   # the whole state after each of 2480 steps at 8000 Hz, in order

