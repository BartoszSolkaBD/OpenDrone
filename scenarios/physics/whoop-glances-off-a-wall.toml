# The Whoop 65 flies level at 5 m/s east and 5 m/s north into the Wall Test
# Map's wall, whose face is 5 m east. It bounces off the wall with its bounce
# of 0.3 while friction slows it along the wall. Shows bounce and slide
# together (E29 in #10).
format = 2
name   = "A whoop glances off a wall"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-drag"
map               = "test/wall"
position          = "4 m east, 0 m north, 1.5 m up"
attitude          = "level, heading 0°"
speed             = "5 m/s east, 5 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "distance east"
over    = "0 s to 0.5 s"
highest = "between 4 m and 5 m"
basis   = "rule: the wall's face is 5 m east, and the whoop's centre of mass is inside its shape, so its centre can't reach 5 m without part of the whoop passing through the wall or round it; the wall runs 10 m either side of the start and from the ground to 5 m, and in 0.5 s at 5 m/s north the whoop gets 2.5 m north and can't climb 3.5 m"

[[expect]]
what  = "speed east"
at    = "0.4 s"
value = "-1.46 m/s ± 0.1 m/s"
basis = "observed: it comes off the wall at about its bounce times the 5 m/s it came in at"

[[expect]]
what  = "speed north"
at    = "0.4 s"
value = "4.17 m/s ± 0.3 m/s"
basis = "observed: friction against the wall took some of its 5 m/s along it, and turned the whoop"
