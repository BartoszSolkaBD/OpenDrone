# The same flight as "A Whoop 65 one rotor radius under the ceiling is pulled
# onto it, on a drive that sinks it in open air", on the Whoop 65 with its
# ceiling effect set to zero (test/whoop-65-no-ceiling-effect:
# ceiling_effect_asymmetry = 0, so γ = 1). Its settled motors then turn at its
# open-air hover speed, and 37.2%, just short of the open-air hover drive,
# lets it sink slowly away from the ceiling: what pulls the Whoop 65 up onto
# the ceiling is the ceiling effect alone (E21 in #10).
format = 2
name   = "With no ceiling effect, a Whoop 65 on a slowly sinking drive sinks away from the ceiling"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-ceiling-effect"
map               = "test/floor-and-ceiling"
position          = "0 m east, 0 m north, 3.0745 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s", motors = "37.2%" },
]

[[expect]]
what  = "motor 1 speed"
at    = "0 s"
value = "22731.6 RPM ± 0.01%"
basis = "rule: with no ceiling effect a quarter of the weight takes the open-air hover speed, √(0.076518 N / 1.35035 × 10⁻⁸ N/(rad/s)²) = 2,380.45 rad/s = 22,731.6 RPM"

[[expect]]
what    = "height"
over    = "0 s to 2 s"
highest = "3.0745 m ± 0.0002 m"
basis   = "observed: it never rises towards the ceiling"

[[expect]]
what  = "height"
at    = "2 s"
value = "3.0425 m ± 0.005 m"
basis = "observed: it sinks slowly, about 3 cm in 2 s"
