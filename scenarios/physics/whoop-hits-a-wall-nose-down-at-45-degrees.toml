# The Whoop 65 flies nose down 45°, at 10 m/s east straight into the Wall Test
# Map's wall, whose face is 5 m east, with its motors off: a nose-dive. Its
# camera housing, a box behind the FPV Camera's lens that sticks up past the
# duct rings, meets the wall first, and the Quad turns about it. The readable
# check in crates/opendrone/tests/camera.rs flies this Scenario to find where
# the FPV Camera's near plane ends up against the wall (#268).
format = 2
name   = "A whoop that hits a wall nose down at 45° stops with its front duct rings against it"

[start]
kind              = "physics"
quad              = "opendrone/whoop-65"
map               = "test/wall"
position          = "4 m east, 0 m north, 1.5 m up"
attitude          = "roll 0°, pitch -45°, heading 90°"
speed             = "10 m/s east, 0 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "distance east"
over    = "0 s to 0.3 s"
highest = "between 4.9 m and 4.96 m"
basis   = "rule: the wall's face is 5 m east, and the whoop's camera housing, its foremost and highest part at 45° nose down, has its top front corner 40 mm ahead of and 20.5 mm above its centre of mass (the lens at 40 mm forward and 16 mm up, in the middle of the box's front face, which is 9 mm tall), so that corner is (40 mm + 20.5 mm) x sin 45° = 42.8 mm ahead of the centre towards the wall, and the centre can't pass 5 m - 0.0428 m = 4.9572 m without the housing passing through the wall (4.96 m is that, to the 3 significant figures a Results file shows)"
