# Results of slow-turn-through-north.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A slow free turn through north keeps its rate, measured the short way round"

[[expect]]
what     = "yaw rate, lowest over 0 s to 1 s"
basis    = "Rule"
expected = "2 °/s ± 0.001 °/s"
measured = "2.00 °/s"

[[expect]]
what     = "yaw rate, highest over 0 s to 1 s"
basis    = "Rule"
expected = "2 °/s ± 0.001 °/s"
measured = "2.00 °/s"

[[expect]]
what     = "heading, lowest over 0 s to 1 s"
basis    = "Rule"
expected = "-0.5° ± 0.001°"
measured = "-0.500°"

[[expect]]
what     = "heading, highest over 0 s to 1 s"
basis    = "Rule"
expected = "1.5° ± 0.001°"
measured = "1.50°"

[[expect]]
what     = "heading, mean over 0 s to 1 s"
basis    = "Rule"
expected = "0.5° ± 0.001°"
measured = "0.500°"

[[expect]]
what     = "heading, final over 0 s to 1 s"
basis    = "Rule"
expected = "1.5° ± 0.001°"
measured = "1.50°"

[[expect]]
what     = "roll at 1 s"
basis    = "Rule"
expected = "0° ± 0.001°"
measured = "0°"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "ba67fc360867ca19"   # test/whoop-65-no-drag: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "e7d7b20f1bb84476"   # the whole state after each of 8000 steps at 8000 Hz, in order

