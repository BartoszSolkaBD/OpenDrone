# A Whoop 65 sprinting level at 8 m/s lets go: its motors hold the speed that
# keeps its height ("settled"), and nothing pushes it on. Its rotors' drag,
# its ducts' ram drag and its body's drag all push against the motion at
# once. Proves E16, E17 and E25 in #10 together: slowing after a sprint.
#
# The working on the first step, per kilogram (crates/physics/src/air.rs):
#
# - Rotor drag: 0.3 s⁻¹ in a hover, in step with the rotors' speed, here
#   0.864838 of the hover speed ("Flying level at 8 m/s, a Whoop 65 holds its
#   height with its rotors 13.5% slower than hovering"): 0.3 × 0.864838 × 8 =
#   2.0756 m/s².
# - Duct ram drag: 1.2 s⁻¹ in a hover, in step with the root of each rotor's
#   thrust, here exactly a hover's (each carries a quarter of the weight):
#   1.2 × 8 = 9.6 m/s².
# - Body drag: ½ρ·A·v² / m, with A the 15 cm² it shows the air flying level
#   nose first: 0.5 × 1.225 × 0.0015 × 8² / 0.0312 = 1.8846 m/s².
#
# 13.560 m/s² in all, against the motion. The ducts' nose-up moment then lifts
# the nose ("A Whoop 65's ducts drag it back and lift its nose"), tipping the
# thrust back, which slows it harder still.
format = 2
name   = "A Whoop 65 sprinting at 8 m/s slows at once when it lets go"

[start]
kind              = "physics"
quad              = "opendrone/whoop-65"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 2 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s east, 8 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# 31.1%: the drive that holds the settled 19,659 RPM on this pack once it has
# sagged under that load.
timeline = [
  { at = "0 s", motors = "31.1%" },
]

[[expect]]
what  = "acceleration north"
at    = "0.000125 s"
value = "-13.560 m/s² ± 0.5%"
basis = "rule: rotor drag 2.0756 m/s², duct ram drag 9.6 m/s² and body drag 1.8846 m/s², all against the motion: 13.560 m/s² (working above)"

[[expect]]
what    = "speed north"
over    = "0 s to 0.1 s"
highest = "between 0 m/s and 8 m/s"
basis   = "rule: every drag pushes against the motion and nothing pushes it on, so it never speeds up"

[[expect]]
what  = "speed north"
at    = "0.1 s"
value = "6.50 m/s ± 0.1 m/s"
basis = "observed: 0.1 s after letting go it has lost a fifth of its speed"

[[expect]]
what  = "pitch"
at    = "0.1 s"
value = "38.7° ± 2°"
basis = "observed: the ducts' nose-up moment has lifted its nose 39° in 0.1 s, tipping its thrust back (was 35.5°: the flicker now draws per rotor)"
