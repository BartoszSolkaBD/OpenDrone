# Results of 5-inch-prop-grazes-a-wall.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A 5-inch's spinning prop grazes a wall: that motor slows, and the Quad is pushed and twisted the way the rub says"

[[expect]]
what     = "prop 2 rub, highest over 0 s to 0.05 s"
basis    = "Observed"
expected = "129 N ± 10%"
measured = "129 N"

[[expect]]
what     = "prop 1 rub, highest over 0 s to 0.05 s"
basis    = "Rule"
expected = "0 N ± 0 N"
measured = "0 N"

