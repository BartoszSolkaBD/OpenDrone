basis    = "Rule"
expected = "0 N ± 0 N"
measured = "0 N"

[[expect]]
what     = "prop 3 rub, highest over 0 s to 0.05 s"
basis    = "Rule"
expected = "0 N ± 0 N"
measured = "0 N"

[[expect]]
