# The Whoop 65 flies level, nose first, at 10 m/s east straight into the Wall
# Test Map's wall, whose face is 5 m east, with its motors off. Its front duct
# rings are the foremost part of its shape, 43.3 mm ahead of its centre, so
# they stop it with its centre 43.3 mm short of the face. The readable check
# in crates/opendrone/tests/camera.rs flies this Scenario to find where the
# FPV Camera's lens ends up against the wall (#208).
format = 2
name   = "A whoop that hits a wall nose first stops with its front duct rings against it"

[start]
kind              = "physics"
quad              = "opendrone/whoop-65"
map               = "test/wall"
position          = "4 m east, 0 m north, 1.5 m up"
attitude          = "level, heading 90°"
speed             = "10 m/s east, 0 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "distance east"
over    = "0 s to 0.3 s"
highest = "between 4.9 m and 4.96 m"
basis   = "rule: the wall's face is 5 m east, and the whoop's front duct rings end 43.3 mm ahead of its centre of mass (half its 66 mm diagonal at 45°, plus the 20 mm of ring outside the motor), so its centre can't pass 5 m - 0.0433 m = 4.9567 m without a ring passing through the wall (4.96 m is that, to the 3 significant figures a Results file shows)"
