# The Whoop 65, landed on the Flat floor Test Map, starts sliding east at
# 3 m/s. Coulomb friction with its friction of 0.5 slows it at
# 0.5 × 9.81 m/s² = 4.9 m/s², so it stops after 0.61 s and 3² / (2 × 4.9) =
# 0.92 m. Shows the friction half of E29 in #10.
format = 1
name   = "A sliding whoop stops where its friction says"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-drag"
map               = "test/flat-floor"
position          = "0 m east, 0 m north, 0.01 m up"
attitude          = "level, heading 90°"
speed             = "3 m/s east, 0 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "height"
over    = "0 s to 1.5 s"
lowest  = "0.01 m ± 0.0001 m"
basis   = "rule: it slides on its body box, so its centre stays 0.01 m up, never inside the floor (the physics lets a part sit at most 0.1 mm inside a surface)"

[[expect]]
what    = "height"
over    = "0 s to 1.5 s"
highest = "0.01 m ± 0.0001 m"
basis   = "rule: nothing lifts it off the floor while it slides"

[[expect]]
what  = "speed east"
at    = "0.3 s"
value = "1.53 m/s ± 0.05 m/s"
basis = "observed: 3 m/s - 4.9 m/s² × 0.3 s = 1.53 m/s"

[[expect]]
what  = "distance east"
at    = "1.5 s"
value = "0.917 m ± 0.01 m"
basis = "observed: it stops after 3² / (2 × 4.9) = 0.917 m"

[[expect]]
what    = "speed"
over    = "1 s to 1.5 s"
highest = "0 m/s ± 0.000001 m/s"
basis   = "observed: stopped, and friction holds it still"
