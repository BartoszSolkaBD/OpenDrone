# Results of whoop-slides-to-a-stop.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A sliding whoop stops where its friction says"

[[expect]]
what     = "height, lowest over 0 s to 1.5 s"
basis    = "Rule"
expected = "0.01 m ± 0.0001 m"
measured = "0.0100 m"

[[expect]]
what     = "height, highest over 0 s to 1.5 s"
basis    = "Rule"
expected = "0.01 m ± 0.0001 m"
measured = "0.0100 m"

[[expect]]
what     = "speed east at 0.3 s"
basis    = "Observed"
expected = "1.53 m/s ± 0.05 m/s"
measured = "1.53 m/s"

[[expect]]
what     = "distance east at 1.5 s"
basis    = "Observed"
expected = "0.917 m ± 0.01 m"
measured = "0.917 m"

[[expect]]
what     = "speed, highest over 1 s to 1.5 s"
basis    = "Observed"
expected = "0 m/s ± 0.000001 m/s"
measured = "0 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "bb331df5a141eda0"   # test/whoop-65-no-drag: what the Simulation receives from it
map  = "15cbeb4e88c44e72"   # test/flat-floor
run  = "83b1e8527e19e4d3"   # the whole state after each of 12000 steps at 8000 Hz, in order

