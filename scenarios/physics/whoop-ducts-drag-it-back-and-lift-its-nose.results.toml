# Results of whoop-ducts-drag-it-back-and-lift-its-nose.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Whoop 65's ducts drag it back and lift its nose"

[[expect]]
what     = "acceleration north at 0.000125 s"
basis    = "Rule"
expected = "between -1000 m/s² and -0.1 m/s²"
measured = "-9.60 m/s²"

[[expect]]
what     = "pitch rate at 0.000125 s"
basis    = "Rule"
expected = "between 0.01 °/s and 1000 °/s"
measured = "5.01 °/s"

[[expect]]
what     = "acceleration north at 0.000125 s"
basis    = "Observed"
expected = "-9.60 m/s² ± 1%"
measured = "-9.60 m/s²"

[[expect]]
what     = "pitch rate at 0.000125 s"
basis    = "Observed"
expected = "5.01 °/s ± 1%"
measured = "5.01 °/s"

[[expect]]
what     = "pitch at 0.05 s"
basis    = "Observed"
expected = "47.8° ± 2°"
measured = "47.8°"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

