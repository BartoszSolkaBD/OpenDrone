# Results of 5-inch-into-a-3-cm-rebar-at-30-m-s.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A 5-inch at 30 m/s never passes through a 3 cm rebar stub"

[[expect]]
what     = "distance east, highest over 0 s to 0.04 s"
basis    = "Rule"
expected = "between 2 m and 2.985 m"
measured = "2.92 m"

[[expect]]
what     = "speed east at 0.1 s"
basis    = "Observed"
expected = "0 m/s ± 0.5 m/s"
measured = "-0.00171 m/s"

[[expect]]
what     = "pitch rate at 0.05 s"
basis    = "Observed"
expected = "-980 °/s ± 50 °/s"
measured = "-978 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

