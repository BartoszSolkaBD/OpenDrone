# A Whoop 65 on its 4.0 V bench supply (test/whoop-65-bench-supply, so its
# voltage never sags and a fixed command holds its motors at one speed),
# level, sinks straight down at 8 m/s, its motors settled and held there:
# faster than the band where a rotor sinks into its own air, so
# Prop Wash doesn't act, and it sinks dead level. Proves E19 in #10
# (ADR-0005): Prop Wash appears only inside the published descent band.
#
# The working (crates/physics/src/prop_wash.rs, "Where it acts"):
#
# - Settled, each rotor carries a quarter of the weight less a quarter of
#   the body drag on its 17 cm² top: (0.0312 kg × 9.81 m/s² − ½ × 1.225
#   kg/m³ × 17 cm² × (8 m/s)²) / 4 = 0.059858 N, 6.1038 gf.
# - That thrust pushes the air down through the 9.6211 cm² disc at v_h =
#   √(0.059858 / (2 × 1.225 × 9.6211 × 10⁻⁴)) = 5.0392 m/s, so 8 m/s is a
#   descent of 1.588 v_h: past Johnson's band of 0.4 to 1.4 v_h (research
#   §4.4), on the way to the windmill brake state.
# - Level, not turning and sinking straight down, every rotor is in the same
#   air, so with the same thrust on all four nothing rolls or pitches it.
#
# The motors are held at 25.71%, their settled drive on the bench supply,
# so the thrust and the descent hold.
format = 2
name   = "Sinking faster than its band, a Whoop 65 feels no Prop Wash"

[start]
kind              = "physics"
quad              = "test/whoop-65-bench-supply"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 50 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s north, 0 m/s east, -8 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "50%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s", motors = "25.71%" },
  { at = "1 s", motors = "25.71%" },
]

[[expect]]
what   = "roll rate"
over   = "0 s to 1 s"
lowest = "0 °/s ± 0.000001 °/s"
basis  = "source: research §4.4 (Johnson, S10): 1.588 v_h of descent is past the band of 0.4 to 1.4 v_h, so no rotor feels Prop Wash, all four give the same thrust and nothing rolls or pitches the Quad"

[[expect]]
what    = "roll rate"
over    = "0 s to 1 s"
highest = "0 °/s ± 0.000001 °/s"
basis   = "source: research §4.4 (Johnson, S10): 1.588 v_h of descent is past the band of 0.4 to 1.4 v_h, so no rotor feels Prop Wash, all four give the same thrust and nothing rolls or pitches the Quad"

[[expect]]
what   = "pitch rate"
over   = "0 s to 1 s"
lowest = "0 °/s ± 0.000001 °/s"
basis  = "source: research §4.4 (Johnson, S10): 1.588 v_h of descent is past the band of 0.4 to 1.4 v_h, so no rotor feels Prop Wash, all four give the same thrust and nothing rolls or pitches the Quad"

[[expect]]
what    = "pitch rate"
over    = "0 s to 1 s"
highest = "0 °/s ± 0.000001 °/s"
basis   = "source: research §4.4 (Johnson, S10): 1.588 v_h of descent is past the band of 0.4 to 1.4 v_h, so no rotor feels Prop Wash, all four give the same thrust and nothing rolls or pitches the Quad"

[[expect]]
what   = "motor 1 thrust"
over   = "0 s to 1 s"
lowest = "6.1038 gf ± 0.1%"
basis  = "rule: past the band nothing takes any thrust or makes it flicker, so the rotor gives momentum theory's 6.1038 gf, a quarter of the weight less a quarter of the body drag at 8 m/s"

[[expect]]
what    = "motor 1 thrust"
over    = "0 s to 1 s"
highest = "6.1038 gf ± 0.1%"
basis   = "rule: past the band nothing makes the thrust flicker: it holds at 6.1038 gf"
