expected = "between 2 m and 2.97 m"
measured = "2.93 m"

[[expect]]
what     = "speed east at 0.25 s"
basis    = "Observed"
expected = "-7.83 m/s ± 0.5 m/s"
measured = "-7.83 m/s"

[[expect]]
what     = "distance east at 0.25 s"
basis    = "Observed"
expected = "1.21 m ± 0.05 m"
measured = "1.21 m"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

