# A Whoop 65 spinning flat at 3,000 °/s, nose right, in empty air, its
# motors stopped: nothing slows the spin, so it stays at 3,000 °/s. The
# board's gyro reads only up to ±2,000 °/s (the Whoop 65's BMI270 and a
# typical 5″'s ICM-42688-P both do), so it reads 2,000 °/s the whole time.
# Proves the gyro limit (#26 §4, #26 §6).
format = 2
name   = "Spun at 3,000 °/s, the gyro reads 2,000 °/s"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-drag"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 0 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "roll 0 °/s, pitch 0 °/s, yaw 3000 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what   = "yaw rate"
over   = "0 s to 0.5 s"
lowest = "3000 °/s ± 0.001 °/s"
basis  = "rule: with no torque, a spin about one of the body's main axes of inertia never changes (Euler's equations for a rigid body), so the Quad really turns at 3,000 °/s throughout"

[[expect]]
what   = "gyro yaw rate"
over   = "0 s to 0.5 s"
lowest = "2000 °/s ± 0 °/s"
basis  = "rule: the gyro reads the true rotation up to the board's range, ±2,000 °/s (the Quad definition's gyro_range), and 2,000 °/s beyond it, as a real gyro saturates (#26 §4)"

[[expect]]
what    = "gyro yaw rate"
over    = "0 s to 0.5 s"
highest = "2000 °/s ± 0 °/s"
basis   = "rule: past its range the gyro reads exactly its range, never more; the lowest and the highest together show it read 2,000 °/s the whole time"

[[expect]]
what    = "gyro roll rate"
over    = "0 s to 0.5 s"
highest = "0 °/s ± 0 °/s"
basis   = "rule: the Quad doesn't roll, and each axis is read on its own, so the yaw axis's saturation leaks into no other"

[[expect]]
what   = "gyro roll rate"
over   = "0 s to 0.5 s"
lowest = "0 °/s ± 0 °/s"
basis  = "rule: the Quad doesn't roll; the lowest and the highest together show the gyro read exactly 0 °/s about the roll axis"

[[expect]]
what    = "gyro pitch rate"
over    = "0 s to 0.5 s"
highest = "0 °/s ± 0 °/s"
basis   = "rule: the Quad doesn't pitch, and each axis is read on its own"

[[expect]]
what   = "gyro pitch rate"
over   = "0 s to 0.5 s"
lowest = "0 °/s ± 0 °/s"
basis  = "rule: the Quad doesn't pitch; the lowest and the highest together show the gyro read exactly 0 °/s about the pitch axis"
