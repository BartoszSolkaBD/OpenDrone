expected = "0% ± 0%"
measured = "0%"

[[expect]]
what     = "speed east at 0.1 s"
basis    = "Observed"
expected = "-1.8 m/s ± 0.3 m/s"
measured = "-1.80 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

