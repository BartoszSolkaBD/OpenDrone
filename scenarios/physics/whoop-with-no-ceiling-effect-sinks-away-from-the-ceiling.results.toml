# Results of whoop-with-no-ceiling-effect-sinks-away-from-the-ceiling.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "With no ceiling effect, a Whoop 65 on a slowly sinking drive sinks away from the ceiling"

[[expect]]
what     = "motor 1 speed at 0 s"
basis    = "Rule"
expected = "22731.6 RPM ± 0.01%"
measured = "22700 RPM"

[[expect]]
what     = "height, highest over 0 s to 2 s"
basis    = "Observed"
expected = "3.0745 m ± 0.0002 m"
measured = "3.07 m"

[[expect]]
what     = "height at 2 s"
basis    = "Observed"
expected = "3.0425 m ± 0.005 m"
measured = "3.04 m"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

