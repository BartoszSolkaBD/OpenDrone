# The Skate Park's Launch Spot is the flat deck between the two bowls, at -1.8 m
# east and 6 m north of the Map's origin, facing west (heading 270°) into the
# pool bowl. The Freestyle 5″ landed there with its motors stopped must stay
# exactly where it is for ten seconds: the Map's colliders reach the
# Simulation, hold the Quad's weight and push it nowhere. It starts resting on
# its body box, 35 mm tall round its centre of mass, so its centre is 0.0175 m
# up. Basis for the place: packs/opendrone/maps/skate-park (its Launch Spot,
# #63).
format = 2
name   = "A landed 5-inch stays still on the Skate Park's Launch Spot"

[start]
kind              = "physics"
quad              = "test/freestyle-5-no-drag"
map               = "opendrone/skate-park"
position          = "-1.8 m east, 6 m north, 0.0175 m up"
attitude          = "level, heading 270°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "height"
over    = "0 s to 10 s"
lowest  = "0.0175 m ± 0.000001 m"
basis   = "rule: landed with its motors stopped on the Skate Park's flat deck, nothing moves the Quad: the deck holds its weight and nothing pushes it sideways, so it stays exactly where it landed (E29 in #10)"

[[expect]]
what    = "height"
over    = "0 s to 10 s"
highest = "0.0175 m ± 0.000001 m"
basis   = "rule: landed with its motors stopped on the Skate Park's flat deck, nothing moves the Quad: the deck holds its weight and nothing pushes it sideways, so it stays exactly where it landed (E29 in #10)"

[[expect]]
what    = "distance east"
over    = "0 s to 10 s"
lowest  = "-1.8 m ± 0.000001 m"
basis   = "rule: landed with its motors stopped on the Skate Park's flat deck, nothing moves the Quad: the deck holds its weight and nothing pushes it sideways, so it stays exactly where it landed (E29 in #10)"

[[expect]]
what    = "distance east"
