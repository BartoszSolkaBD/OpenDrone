# The Whoop 65 is dropped level from 1 m above where it rests on the Flat
# floor Test Map. It lands flat on its body box's four bottom corners at about
# √(2 × 9.81 m/s² × 1 m) = 4.43 m/s, bounces with its bounce of 0.3, and
# settles. Shows the bounce half of E29 in #10.
format = 1
name   = "A dropped whoop bounces and settles"

[start]
kind              = "physics"
quad              = "test/whoop-65-no-drag"
map               = "test/flat-floor"
position          = "0 m east, 0 m north, 1.01 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so the items from here to
# the Rates change nothing in this flight; they are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# A Physics Scenario scripts the four motor commands instead of the sticks.
timeline = [
  { at = "0 s", motors = "0%" },
]

[[expect]]
what    = "height"
over    = "0 s to 2 s"
lowest  = "0.01 m ± 0.0001 m"
basis   = "rule: the floor stops the whoop where its body box, 20 mm tall round its centre, touches it, so its centre never goes below 0.01 m (the physics lets a part sit at most 0.1 mm inside a surface)"

[[expect]]
what    = "vertical speed"
over    = "0.45 s to 0.6 s"
highest = "1.33 m/s ± 0.02 m/s"
basis   = "observed: it leaves the floor at its bounce times its landing speed, 0.3 × 4.43 m/s = 1.33 m/s"

[[expect]]
what    = "height"
over    = "0.5 s to 0.7 s"
highest = "0.1 m ± 0.005 m"
basis   = "observed: so it rises (1.33 m/s)² / (2 × 9.81 m/s²) = 0.09 m above where it rests"

[[expect]]
what    = "speed"
over    = "1.5 s to 2 s"
highest = "0 m/s ± 0.000001 m/s"
basis   = "observed: the bounces die away and it rests, still"
