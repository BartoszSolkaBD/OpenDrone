# Results of gyro-reads-2000-at-3000.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Spun at 3,000 °/s, the gyro reads 2,000 °/s"

[[expect]]
what     = "yaw rate, lowest over 0 s to 0.5 s"
basis    = "Rule"
expected = "3000 °/s ± 0.001 °/s"
measured = "3000 °/s"

[[expect]]
what     = "gyro yaw rate, lowest over 0 s to 0.5 s"
basis    = "Rule"
expected = "2000 °/s ± 0 °/s"
measured = "2000 °/s"

[[expect]]
what     = "gyro yaw rate, highest over 0 s to 0.5 s"
basis    = "Rule"
expected = "2000 °/s ± 0 °/s"
measured = "2000 °/s"

[[expect]]
what     = "gyro roll rate, highest over 0 s to 0.5 s"
basis    = "Rule"
expected = "0 °/s ± 0 °/s"
measured = "0 °/s"

[[expect]]
what     = "gyro roll rate, lowest over 0 s to 0.5 s"
basis    = "Rule"
expected = "0 °/s ± 0 °/s"
measured = "0 °/s"

[[expect]]
what     = "gyro pitch rate, highest over 0 s to 0.5 s"
basis    = "Rule"
expected = "0 °/s ± 0 °/s"
measured = "0 °/s"

[[expect]]
what     = "gyro pitch rate, lowest over 0 s to 0.5 s"
basis    = "Rule"
expected = "0 °/s ± 0 °/s"
measured = "0 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

