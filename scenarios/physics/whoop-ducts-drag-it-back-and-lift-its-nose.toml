# A Whoop 65 with its ducts' ram drag as its only drag flies level at 8 m/s,
# its motors "settled" at the speed that holds its height there. Each duct
# swallows air arriving across it and turns it down, which drags the Quad
# back; and a ducted rotor's centre of pressure sits higher than an open
# rotor's, so that drag also lifts the nose. Proves E25 and E26 in #10, alone:
# the direction is a Rule, the size Observed (the ducts' numbers are Estimates
# that Feel Tests tune).
#
# By hand (crates/physics/src/air.rs, "A whoop's ducts"): each rotor carries a
# quarter of the weight, exactly its hover thrust, so the ram drag is its hover
# value, 1.2 s⁻¹ × 8 m/s = 9.6 m/s² against the motion. It acts 8 mm (the
# props' plane) + 13 mm (the duct's centre of pressure above it) = 21 mm above
# the centre of mass: 0.021 m × 0.0312 kg × 9.6 m/s² = 6.2899 × 10⁻³ N·m nose
# up, 698.88 rad/s² over a pitch inertia of 90 g·cm², and 5.0054 °/s after one
# step. That nose-up moment is more than ten times rotor drag's.
format = 1
name   = "A Whoop 65's ducts drag it back and lift its nose"

[start]
kind              = "physics"
quad              = "test/whoop-65-ducts-only"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 2 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s east, 8 m/s north, 0 m/s up"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# 31.1%: the drive that holds the settled 19,659 RPM on this pack once it has
# sagged under that load.
timeline = [
  { at = "0 s", motors = "31.1%" },
]

[[expect]]
what  = "acceleration north"
at    = "0.000125 s"
value = "between -1000 m/s² and -0.1 m/s²"
basis = "rule: the ducts turn the air arriving across them straight down, taking its momentum, so they push against the motion: the Quad slows"

[[expect]]
what  = "pitch rate"
at    = "0.000125 s"
value = "between 0.01 °/s and 1000 °/s"
basis = "rule: the ducts' drag acts above the centre of mass, the props' plane plus the duct's centre of pressure above it, so pulling back up there lifts the nose"

[[expect]]
what  = "acceleration north"
at    = "0.000125 s"
value = "-9.60 m/s² ± 1%"
basis = "observed: the ram drag slows it at 9.60 m/s² on the first step, as worked out by hand above"

[[expect]]
what  = "pitch rate"
at    = "0.000125 s"
value = "5.01 °/s ± 1%"
basis = "observed: the nose-up moment turns it at 5.01 °/s after the first step, as worked out by hand above"

[[expect]]
what  = "pitch"
at    = "0.05 s"
value = "47.8° ± 2°"
basis = "observed: with nothing to hold it level, the ducts lift its nose 48° in 0.05 s"
