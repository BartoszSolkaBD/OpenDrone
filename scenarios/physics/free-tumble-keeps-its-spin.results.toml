# Results of free-tumble-keeps-its-spin.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A free tumble at 2,000 °/s keeps its spin and ends at the exact attitude"

[[expect]]
what     = "roll rate, lowest over 0 s to 1.125 s"
basis    = "Rule"
expected = "2000 °/s ± 0.001 °/s"
measured = "2000 °/s"

[[expect]]
what     = "roll rate, highest over 0 s to 1.125 s"
basis    = "Rule"
expected = "2000 °/s ± 0.001 °/s"
measured = "2000 °/s"

[[expect]]
what     = "pitch rate, highest over 0 s to 1.125 s"
basis    = "Rule"
expected = "0 °/s ± 0.001 °/s"
measured = "0 °/s"

[[expect]]
what     = "pitch rate, lowest over 0 s to 1.125 s"
basis    = "Rule"
expected = "0 °/s ± 0.001 °/s"
measured = "0 °/s"

[[expect]]
what     = "yaw rate, highest over 0 s to 1.125 s"
basis    = "Rule"
expected = "0 °/s ± 0.001 °/s"
measured = "0 °/s"

[[expect]]
what     = "yaw rate, lowest over 0 s to 1.125 s"
basis    = "Rule"
expected = "0 °/s ± 0.001 °/s"
measured = "0 °/s"

[[expect]]
what     = "roll at 1.125 s"
basis    = "Rule"
expected = "90° ± 0.001°"
measured = "90.0°"

[[expect]]
what     = "pitch at 1.125 s"
basis    = "Rule"
expected = "30° ± 0.001°"
measured = "30.0°"

[[expect]]
what     = "heading at 1.125 s"
basis    = "Rule"
expected = "45° ± 0.001°"
measured = "45.0°"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

