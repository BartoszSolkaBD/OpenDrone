# Results of 5-inch-prop-jammed-from-a-standstill.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A 5-inch prop jammed against a block from a standstill gets 2 restarts: its first start counts as a failed one"

[[expect]]
what     = "motor 2 drive at 0.600125 s"
basis    = "Source"
expected = "1.96% ± 0.001%"
measured = "1.96%"

[[expect]]
what     = "motor 2 restarts at 0.600125 s"
basis    = "Source"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "motor 2 drive, lowest over 0.600125 s to 1.59 s"
basis    = "Source"
expected = "1.96% ± 0.001%"
measured = "1.96%"

[[expect]]
what     = "motor 2 drive, lowest over 0.600125 s to 2.42 s"
basis    = "Source"
expected = "0% ± 0%"
measured = "0%"

[[expect]]
what     = "motor 2 restarts at 2.5 s"
basis    = "Source"
expected = "1 ± 0"
measured = "1.00"

[[expect]]
what     = "motor 2 restarts at 4.3 s"
basis    = "Source"
expected = "2 ± 0"
measured = "2.00"

[[expect]]
what     = "motor 2 restarts, highest over 0 s to 7 s"
basis    = "Source"
expected = "2 ± 0"
measured = "2.00"

[[expect]]
what     = "motor 2 drive, highest over 6 s to 7 s"
basis    = "Source"
expected = "0% ± 0%"
measured = "0%"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

