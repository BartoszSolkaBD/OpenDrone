# Results of 5-inch-hovers-on-a-cushion-over-the-floor.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "Two rotor radii over the floor, a Freestyle 5″'s rotors give 10.6% more thrust, so it hovers on slower motors"

[[expect]]
what     = "motor 1 speed at 0 s"
basis    = "Source"
expected = "8990.1 RPM ± 0.01%"
measured = "8990 RPM"

[[expect]]
what     = "total thrust at 0 s"
basis    = "Rule"
expected = "652.22 gf ± 0.01%"
measured = "652 gf"

[[expect]]
what     = "vertical acceleration at 0.000125 s"
basis    = "Rule"
expected = "0 m/s² ± 0.02 m/s²"
measured = "0.00528 m/s²"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "0c4f9e5d0678cca4"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "15cbeb4e88c44e72"   # test/flat-floor
run  = "b019480f29d60789"   # the whole state after each of 1 steps at 8000 Hz, in order

[fingerprints.checkpoints]   # the whole state after each tenth of the run
"0.000125 s" = "a4bfbedf88aac98d"
