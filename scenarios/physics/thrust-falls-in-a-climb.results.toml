# Results of thrust-falls-in-a-climb.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "At a fixed command, a drag-free Whoop 65's thrust falls as it climbs, until it climbs steadily"

[[expect]]
what     = "motor 1 speed, lowest over 0.5 s to 12 s"
basis    = "Rule"
expected = "24956.8 RPM ± 0.01%"
measured = "25000 RPM"

[[expect]]
what     = "motor 1 speed, highest over 0.5 s to 12 s"
basis    = "Rule"
expected = "24956.8 RPM ± 0.01%"
measured = "25000 RPM"

[[expect]]
what     = "total thrust at 0.5 s"
basis    = "Rule"
expected = "between 31.211 gf and 37.620 gf"
measured = "36.0 gf"

[[expect]]
what     = "total thrust at 12 s"
basis    = "Rule"
expected = "31.211 gf ± 0.1%"
measured = "31.2 gf"

[[expect]]
what     = "vertical speed at 12 s"
basis    = "Rule"
expected = "3.2345 m/s ± 0.3%"
measured = "3.23 m/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "78d3b584aee23426"   # test/whoop-65-no-drag-bench-supply: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "4a7b919a8882fa52"   # the whole state after each of 96000 steps at 8000 Hz, in order

