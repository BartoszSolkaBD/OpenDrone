format   = 1
scenario = "A Whoop 65 falling belly first reaches its terminal speed, 17.1 m/s"

[[expect]]
what     = "vertical speed at 1 s"
basis    = "Rule"
expected = "-8.8632 m/s ± 0.1%"
measured = "-8.86 m/s"

[[expect]]
what     = "vertical speed at 10 s"
