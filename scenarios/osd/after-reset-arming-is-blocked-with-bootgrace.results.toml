# Results of after-reset-arming-is-blocked-with-bootgrace.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "After Reset, arming is blocked with BOOTGRACE, and the timers start again from zero"

[[expect]]
what     = "the Quad arms, first over 2 s to 2.5 s"
