# Results of a-lost-link-shows-rxloss-then-failsafe-with-the-arm-switch-on.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A lost Radio Link with the Arm switch on shows RXLOSS, then FAILSAFE and RXLOSS in turn, and the Flight Mode reads !FS!"

[[expect]]
what     = "warnings reads RXLOSS, first over 1 s to 2 s"
basis    = "Source"
expected = "between 0.146 s and 0.2296 s"
measured = "0.167 s"

[[expect]]
what     = "warnings blinks at 1.5 s"
basis    = "Source"
expected = "no"
measured = "no"

[[expect]]
what     = "warnings reads FAIL SAFE, first over 1 s to 4 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "warnings reads FAILSAFE, first over 2 s to 3 s"
basis    = "Source"
expected = "between 0.497 s and 1.0917 s"
measured = "0.917 s"

[[expect]]
what     = "warnings reads RXLOSS, first over 3 s to 4 s"
basis    = "Source"
expected = "between 0.417 s and 0.5917 s"
measured = "0.500 s"

[[expect]]
what     = "Flight Mode reads !FS!, first over 1 s to 3 s"
basis    = "Source"
expected = "between 1.497 s and 1.5917 s"
measured = "1.50 s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "aec02cafcbd83670"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "c8243aee93cdc115"   # the whole state after each of 32000 steps at 8000 Hz, in order

