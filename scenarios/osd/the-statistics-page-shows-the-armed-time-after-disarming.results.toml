# Results of the-statistics-page-shows-the-armed-time-after-disarming.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The statistics page shows the armed time after disarming, and throttle up dismisses it"

[[expect]]
what     = "the Quad disarms, first over 6.5 s to 7 s"
basis    = "Source"
expected = "0.016125 s ± 0.000001 s"
measured = "0.0161 s"

[[expect]]
what     = "statistics page at 6.5 s"
basis    = "Source"
expected = "(blank)"
measured = "(blank)"

[[expect]]
what     = "statistic TOTAL ARM at 7 s"
basis    = "Source"
expected = "00:04"
measured = "00:04"

[[expect]]
what     = "statistics page at 7 s"
basis    = "Observed"
expected = "--- STATS --- / TOTAL ARM : 00:04 / MIN BATTERY : 25.18V / MAX CURRENT : 0.16A / USED MAH : 0mAh"
measured = "--- STATS --- / TOTAL ARM : 00:04 / MIN BATTERY : 25.18V / MAX CURRENT : 0.16A / USED MAH : 0mAh"

[[expect]]
what     = "statistics page reads (blank), first over 8 s to 8.3 s"
basis    = "Source"
expected = "between 0.0001 s and 0.1677 s"
measured = "0.0835 s"

[[expect]]
what     = "disarmed at 8.3 s"
basis    = "Source"
expected = "DISARMED"
measured = "DISARMED"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

