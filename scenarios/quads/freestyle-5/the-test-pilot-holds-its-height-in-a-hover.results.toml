# Results of the-test-pilot-holds-its-height-in-a-hover.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Test Pilot holds the Freestyle 5″'s height, with its motors at about 25% and its power above the physical minimum"

[[expect]]
what     = "height at 30 s"
basis    = "Rule"
expected = "20 m ± 0.5 m"
measured = "20.0 m"

[[expect]]
what     = "height, lowest over 5 s to 30 s"
basis    = "Rule"
expected = "20 m ± 0.5 m"
measured = "20.0 m"

[[expect]]
what     = "height, highest over 5 s to 30 s"
basis    = "Rule"
expected = "20 m ± 0.5 m"
measured = "20.0 m"

[[expect]]
what     = "roll, highest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.118°"

[[expect]]
what     = "pitch, lowest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "-0.118°"

[[expect]]
what     = "heading at 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.116°"

[[expect]]
what     = "roll, lowest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.00000000101°"

[[expect]]
what     = "pitch, highest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "-0.000000000941°"

[[expect]]
what     = "tilt, highest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.166°"

[[expect]]
what     = "heading, lowest over 5 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.106°"

[[expect]]
what     = "heading, highest over 5 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.117°"

[[expect]]
what     = "total thrust, mean over 10 s to 30 s"
basis    = "Rule"
expected = "652 gf ± 10 gf"
measured = "652 gf"

[[expect]]
what     = "average motor command, mean over 10 s to 30 s"
basis    = "Rule"
expected = "between 15% and 30%"
measured = "24.8%"

[[expect]]
what     = "average motor command, mean over 10 s to 30 s"
basis    = "Observed"
expected = "24.8% ± 0.5%"
measured = "24.8%"

[[expect]]
what     = "battery power, lowest over 5 s to 30 s"
basis    = "Rule"
expected = "between 45.0 W and 400 W"
measured = "96.5 W"

[[expect]]
what     = "battery power, mean over 5 s to 30 s"
basis    = "Observed"
expected = "100 W ± 1 W"
measured = "100 W"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

