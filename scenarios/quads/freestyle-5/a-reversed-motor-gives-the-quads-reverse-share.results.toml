# Results of a-reversed-motor-gives-the-quads-reverse-share.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A reversed motor gives the Quad's reverse share of thrust and torque, from 0.12 s after arming"

[[expect]]
what     = "Crash Flip starts, first over 0 s to 0.2 s"
basis    = "Source"
expected = "0.104125 s ± 0.000001 s"
measured = "0.104 s"

[[expect]]
what     = "motor 2 DShot at 0.12 s"
basis    = "Source"
expected = "21 ± 0"
measured = "21.0"

[[expect]]
what     = "motor 2 DShot at 0.13 s"
basis    = "Source"
expected = "2047 ± 0"
measured = "2050"

[[expect]]
what     = "motor 2 speed, highest over 0 s to 0.225 s"
basis    = "Source"
expected = "0 RPM ± 0 RPM"
measured = "0 RPM"

[[expect]]
what     = "motor 2 drive at 0.2255 s"
basis    = "Source"
expected = "1.96% ± 0.001%"
measured = "1.96%"

[[expect]]
what     = "motor 2 direction at 0.2255 s"
basis    = "Source"
expected = "-1 ± 0"
measured = "-1.00"

[[expect]]
what     = "motor 2 speed at 1.5 s"
basis    = "Rule"
expected = "-29500 RPM ± 0.5%"
measured = "-29500 RPM"

[[expect]]
what     = "motor 2 thrust at 1.5 s"
basis    = "Rule"
expected = "-762 gf ± 1%"
measured = "-761 gf"

[[expect]]
what     = "motor 2 torque at 1.5 s"
basis    = "Rule"
expected = "-0.1802 N·m ± 1%"
measured = "-0.180 N·m"

[[expect]]
what     = "battery current at 1.5 s"
basis    = "Rule"
expected = "35.0 A ± 1%"
measured = "35.0 A"

[[expect]]
what     = "motor 1 thrust at 1.5 s"
basis    = "Source"
expected = "0 gf ± 0 gf"
measured = "0 gf"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

