# Results of battery-recovers-after-a-chop.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Freestyle 5″'s pack recovers after a chop"

[[expect]]
what     = "battery sag at 4.5 s"
basis    = "Observed"
expected = "0.56081 V ± 0.01%"
measured = "0.561 V"

[[expect]]
what     = "battery sag at 7.8 s"
basis    = "Source"
expected = "0.20631 V ± 0.1%"
measured = "0.206 V"

[[expect]]
what     = "battery current, highest over 4.5 s to 7.8 s"
basis    = "Rule"
expected = "0 A ± 0 A"
measured = "0 A"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

