# Results of thrust-table.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Freestyle 5″'s motor and prop meet T-Motor's T5147 thrust table"

[[expect]]
what     = "motor 1 thrust at 0.9 s"
basis    = "Observed"
expected = "210.1 gf ± 1%"
measured = "210 gf"

[[expect]]
what     = "motor 1 speed at 0.9 s"
basis    = "Source"
expected = "11293.6 RPM ± 6%"
measured = "10700 RPM"

[[expect]]
what     = "battery current at 0.9 s"
basis    = "Source"
expected = "2.2 A ± 35%"
measured = "1.51 A"

