format   = 1
scenario = "TII's quad punches out with the thrust and the sag it logged (flight 01a)"

[[expect]]
what     = "felt acceleration up, mean gap from the recorded flight over 0.1 s to 0.3 s"
basis    = "Source"
expected = "0 m/s² ± 3 m/s²"
measured = "1.43 m/s²"

[[expect]]
what     = "battery voltage, mean gap from the recorded flight over 0.1 s to 0.3 s"
