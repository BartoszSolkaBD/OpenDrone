# TII's racing quad slowing from about 5 m/s as it comes in to hover,
# flight-01a from 15.3 s, pitched about 20° nose up and turning slowly. Its
# thrust has no forward or sideways part, so what the accelerometer feels
# forward and sideways is the air's drag alone: at these speeds almost all of
# it is rotor drag, the H-force. This is what fits the Freestyle 5″'s rotor
# drag (docs/research/quad-definitions.md, "Fitted to the TII logs"), which
# the Test Quad keeps.
#
# Only 0.1 s is compared, from 0.05 s, once the "settled" motors have taken
# up the logged commands: an open-loop replay drifts away from the real
# flight within a few tenths of a second, because the logged commands are
# the Flight Controller's answers to the real quad's own motion (and the
# logs show a nose-up moment at speed the physics doesn't make; same page).
format = 2
name   = "TII's quad slows from 5 m/s with the rotor drag it logged (flight 01a)"
recorded_flight = "slowing-from-5-m-s-in-flight-01a-recorded.csv"

[start]
kind              = "physics"
quad              = "test/freestyle-5-tii-racing-quad"
map               = "test/empty-air"
# Where TII's motion capture had the quad when the window starts (its x, y
# and z as east, north and up), how it pointed and moved, and its gyro;
# `cargo xtask tii-logs` prints these. Empty air: the logs' floor is far
# below the rotors here (more than ten rotor radii), so it adds nothing.
position = "-2.871 m east, -1.512 m north, 0.707 m up"
attitude = "roll -3.66°, pitch 19.24°, heading 91.71°"
speed    = "5.070 m/s east, -0.256 m/s north, -0.030 m/s up"
rotation = "roll 7.3 °/s, pitch 10.9 °/s, yaw -1.6 °/s"
# Every starting state spells out everything (ADR-0002). In a Physics Scenario
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing in this
# flight; they are written down all the same.
armed             = true
motors            = "settled"
flight_controller = "fresh"
# The charge whose voltage, with this window's load, is the logged voltage
# at the window's start (chosen, so Observed).
battery           = "65%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# The motor commands Betaflight sent, every 2 ms, with the hover trim.
input_track = "slowing-from-5-m-s-in-flight-01a-motors.csv"

[[expect]]
what     = "felt acceleration forward"
over     = "0.05 s to 0.15 s"
mean_gap = "0 m/s² ± 0.25 m/s²"
basis    = "source: TII's Race Against the Machine logs (CC BY 4.0, NOTICE.md), flight 01a: the replay feels the logged drag, about 1.6 m/s² backwards, within 0.25 m/s²: the size of the accelerometer's still-hover offset, which the converter takes off, and of its 10 Hz low-pass's lag while the drag changes"

[[expect]]
what     = "felt acceleration left"
over     = "0.05 s to 0.15 s"
mean_gap = "0 m/s² ± 0.25 m/s²"
basis    = "source: TII's Race Against the Machine logs (CC BY 4.0, NOTICE.md), flight 01a: flying almost straight forward, the replay feels next to no sideways drag, as the quad did, within the same 0.25 m/s²"
