# The Freestyle 5″'s motor and prop on the thrust stand, against T-Motor's own
# table for the Velox V2207 V3 1750KV with T5147 props (T-Motor's store page,
# read 2026-10-07), on the same 24.0 V bench supply T-Motor used
# (test/freestyle-5-bench-supply). Proves thrust and torque growing with the
# square of speed, from a motor model driven by the supply's voltage (E4 and
# E6 in #10, ADR-0006).
#
# T-Motor's table, motor 1750KV, prop T5147:
#
#   throttle   voltage   current   speed          thrust
#     20%      24.0 V     2.2 A    11,293.6 RPM    210.1 g
#     40%      24.0 V     7.0 A    17,179.4 RPM    525.7 g
#     60%      23.8 V    12.7 A    20,865.8 RPM    784.6 g
#     80%      23.7 V    21.1 A    25,070.7 RPM  1,158.9 g
#    100%      23.5 V    34.6 A    29,447.1 RPM  1,591.1 g
#
# T-Motor's "throttle" is a share of its stand's signal, not the share of the
# supply's voltage the ESC puts across the motor (its drive), which is what a
# Scenario commands: the 20% row turns 11,294 RPM, faster than a 1750 KV
# motor can turn on 20% of 24.0 V (8,400 RPM). So below full throttle each
# step's command is chosen to make the row's thrust, and the row's speed and
# current are what's checked. At 100% the command is full drive, as on the
# stand.
#
# One motor runs; "gf" is grams of thrust, as the table's "g" means.
format = 2
name   = "The Freestyle 5″'s motor and prop meet T-Motor's T5147 thrust table"

[start]
kind              = "thrust stand"
quad              = "test/freestyle-5-bench-supply"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 0 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). On the thrust stand
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing here; they
# are written down all the same. The bench supply gives 24.0 V at 50%.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "50%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
# Motor 1 only, in Betaflight's motor order; each step settles for 0.4 s or
# more before it's measured (the motor's spin-up time is 33 ms).
timeline = [
  { at = "0 s",   motors = "29.6%, 0%, 0%, 0%" },
  { at = "1 s",   motors = "50.2%, 0%, 0%, 0%" },
  { at = "1.5 s", motors = "63.9%, 0%, 0%, 0%" },
  { at = "2 s",   motors = "81.5%, 0%, 0%, 0%" },
  { at = "2.5 s", motors = "100%, 0%, 0%, 0%" },
]

# The 20% row.
[[expect]]
what  = "motor 1 thrust"
at    = "0.9 s"
value = "210.1 gf ± 1%"
basis = "observed: the command, 29.6%, was chosen to make the 20% row's thrust"

[[expect]]
what  = "motor 1 speed"
at    = "0.9 s"
value = "11293.6 RPM ± 6%"
basis = "source: T-Motor's T5147 table, 20% row: 210.1 g at 11,293.6 RPM. The prop's thrust coefficient is fitted to the whole table, which it follows within 10% from 20% to 100% (docs/research/quad-definitions.md), so the slowest row is checked to 6%"

[[expect]]
what  = "battery current"
at    = "0.9 s"
value = "2.2 A ± 35%"
basis = "source: T-Motor's T5147 table, 20% row: 2.2 A. The motor model's power coefficient is one number, fitted to the full-throttle row; a small prop takes more power for its thrust at low speed, so the slowest row draws more than the model says, and is checked only to 35%"

# The 40% row.
[[expect]]
what  = "motor 1 thrust"
at    = "1.4 s"
value = "525.7 gf ± 1%"
basis = "observed: the command, 50.2%, was chosen to make the 40% row's thrust"

[[expect]]
what  = "motor 1 speed"
at    = "1.4 s"
value = "17179.4 RPM ± 2%"
basis = "source: T-Motor's T5147 table, 40% row: 525.7 g at 17,179.4 RPM"

[[expect]]
what  = "battery current"
at    = "1.4 s"
value = "7.0 A ± 15%"
basis = "source: T-Motor's T5147 table, 40% row: 7.0 A at 24.0 V. Checked to 15% for the reason the 20% row gives"

# The 60% row.
[[expect]]
what  = "motor 1 thrust"
at    = "1.9 s"
value = "784.6 gf ± 1%"
basis = "observed: the command, 63.9%, was chosen to make the 60% row's thrust"

[[expect]]
what  = "motor 1 speed"
at    = "1.9 s"
value = "20865.8 RPM ± 2%"
basis = "source: T-Motor's T5147 table, 60% row: 784.6 g at 20,865.8 RPM"

[[expect]]
what  = "battery current"
at    = "1.9 s"
value = "12.7 A ± 12%"
basis = "source: T-Motor's T5147 table, 60% row: 12.7 A at 23.8 V. Checked to 12% for the reason the 20% row gives"

# The 80% row.
[[expect]]
what  = "motor 1 thrust"
at    = "2.4 s"
value = "1158.9 gf ± 1%"
basis = "observed: the command, 81.5%, was chosen to make the 80% row's thrust"

[[expect]]
what  = "motor 1 speed"
at    = "2.4 s"
value = "25070.7 RPM ± 2%"
basis = "source: T-Motor's T5147 table, 80% row: 1,158.9 g at 25,070.7 RPM"

[[expect]]
what  = "battery current"
at    = "2.4 s"
value = "21.1 A ± 5%"
basis = "source: T-Motor's T5147 table, 80% row: 21.1 A at 23.7 V"

# The 100% row: full drive, as on T-Motor's stand.
[[expect]]
what  = "motor 1 thrust"
at    = "3 s"
value = "1591.1 gf ± 3%"
basis = "source: T-Motor's T5147 table, 100% row: 1,591.1 g"

[[expect]]
what  = "motor 1 speed"
at    = "3 s"
value = "29447.1 RPM ± 2%"
basis = "source: T-Motor's T5147 table, 100% row: 29,447.1 RPM"

[[expect]]
what  = "battery current"
at    = "3 s"
value = "34.6 A ± 5%"
basis = "source: T-Motor's T5147 table, 100% row: 34.6 A"

[[expect]]
what  = "battery voltage"
at    = "3 s"
value = "23.5 V ± 0.05 V"
basis = "source: T-Motor's T5147 table, 100% row: 23.5 V. The bench supply's 24.0 V behind 14.5 mΩ of leads gives 24.0 V − 35 A × 14.5 mΩ = 23.5 V"
