# The Whoop 65 on the thrust stand, on its own full LAVA II pack: a hover's
# worth of drive, a punch, then a chop. Proves the battery's charge counting,
# its sag and its recovery after a chop (E13 and E14 in #10).
#
# - Charge: the pack counts every bit of current that leaves it, so the
#   charge used is the current over time.
# - Sag: a punch sags the voltage at once by the current times the pack's
#   resistance (29 mΩ, from BetaFPV's discharge curve) and the BT2.0
#   connector's (10 mΩ).
# - Recovery: part of a pack's sag builds up slowly under load and dies away
#   slowly after it, as Bauersfeld & Scaramuzza fitted one resistor–capacitor
#   pair to ten 4S–6S packs, with a time constant of 3.3 s (flight-dynamics
#   research §5.3, [S7]); the Quad definition's recovery time. Once the motors
#   have stopped and nothing is drawn, that slow part is all the sag left, and
#   it shrinks to 37% in each 3.3 s.
format = 1
name   = "The Whoop 65's pack counts its charge, a punch sags it by current × resistance, and it recovers after a chop"

[start]
kind              = "thrust stand"
quad              = "opendrone/whoop-65"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 0 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). On the thrust stand
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing here; they
# are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s",   motors = "0%" },
  { at = "0.5 s", motors = "50%" },
  { at = "3 s",   motors = "100%" },
  { at = "4 s",   motors = "0%" },
]

[[expect]]
what  = "battery current"
over  = "0 s to 8 s"
mean  = "2.3459 A ± 0.01%"
basis = "observed: what the four motors draw, on average, over the run"

[[expect]]
what  = "battery charge used"
at    = "8 s"
value = "5.2131 mAh ± 0.01%"
basis = "rule: the charge used is the current over time: 2.3459 A × 8 s = 18.767 A·s, and 1 mAh is 3.6 A·s, so 5.2131 mAh"

[[expect]]
what  = "battery current"
at    = "3 s"
value = "2.6425 A ± 0.01%"
basis = "observed: what four motors at 50% draw, just before the punch"

[[expect]]
what  = "battery sag"
at    = "3 s"
value = "0.12200 V ± 0.01%"
basis = "observed: the sag just before the punch"

[[expect]]
what  = "battery current"
at    = "3.000125 s"
value = "16.407 A ± 0.01%"
basis = "observed: one step into the punch, the current rushes as the motors start to speed up"

[[expect]]
what  = "battery sag"
at    = "3.000125 s"
value = "0.65882 V ± 0.1%"
basis = "rule: a punch sags the voltage at once by the extra current times the pack's resistance and its connector's, 29 mΩ + 10 mΩ; the slow part can't move in one step. 0.12200 V + (16.407 A − 2.6425 A) × 39 mΩ = 0.65882 V"

[[expect]]
what  = "battery sag"
at    = "4.5 s"
value = "0.046900 V ± 0.01%"
basis = "observed: 0.5 s after the chop the motors have stopped, so nothing is drawn, and the sag left is the slow part the punch built up"

[[expect]]
what  = "battery sag"
at    = "7.8 s"
value = "0.017254 V ± 0.1%"
basis = "source: Bauersfeld & Scaramuzza's battery model, a recovery time constant of 3.3 s (flight-dynamics research §5.3, [S7]): 3.3 s later the slow sag has shrunk to e⁻¹ = 36.79% of what it was at 4.5 s, 0.046900 V × 0.36788 = 0.017254 V"
