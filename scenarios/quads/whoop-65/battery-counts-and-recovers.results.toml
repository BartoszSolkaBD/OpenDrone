# Results of battery-counts-and-recovers.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Whoop 65's pack counts its charge, a punch sags it by current × resistance, and it recovers after a chop"

[[expect]]
what     = "battery current, mean over 0 s to 8 s"
basis    = "Observed"
expected = "2.3459 A ± 0.01%"
measured = "2.35 A"

[[expect]]
what     = "battery charge used at 8 s"
basis    = "Rule"
expected = "5.2131 mAh ± 0.01%"
measured = "5.21 mAh"

[[expect]]
what     = "battery current at 3 s"
basis    = "Observed"
expected = "2.6425 A ± 0.01%"
measured = "2.64 A"

[[expect]]
what     = "battery sag at 3 s"
basis    = "Observed"
expected = "0.12200 V ± 0.01%"
measured = "0.122 V"

[[expect]]
what     = "battery current at 3.000125 s"
basis    = "Observed"
expected = "16.407 A ± 0.01%"
measured = "16.4 A"

[[expect]]
what     = "battery sag at 3.000125 s"
basis    = "Rule"
expected = "0.65882 V ± 0.1%"
measured = "0.659 V"

[[expect]]
what     = "battery sag at 4.5 s"
basis    = "Observed"
expected = "0.046900 V ± 0.01%"
measured = "0.0469 V"

[[expect]]
what     = "battery sag at 7.8 s"
basis    = "Source"
expected = "0.017254 V ± 0.1%"
measured = "0.0173 V"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "7d5c4ccb6951a4ae"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "e26d92510ec5e59c"   # the whole state after each of 64000 steps at 8000 Hz, in order

