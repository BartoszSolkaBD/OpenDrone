# Results of full-right-roll-on-its-imported-tune.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Whoop 65 flies on its imported Tune: full right roll reaches the max rate"

[[expect]]
what     = "roll setpoint at 1.25 s"
basis    = "Source"
expected = "670 °/s ± 0.01 °/s"
measured = "670 °/s"

[[expect]]
what     = "roll rate, mean over 2 s to 3 s"
basis    = "Source"
expected = "670 °/s ± 3%"
measured = "665 °/s"

[[expect]]
what     = "roll rate at 0.9 s"
basis    = "Observed"
expected = "0 °/s ± 0.5 °/s"
measured = "0.0936 °/s"

[[expect]]
what     = "roll rate, highest over 1.5 s to 3 s"
basis    = "Observed"
expected = "837 °/s ± 3%"
measured = "837 °/s"

[[expect]]
what     = "roll rate, lowest over 1.5 s to 3 s"
basis    = "Observed"
expected = "501 °/s ± 3%"
measured = "501 °/s"

[[expect]]
what     = "pitch rate, lowest over 1 s to 3 s"
basis    = "Observed"
expected = "-27.1 °/s ± 3 °/s"
measured = "-28.2 °/s"

[[expect]]
what     = "pitch rate, highest over 1 s to 3 s"
basis    = "Observed"
expected = "17.0 °/s ± 3 °/s"
measured = "17.0 °/s"

[[expect]]
what     = "yaw rate, lowest over 1 s to 3 s"
basis    = "Observed"
expected = "-9.35 °/s ± 1.5 °/s"
measured = "-10.0 °/s"

[[expect]]
what     = "yaw rate, highest over 1 s to 3 s"
basis    = "Observed"
expected = "12.2 °/s ± 1.5 °/s"
measured = "12.2 °/s"

[[expect]]
what     = "roll rate at 3.5 s"
basis    = "Observed"
expected = "-4.93 °/s ± 5 °/s"
measured = "-4.93 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "c1a723ac6117a0ee"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "aa13c42576ac3cdb"   # the whole state after each of 28000 steps at 8000 Hz, in order

