# Results of motor-step.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Whoop 65 motor stepped 0 → 100 → 0% follows its spin-up and slow-down times"

[[expect]]
what     = "motor 1 speed, highest over 0.5 s to 0.6 s"
basis    = "Source"
expected = "0 RPM ± 0 RPM"
measured = "0 RPM"

[[expect]]
what     = "motor 1 drive, highest over 0.6 s to 0.75 s"
basis    = "Source"
expected = "1.96% ± 0.001%"
measured = "1.96%"

[[expect]]
what     = "motor 1 speed at 0.7505 s"
basis    = "Observed"
expected = "1377 RPM ± 1%"
measured = "1380 RPM"

[[expect]]
what     = "motor 1 speed at 0.7855 s"
basis    = "Observed"
expected = "29330 RPM ± 2%"
measured = "29300 RPM"

[[expect]]
what     = "motor 1 speed at 1.5 s"
basis    = "Observed"
expected = "45600 RPM ± 1%"
measured = "45600 RPM"

[[expect]]
what     = "motor 1 speed at 1.535 s"
basis    = "Observed"
expected = "17500 RPM ± 2%"
measured = "17500 RPM"

[[expect]]
what     = "motor 1 drive, highest over 1.75 s to 2 s"
basis    = "Source"
expected = "0% ± 0%"
measured = "0%"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "e1b10041d9bdf2fc"   # test/whoop-65-bench-supply: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "de2c11659769d6c2"   # the whole state after each of 16000 steps at 8000 Hz, in order

