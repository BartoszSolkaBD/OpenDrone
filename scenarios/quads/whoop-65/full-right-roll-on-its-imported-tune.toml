# The Whoop 65 flies on its own Tune, imported from the Meteor65 Pro's diff
# all (Betaflight 4.3.0, translated into 2026.6 settings by the Betaflight
# CLI translator, #53): P/I/D 40/64/45 on roll, the D being 4.3's d_min. It
# starts as the Freestyle 5″'s tracer does, scenarios/flight-controller/
# full-right-roll-reaches-the-max-rate.toml: mid-air, armed, motors
# "settled", the throttle at 30% so Airmode has started (25%). Then it holds
# full right roll for two seconds on Betaflight's default Rates, Actual
# 70/670/0, about three and a half turns.
#
# At 30% throttle the whoop sinks, about 13 m in the three seconds, with
# the air acting on it (#108). Its roll rate swings above and below the max
# rate as it rolls on, and the PID loop pulls it back: over a whole second
# it holds the max rate.
#
# Sinking a few metres a second, its rotors are inside the band where a
# rotor sinks into its own air, so Prop Wash (#46) shakes it as it rolls,
# each rotor's thrust flickering its own way: the PID loop fights it, and
# its pitch and yaw rates wander by up to about 27 °/s and 10 °/s instead of
# holding still, and half a second after the stick is let go it still
# shakes. How hard comes from the Whoop 65's Prop Wash numbers and the
# random seed.
#
# The Flight Controller flies the Tune's "Not simulated yet" settings as off
# until their tickets land: feedforward and the filters (#49), Dynamic D and
# I-term relax (#50). So the roll spins up on P, I and D, without
# feedforward. The Source Expectations hold either way; the Observed swings
# will move when those land.
format = 2
name   = "The Whoop 65 flies on its imported Tune: full right roll reaches the max rate"

[start]
kind              = "flight"
quad              = "opendrone/whoop-65"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 50 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight's default rate profile, which the Meteor65 Pro's diff all keeps.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s",   roll = "0%", pitch = "0%", yaw = "0%", throttle = "30%", arm = "on", crash_flip = "off" },
  { at = "1 s",   roll = "100%" },
  { at = "3 s",   roll = "0%" },
]

[[expect]]
what  = "roll setpoint"
at    = "1.25 s"
value = "670 °/s ± 0.01 °/s"
basis = "source: applyActualRates (Betaflight 2026.6.2, src/main/fc/rc.c): full stick asks for the max rate, 670 °/s"

[[expect]]
what  = "roll rate"
over  = "2 s to 3 s"
mean  = "670 °/s ± 3%"
basis = "source: Betaflight's Actual rates: full right roll holds the max rate, 670 °/s, as the Betaflight App shows it"

[[expect]]
what  = "roll rate"
at    = "0.9 s"
value = "0 °/s ± 0.5 °/s"
basis = "observed: with the sticks centred the whoop holds still; a centred stick reaches Betaflight at 1500.77 µs over CRSF, which asks for only 0.11 °/s"

[[expect]]
what    = "roll rate"
over    = "1.5 s to 3 s"
highest = "829 °/s ± 3%"
basis   = "observed: the roll rate swings around the max rate as the sinking whoop rolls on, with the air acting on it (#108); feedforward (#49) and I-term relax (#50) will change how far"

[[expect]]
what    = "roll rate"
over    = "1.5 s to 3 s"
lowest  = "491 °/s ± 3%"
basis   = "observed: the roll rate swings around the max rate as the sinking whoop rolls on, with the air acting on it (#108) and Prop Wash shaking it (#46: was 530 °/s without it); feedforward (#49) and I-term relax (#50) will change how far"

[[expect]]
what    = "pitch rate"
over    = "1 s to 3 s"
lowest  = "-27.1 °/s ± 3 °/s"
basis   = "observed: full right roll asks for nothing in pitch, but Prop Wash shakes the sinking whoop (#46), and the PID loop holds pitch within about 27 °/s of what the centred stick asks (it held it within 1 °/s without Prop Wash); the values moved when the flicker began to draw per rotor"

[[expect]]
what    = "pitch rate"
over    = "1 s to 3 s"
highest = "14.7 °/s ± 3 °/s"
basis   = "observed: full right roll asks for nothing in pitch, but Prop Wash shakes the sinking whoop (#46), and the PID loop holds pitch within about 27 °/s of what the centred stick asks (it held it within 1 °/s without Prop Wash); the values moved when the flicker began to draw per rotor"

[[expect]]
what    = "yaw rate"
over    = "1 s to 3 s"
lowest  = "-9.35 °/s ± 1.5 °/s"
basis   = "observed: full right roll asks for nothing in yaw; Prop Wash's flicker (#46) yaws it a little as the rotors' thrusts and speeds part, and the PID loop holds it within about 10 °/s (within 1 °/s without Prop Wash); the values moved when the flicker began to draw per rotor"

[[expect]]
what    = "yaw rate"
over    = "1 s to 3 s"
highest = "10.6 °/s ± 1.5 °/s"
basis   = "observed: full right roll asks for nothing in yaw; Prop Wash's flicker (#46) yaws it a little as the rotors' thrusts and speeds part, and the PID loop holds it within about 10 °/s (within 1 °/s without Prop Wash); the values moved when the flicker began to draw per rotor"

[[expect]]
what  = "roll rate"
at    = "3.5 s"
value = "5.22 °/s ± 5 °/s"
basis = "observed: half a second after the stick is let go the roll has stopped, but the whoop still sinks through its own air, so Prop Wash still shakes it (#46: it read 0 °/s ± 1 °/s without it); it moved when the flicker began to draw per rotor"
