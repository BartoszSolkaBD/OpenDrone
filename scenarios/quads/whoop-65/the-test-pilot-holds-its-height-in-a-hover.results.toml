# Results of the-test-pilot-holds-its-height-in-a-hover.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Test Pilot holds the Whoop 65's height, with its motors at about 40% and its power above the physical minimum"

[[expect]]
what     = "height at 30 s"
basis    = "Rule"
expected = "20 m ± 0.5 m"
measured = "20.0 m"

[[expect]]
what     = "height, lowest over 5 s to 30 s"
basis    = "Rule"
expected = "20 m ± 0.5 m"
measured = "20.0 m"

[[expect]]
what     = "height, highest over 5 s to 30 s"
basis    = "Rule"
expected = "20 m ± 0.5 m"
measured = "20.0 m"

[[expect]]
what     = "roll, highest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.118°"

[[expect]]
what     = "pitch, lowest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "-0.118°"

[[expect]]
what     = "heading at 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.116°"

[[expect]]
what     = "roll, lowest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.00000000169°"

[[expect]]
what     = "pitch, highest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "-0.00000000131°"

[[expect]]
what     = "tilt, highest over 0 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.166°"

[[expect]]
what     = "heading, lowest over 5 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.103°"

[[expect]]
what     = "heading, highest over 5 s to 30 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.117°"

[[expect]]
what     = "total thrust, mean over 10 s to 30 s"
basis    = "Rule"
expected = "31.2 gf ± 0.5 gf"
measured = "31.2 gf"

[[expect]]
what     = "average motor command, mean over 10 s to 30 s"
basis    = "Source"
expected = "between 35% and 55%"
measured = "37.4%"

[[expect]]
what     = "average motor command, mean over 10 s to 30 s"
basis    = "Observed"
expected = "37.4% ± 0.5%"
measured = "37.4%"

[[expect]]
what     = "battery power, lowest over 5 s to 30 s"
basis    = "Rule"
expected = "between 1.74 W and 20 W"
measured = "5.51 W"

[[expect]]
what     = "battery power, mean over 5 s to 30 s"
basis    = "Observed"
expected = "5.58 W ± 0.1 W"
measured = "5.58 W"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

