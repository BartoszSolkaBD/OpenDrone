# Results of in-angle-letting-go-of-the-sticks-levels-the-quad.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "In Angle, the Whoop 65 holds the tilt full stick asks for, and levels itself when the stick is let go"

[[expect]]
what     = "tilt, highest over 0 s to 1 s"
basis    = "Rule"
expected = "0° ± 1°"
measured = "0.0125°"

[[expect]]
what     = "roll, mean over 1.5 s to 2 s"
basis    = "Rule"
expected = "between 45° and 55°"
measured = "50.0°"

[[expect]]
what     = "roll, mean over 1.5 s to 2 s"
basis    = "Observed"
expected = "50.0° ± 0.5°"
measured = "50.0°"

[[expect]]
what     = "roll, highest over 1.5 s to 2 s"
basis    = "Rule"
expected = "55° ± 5°"
measured = "52.6°"

[[expect]]
what     = "tilt, highest over 3 s to 4 s"
basis    = "Rule"
expected = "0° ± 2°"
measured = "0.235°"

[[expect]]
what     = "roll rate at 4 s"
basis    = "Rule"
expected = "0 °/s ± 2 °/s"
measured = "-0.258 °/s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

