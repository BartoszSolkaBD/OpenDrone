# In Angle, holding full stick leans the Quad to the angle limit: full stick
# asks for a tilt of `angle_limit`, and the Flight Controller turns the Quad
# there against the true attitude it reads, as Betaflight 2026.6's Angle does
# (#51).
#
# The Whoop 65 on its imported Tune, mid-air from a hover's "settled"
# motors, armed, in Angle, with the throttle about where it hovers. Its Tune
# gives Angle `angle_limit` 55° and `angle_p_gain` 50 (its 4.3 defaults,
# translated from `level_limit` and `angle_level_strength`). At 1 s the
# roll stick goes to full right, which asks for 55°, and stays there. The Quad
# closes in on it over a few seconds, as the I term builds against the ducts'
# drag ("In Angle, the Whoop 65 holds the tilt full stick asks for, and
# levels itself when the stick is let go" lets go at 2 s, while it is still
# closing in: 52.6° by then), and by 5 s it is at 55°.
format = 2
name   = "In Angle, holding full stick leans the Whoop 65 to the angle limit"

[start]
kind              = "flight"
quad              = "opendrone/whoop-65"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 50 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
armed             = true
motors            = "settled"
flight_controller = "fresh"
battery           = "100%"
flight_mode       = "Angle"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s", roll = "0%", pitch = "0%", yaw = "0%", throttle = "40%", arm = "on", crash_flip = "off" },
  { at = "1 s", roll = "100%" },
]

[[expect]]
what  = "roll"
at    = "5 s"
value = "55° ± 1°"
basis = "rule: in Angle, full stick asks for a tilt of angle_limit, 55° on the Whoop 65's Tune, and held long enough the Quad reaches it"

[[expect]]
what  = "tilt"
at    = "5 s"
value = "55° ± 1°"
basis = "rule: in Angle, full stick asks for a tilt of angle_limit, 55° on the Whoop 65's Tune: rolled alone, with the nose level, that is the whole tilt"
