# The Whoop 65 on the thrust stand, its LAVA II pack nearly flat, at full
# throttle until it is well past empty. Proves that a flat pack fades, with no
# cutoff (E13 and E14 in #10): the voltage falls faster and faster as the
# charge runs out, and the thrust with it, but nothing switches the motors
# off.
#
# Past empty the pack's resting voltage carries on down the last stretch of
# its voltage curve (3.77 V at 20% to 3.30 V at 0%: 0.0235 V per 1% of
# charge), so the pack keeps giving less and less.
format = 1
name   = "A flat Whoop 65 pack fades, with no cutoff"

[start]
kind              = "thrust stand"
quad              = "opendrone/whoop-65"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 0 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). On the thrust stand
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing here; they
# are written down all the same.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "3%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s", motors = "100%" },
]

[[expect]]
what  = "battery charge used"
at    = "20 s"
value = "44.7 mAh ± 1%"
basis = "observed: what 20 s at full throttle draws: 14% of the pack's 320 mAh, so it ends 11% past empty"

[[expect]]
what    = "motor 1 drive"
over    = "1 s to 20 s"
lowest  = "100% ± 0%"
basis   = "rule: the physics has no cutoff (#10 §1): past empty the ESCs still drive the motors as commanded"

[[expect]]
what    = "battery voltage"
over    = "10 s to 20 s"
highest = "between 0 V and 3.30 V"
basis   = "rule: past empty (3.30 V at rest) the pack's resting voltage keeps falling, and the load sags it further"

[[expect]]
what  = "battery voltage"
at    = "1 s"
value = "2.99 V ± 1%"
basis = "observed: full throttle on a nearly flat pack"

[[expect]]
what  = "battery voltage"
at    = "20 s"
value = "2.68 V ± 1%"
basis = "observed: the same, 11% past empty"

[[expect]]
what  = "total thrust"
at    = "1 s"
value = "82.2 gf ± 1%"
basis = "observed: full throttle on a nearly flat pack, a little over 2.6 times the Whoop 65's 31.2 g"

[[expect]]
what  = "total thrust"
at    = "20 s"
value = "69.7 gf ± 1%"
basis = "observed: the thrust fades with the voltage, with nothing switched off"
