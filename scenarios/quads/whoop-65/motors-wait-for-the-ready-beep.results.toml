# Results of motors-wait-for-the-ready-beep.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Whoop 65's motors ignore commands until their ESCs' ready beep"

[[expect]]
what     = "motor 1 speed, highest over 0 s to 1.8 s"
basis    = "Source"
expected = "0 RPM ± 0 RPM"
measured = "0 RPM"

[[expect]]
what     = "motor 1 drive at 1.800125 s"
basis    = "Source"
expected = "1.96% ± 0.001%"
measured = "1.96%"

[[expect]]
what     = "motor 1 speed at 2.5 s"
basis    = "Observed"
expected = "16500 RPM ± 2%"
measured = "16500 RPM"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

