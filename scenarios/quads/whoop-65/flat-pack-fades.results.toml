# Results of flat-pack-fades.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A flat Whoop 65 pack fades, with no cutoff"

[[expect]]
what     = "battery charge used at 20 s"
basis    = "Observed"
expected = "45.6 mAh ± 1%"
measured = "45.6 mAh"

[[expect]]
what     = "motor 1 drive, lowest over 1 s to 20 s"
basis    = "Rule"
expected = "100% ± 0%"
measured = "100%"

[[expect]]
what     = "battery voltage, highest over 10 s to 20 s"
basis    = "Rule"
expected = "between 0 V and 3.30 V"
measured = "2.87 V"

[[expect]]
what     = "battery voltage at 1 s"
basis    = "Observed"
expected = "3.01 V ± 1%"
measured = "3.01 V"

[[expect]]
what     = "battery voltage at 20 s"
basis    = "Observed"
expected = "2.73 V ± 1%"
measured = "2.73 V"

[[expect]]
what     = "total thrust at 1 s"
basis    = "Observed"
expected = "82.9 gf ± 1%"
measured = "82.9 gf"

[[expect]]
what     = "total thrust at 20 s"
basis    = "Observed"
expected = "71.8 gf ± 1%"
measured = "71.8 gf"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "bea23e59b56b9562"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "1a6e70cd93855ad1"   # the whole state after each of 160000 steps at 8000 Hz, in order

