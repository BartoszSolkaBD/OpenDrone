# Results of escs-wait-for-zero-throttle.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Whoop 65's ESCs wait for zero throttle before their ready beep"

[[expect]]
what     = "motor 1 speed, highest over 0 s to 3.3 s"
basis    = "Source"
expected = "0 RPM ± 0 RPM"
measured = "0 RPM"

[[expect]]
what     = "motor 1 drive at 3.300125 s"
basis    = "Source"
expected = "1.96% ± 0.001%"
measured = "1.96%"

[[expect]]
what     = "motor 1 speed at 4 s"
basis    = "Observed"
expected = "16500 RPM ± 2%"
measured = "16500 RPM"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
