# A Whoop 65 motor stepped from 0% to full and back to 0% on the thrust stand,
# from a 4.0 V bench supply (test/whoop-65-bench-supply). Proves the ESC's
# start from a stop, as Bluejay starts a motor, and the separate spin-up and
# slow-down times, the slow-down being the ESC's braking (E5 and E9 in #10).
#
# - The ESC waits 0.1 s after the first command above 0% (Bluejay's start
#   wait), then holds its drive at Bluejay's start-up power limit, 1.96%, for
#   15 electrical turns of the motor: Bluejay's 24 start-up commutations (four
#   turns), then its initial-run countdown of 12 turns, which starts on the
#   fourth. On this 12-pole motor that is 2.5 turns of the prop.
# - Then the motor spins up with the whoop's spin-up time, 35 ms.
# - At 0% the ESC brakes it. The whoop's slow-down time is 35 ms too, but
#   its rotor (0.25 g·cm²) can't be braked that hard through its windings
#   (0.5 Ω): even full braking slows it with a time of the rotor's inertia ×
#   the resistance × KV² = 52 ms, less the prop's drag. So it slows as fast as
#   full braking allows.
#
# No whoop motor's response has been measured (flight-dynamics research
# §3.2), so these times are Observed, pinned for the Feel Tests (#10 §6).
format = 1
name   = "A Whoop 65 motor stepped 0 → 100 → 0% follows its spin-up and slow-down times"

[start]
kind              = "thrust stand"
quad              = "test/whoop-65-bench-supply"
map               = "test/empty-air"
position          = "0 m east, 0 m north, 0 m up"
attitude          = "level, heading 0°"
speed             = "0 m/s"
rotation          = "0 °/s"
# Every starting state spells out everything (ADR-0002). On the thrust stand
# scripted motors stand in for the Flight Controller, so armed, the Flight
# Mode, the Assists, the Radio Link and the Rates change nothing here; they
# are written down all the same. The ESCs start ready, so the first command
# above 0% starts motor 1 after the start wait.
armed             = false
motors            = "stopped"
flight_controller = "fresh"
battery           = "50%"
flight_mode       = "Acro"
assists           = { input_smoothing = "off", endless_battery = "off", auto_arm = "off" }
radio_link        = "250 Hz"
physics_rate      = "8 kHz"
random_seed       = 1

[start.rates]
# Betaflight 2026.6's default rate profile, as the Betaflight App shows it.
type               = "Actual"
roll               = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
pitch              = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
yaw                = "center sensitivity 70 °/s, max rate 670 °/s, expo 0.00"
rate_limit         = "1998 °/s"
throttle           = "mid 0.50, hover 0.50, expo 0.00, limit off"
quickrates_rc_expo = "off"

[inputs]
timeline = [
  { at = "0 s",   motors = "0%" },
  { at = "0.5 s", motors = "100%, 0%, 0%, 0%" },
  { at = "1.5 s", motors = "0%" },
]

[[expect]]
what    = "motor 1 speed"
over    = "0.5 s to 0.6 s"
highest = "0 RPM ± 0 RPM"
basis   = "source: Bluejay v0.21.0, src/Bluejay.asm L726–730: on the first command above zero a ready ESC waits 100 ms (`wait100ms`, \"wait to see if start pulse was glitch\") before it starts the motor; the Quad definition's start wait is 0.1 s"

[[expect]]
what    = "motor 1 drive"
over    = "0.6 s to 0.75 s"
highest = "1.96% ± 0.001%"
basis   = "source: Bluejay v0.21.0, src/Bluejay.asm L762–768, L894–955 and src/Modules/Isrs.asm L347–372: from the start the drive is capped at Startup Power Max, 5 of 255 by default, the Quad definition's start-up power limit of 1.96%, through the start-up phase (24 commutations) and the initial-run phase (a countdown of 12 turns), lifted only at L951"

[[expect]]
what  = "motor 1 speed"
at    = "0.7505 s"
value = "1377 RPM ± 1%"
basis = "observed: where the capped start ends, after 15 electrical turns (2.5 turns of the 12-pole motor), at 0.7505 s"

[[expect]]
what  = "motor 1 speed"
at    = "0.7855 s"
value = "29330 RPM ± 2%"
basis = "observed: one spin-up time (35 ms, an Estimate) after the capped start, 63% of the way from 1,377 RPM to the full-drive speed: 1,377 + 0.632 × (45,600 − 1,377) = 29,330 RPM"

[[expect]]
what  = "motor 1 speed"
at    = "1.5 s"
value = "45600 RPM ± 1%"
basis = "observed: the full-drive speed on 4.0 V; #34 predicted about 45,000 RPM for 30.6 g on these props"

[[expect]]
what  = "motor 1 speed"
at    = "1.535 s"
value = "17500 RPM ± 2%"
basis = "observed: 35 ms after the command drops to 0%, 38% of the full-drive speed is left. Full braking through the windings and the prop's drag set it, not the 35 ms slow-down time, which would leave 37%"

[[expect]]
what    = "motor 1 drive"
over    = "1.75 s to 2 s"
highest = "0% ± 0%"
basis   = "source: Bluejay v0.21.0, src/Bluejay.asm L983–987: below its minimum speed, about 1,330 electrical RPM (222 RPM on this 12-pole motor), a stopping ESC leaves run mode and switches its motor off"
