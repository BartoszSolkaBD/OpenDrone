# Results of crash-flips-upright-on-a-hard-floor.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "An upside-down Whoop 65 on a hard floor Crash Flips upright on roll and on pitch"

[[expect]]
what     = "tilt at 1.9 s"
basis    = "Rule"
expected = "180° ± 1°"
measured = "180°"

[[expect]]
what     = "Crash Flip starts, first over 2 s to 2.1 s"
basis    = "Source"
expected = "0.004125 s ± 0.000001 s"
measured = "0.00413 s"

[[expect]]
what     = "tilt at 3.1 s"
basis    = "Source"
expected = "between 0° and 45°"
measured = "0.0000000475°"

[[expect]]
what     = "the Quad turns right side up, first over 2 s to 3 s"
basis    = "Observed"
expected = "0.495 s ± 0.05 s"
measured = "0.495 s"

[[expect]]
what     = "tilt at 3 s"
basis    = "Observed"
expected = "0° ± 1°"
measured = "0.0000000475°"

[[expect]]
what     = "the Quad disarms, first over 3.2 s to 3.3 s"
basis    = "Source"
expected = "0.000125 s ± 0.000001 s"
measured = "0.000125 s"

[[expect]]
what     = "tilt at 5.9 s"
basis    = "Rule"
expected = "180° ± 1°"
measured = "180°"

[[expect]]
what     = "tilt at 7.1 s"
basis    = "Source"
expected = "between 0° and 45°"
measured = "0.000000380°"

[[expect]]
what     = "the Quad turns right side up, first over 6 s to 7 s"
basis    = "Observed"
expected = "0.501 s ± 0.05 s"
measured = "0.501 s"

[[expect]]
what     = "tilt at 7 s"
basis    = "Observed"
expected = "0° ± 1°"
measured = "0.000000380°"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "c1a723ac6117a0ee"   # opendrone/whoop-65: what the Simulation receives from it
map  = "15cbeb4e88c44e72"   # test/flat-floor
run  = "6f11cc6a1dbd7792"   # the whole state after each of 60000 steps at 8000 Hz, in order

