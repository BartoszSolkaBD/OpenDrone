# Results of crashed-upside-down-it-stays-armed-and-keeps-pushing.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Whoop 65 crashed upside down with Airmode stays armed and keeps pushing"

[[expect]]
what     = "runaway takeoff prevention switches off, first over 0 s to 0.7 s"
basis    = "Source"
expected = "0.504125 s ± 0.000001 s"
measured = "0.504 s"

[[expect]]
what     = "the Quad disarms, first over 0 s to 12 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "tilt at 6 s"
basis    = "Observed"
expected = "180° ± 1°"
measured = "180°"

[[expect]]
what     = "the Quad turns right side up, first over 1 s to 12 s"
basis    = "Observed"
expected = "never"
measured = "never"

[[expect]]
what     = "roll I term at 6 s"
basis    = "Observed"
expected = "94.6 ± 10"
measured = "94.6"

[[expect]]
what     = "motor 1 DShot, lowest over 2 s to 12 s"
basis    = "Source"
expected = "between 168 and 2047"
measured = "168"

[[expect]]
what     = "motor 2 DShot, lowest over 2 s to 12 s"
basis    = "Source"
expected = "between 168 and 2047"
measured = "168"

[[expect]]
what     = "motor 3 DShot, lowest over 2 s to 12 s"
basis    = "Source"
expected = "between 168 and 2047"
measured = "168"

[[expect]]
what     = "motor 4 DShot, lowest over 2 s to 12 s"
basis    = "Source"
expected = "between 168 and 2047"
measured = "168"

[[expect]]
what     = "motor 4 DShot, mean over 6 s to 12 s"
basis    = "Observed"
expected = "986 ± 100"
measured = "986"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

