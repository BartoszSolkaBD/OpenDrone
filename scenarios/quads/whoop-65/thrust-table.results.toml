# Results of thrust-table.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Whoop 65's motor and prop meet BetaFPV's 0802SE thrust table"

[[expect]]
what     = "motor 1 current at 0.9 s"
basis    = "Observed"
expected = "0.420 A ± 1%"
measured = "0.420 A"

[[expect]]
what     = "motor 1 thrust at 0.9 s"
basis    = "Source"
expected = "3.35 gf ± 10%"
measured = "3.58 gf"

[[expect]]
what     = "motor 1 current at 1.9 s"
basis    = "Observed"
expected = "1.22 A ± 1%"
measured = "1.22 A"

[[expect]]
what     = "motor 1 thrust at 1.9 s"
basis    = "Source"
expected = "11.1 gf ± 5%"
measured = "11.1 gf"

[[expect]]
what     = "motor 1 current at 2.9 s"
basis    = "Observed"
expected = "2.21 A ± 1%"
measured = "2.21 A"

[[expect]]
what     = "motor 1 thrust at 2.9 s"
basis    = "Source"
expected = "20.4 gf ± 5%"
measured = "20.6 gf"

[[expect]]
what     = "motor 1 current at 3.9 s"
basis    = "Source"
expected = "3.4 A ± 5%"
measured = "3.32 A"

[[expect]]
what     = "motor 1 thrust at 3.9 s"
basis    = "Source"
expected = "30.6 gf ± 5%"
measured = "31.4 gf"

[[expect]]
what     = "battery current at 3.9 s"
basis    = "Observed"
expected = "3.32 A ± 0.5%"
measured = "3.32 A"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "593765a835345224"   # test/whoop-65-bench-supply: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "74b483cbc7b25403"   # the whole state after each of 31200 steps at 8000 Hz, in order

