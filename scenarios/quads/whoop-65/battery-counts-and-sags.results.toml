# Results of battery-counts-and-sags.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "The Whoop 65's pack counts its charge, and sags by its current × resistance"

[[expect]]
what     = "battery current, mean over 0 s to 8 s"
basis    = "Observed"
expected = "2.3397 A ± 0.01%"
measured = "2.34 A"

[[expect]]
what     = "battery charge used at 8 s"
basis    = "Rule"
expected = "5.1994 mAh ± 0.01%"
measured = "5.20 mAh"

[[expect]]
what     = "battery current at 3.3 s"
basis    = "Observed"
expected = "12.599 A ± 0.01%"
measured = "12.6 A"

[[expect]]
what     = "battery sag at 3.3 s"
basis    = "Rule"
expected = "0.49136 V ± 0.05%"
measured = "0.491 V"

[[expect]]
what     = "battery sag, highest over 4.5 s to 8 s"
basis    = "Rule"
expected = "0 V ± 0.0001 V"
measured = "0 V"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "39b0e5a5b192890e"   # opendrone/whoop-65: what the Simulation receives from it
map  = "f720a5ecea6336f3"   # test/empty-air
run  = "9e4cb0e5b1327e3b"   # the whole state after each of 64000 steps at 8000 Hz, in order

