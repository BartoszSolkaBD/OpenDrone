# Results of a-resting-pocket-is-lost-only-when-unplugged.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A resting Pocket is never lost for silence, only when unplugged"

[[expect]]
what     = "the Flying Input Device is lost, first over 0 s to 45.2 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "reports in the frame, highest over 0.01 s to 11.27 s"
basis    = "Rule"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "reports in the frame, highest over 11.27 s to 45.2 s"
basis    = "Rule"
expected = "4 ± 0"
measured = "4.00"

[[expect]]
what     = "the Flying Input Device is lost, first over 45 s to 45.3 s"
basis    = "Rule"
expected = "0.21525 s ± 0.000001 s"
measured = "0.215 s"

[[expect]]
what     = "RXLOSS blocks arming, first over 45 s to 45.5 s"
basis    = "Source"
expected = "between 0.361 s and 0.3655 s"
measured = "0.362 s"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

