# Results of dualsense-locks-to-its-report-beat-at-250-hz.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A DualSense's Radio Link frames at 250 Hz each carry exactly one fresh report"

[[expect]]
what     = "reports in the frame, lowest over 0 s to 6 s"
basis    = "Rule"
expected = "1 ± 0"
measured = "1.00"

[[expect]]
what     = "reports in the frame, highest over 0 s to 6 s"
basis    = "Rule"
expected = "1 ± 0"
measured = "1.00"

[[expect]]
what     = "frame age, highest over 0 s to 6 s"
basis    = "Rule"
expected = "0.75 ms ± 0.000001 ms"
measured = "0.750 ms"

[[expect]]
what     = "frame age, lowest over 0 s to 6 s"
basis    = "Observed"
expected = "0.25 ms ± 0.000001 ms"
measured = "0.250 ms"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "0c4f9e5d0678cca4"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "8fa3660e26150c01"   # the whole state after each of 48000 steps at 8000 Hz, in order

