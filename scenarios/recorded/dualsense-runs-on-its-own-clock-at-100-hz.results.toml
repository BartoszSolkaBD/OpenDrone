# Results of dualsense-runs-on-its-own-clock-at-100-hz.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A DualSense's Radio Link frames at 100 Hz run on the link's own clock and carry two or three reports"

[[expect]]
what     = "reports in the frame, lowest over 0.005 s to 6 s"
basis    = "Rule"
expected = "2 ± 0"
measured = "2.00"

[[expect]]
what     = "reports in the frame, highest over 0.005 s to 6 s"
basis    = "Rule"
expected = "3 ± 0"
measured = "3.00"

[[expect]]
what     = "reports in the frame, mean over 0.005 s to 6 s"
basis    = "Rule"
expected = "2.5 ± 0.01"
measured = "2.50"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "397d2701f3212342"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "03f1f48c74a9cd2c"   # the whole state after each of 48000 steps at 8000 Hz, in order

