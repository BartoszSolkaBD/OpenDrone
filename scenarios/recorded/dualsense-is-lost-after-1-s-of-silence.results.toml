# Results of dualsense-is-lost-after-1-s-of-silence.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A DualSense that stops reporting is lost after 1 s of silence"

[[expect]]
what     = "the Flying Input Device is lost, first over 0 s to 6.999 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "the Flying Input Device is lost, first over 6 s to 8 s"
basis    = "Source"
expected = "1.000125 s ± 0.000001 s"
measured = "1.00 s"

[[expect]]
what     = "reports in the frame, highest over 6.01 s to 6.99 s"
basis    = "Rule"
expected = "0 ± 0"
measured = "0"

[[expect]]
what     = "RXLOSS blocks arming, first over 6 s to 8 s"
basis    = "Source"
expected = "between 1.146 s and 1.1505 s"
measured = "1.15 s"

[[expect]]
what     = "the Flying Input Device is back, first over 6 s to 9 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "59c46e1cf781ecbe"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "c4ffae309ab9de9e"   # the whole state after each of 72000 steps at 8000 Hz, in order

