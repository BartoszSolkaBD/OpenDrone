# Results of pocket-locks-to-its-report-beat-at-1000-hz.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A Pocket's Radio Link frames at 1000 Hz never carry two reports"

[[expect]]
what     = "reports in the frame, highest over 0 s to 2.09 s"
basis    = "Rule"
expected = "1 ± 0"
measured = "1.00"

[[expect]]
what     = "reports in the frame, mean over 0 s to 2.09 s"
basis    = "Observed"
expected = "0.865 ± 0.01"
measured = "0.865"

[[expect]]
what     = "frame age, highest over 0 s to 2.09 s"
basis    = "Rule"
expected = "0.75 ms ± 0.000001 ms"
measured = "0.750 ms"

[[expect]]
what     = "frame age, lowest over 0 s to 2.09 s"
basis    = "Observed"
expected = "0.125 ms ± 0.000001 ms"
measured = "0.125 ms"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "0d3c101d670191df"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "b054a85ae23ca3de"   # the whole state after each of 16792 steps at 8000 Hz, in order

