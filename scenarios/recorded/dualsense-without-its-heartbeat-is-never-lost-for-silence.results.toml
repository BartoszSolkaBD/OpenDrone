# Results of dualsense-without-its-heartbeat-is-never-lost-for-silence.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A DualSense without its heartbeat is never lost for silence"

[[expect]]
what     = "the Flying Input Device is lost, first over 0 s to 7.5 s"
basis    = "Source"
expected = "never"
measured = "never"

[[expect]]
what     = "reports in the frame, highest over 0 s to 1.9 s"
basis    = "Rule"
expected = "1 ± 0"
measured = "1.00"

[[expect]]
what     = "reports in the frame, mean over 0 s to 1.9 s"
basis    = "Observed"
expected = "0.99 ± 0.01"
measured = "0.992"

[[expect]]
what     = "frame age, highest over 0 s to 1.9 s"
basis    = "Rule"
expected = "0.75 ms ± 0.000001 ms"
measured = "0.750 ms"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "397d2701f3212342"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "637cdaf3dd4351d5"   # the whole state after each of 60000 steps at 8000 Hz, in order

