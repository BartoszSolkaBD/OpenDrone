# Results of dualsense-locks-at-50-hz-five-reports-a-frame.toml, written by the Scenario runner (`cargo scenarios run`).
# Don't edit this file by hand: CI checks that it is up to date. Each value is
# what this run measured, to 3 significant figures.
format   = 1
scenario = "A DualSense's Radio Link frames at 50 Hz each carry exactly five fresh reports"

[[expect]]
what     = "reports in the frame, lowest over 0.01 s to 6 s"
basis    = "Rule"
expected = "5 ± 0"
measured = "5.00"

[[expect]]
what     = "reports in the frame, highest over 0.01 s to 6 s"
basis    = "Rule"
expected = "5 ± 0"
measured = "5.00"

[[expect]]
what     = "frame age, highest over 0 s to 6 s"
basis    = "Rule"
expected = "0.75 ms ± 0.000001 ms"
measured = "0.750 ms"

[[expect]]
what     = "no broken numbers: every number in the state is a real number after every step"
basis    = "Rule"
expected = "none broken"
measured = "none broken"

[fingerprints]
quad = "943169a834404ac3"   # opendrone/freestyle-5: what the Simulation receives from it
map  = "none"   # the Flight Controller runs alone, with no Map
run  = "74993b179f408cab"   # the whole state after each of 48000 steps at 8000 Hz, in order

