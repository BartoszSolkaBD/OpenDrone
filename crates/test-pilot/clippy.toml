    { path = "f32::powi", reason = "multiply it out, or use libm::powf: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::cbrt", reason = "use libm::cbrtf: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::hypot", reason = "use libm::hypotf: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::abs_sub", reason = "use libm::fdimf: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::to_degrees", reason = "multiply by 180.0 / PI yourself: std's version gives different results on different platforms (ADR-0001)" },
    { path = "f32::to_radians", reason = "multiply by PI / 180.0 yourself: std's version gives different results on different platforms (ADR-0001)" },
    { path = "f32::algebraic_add", reason = "use +: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f32::algebraic_sub", reason = "use -: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f32::algebraic_mul", reason = "use *: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f32::algebraic_div", reason = "use /: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f32::algebraic_rem", reason = "use %: the algebraic operations may give different results from run to run (ADR-0001)" },

    # The core never opens a file, starts a thread or reads the environment
    # (ADR-0003). The crate walls catch libraries that do; these catch std.
    { path = "std::fs::read", reason = "the core never opens a file; the caller hands it the data (ADR-0003)" },
    { path = "std::fs::read_to_string", reason = "the core never opens a file; the caller hands it the data (ADR-0003)" },
    { path = "std::fs::write", reason = "the core never writes a file; it hands results to the caller (ADR-0003)" },
    { path = "std::thread::spawn", reason = "the core runs its work in one fixed order, on the caller's thread (ADR-0001)" },
    { path = "std::env::var", reason = "the core takes its settings from the caller, never from the environment (ADR-0003)" },
]

disallowed-types = [
    # Their order changes from run to run (ADR-0001).
    { path = "std::collections::HashMap", reason = "its order changes from run to run; use BTreeMap or a Vec (ADR-0001)" },
    { path = "std::collections::HashSet", reason = "its order changes from run to run; use BTreeSet or a Vec (ADR-0001)" },

    # The core never reads a clock or opens a file (ADR-0003).
    { path = "std::time::Instant", reason = "the core never reads a clock; it counts Simulation Time in steps (ADR-0003)" },
    { path = "std::time::SystemTime", reason = "the core never reads a clock; it counts Simulation Time in steps (ADR-0003)" },
    { path = "std::fs::File", reason = "the core never opens a file; the caller hands it the data (ADR-0003)" },
]
