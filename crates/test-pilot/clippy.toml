    { path = "f32::exp", reason = "use libm::expf: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::exp2", reason = "use libm::exp2f: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::exp_m1", reason = "use libm::expm1f: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::ln", reason = "use libm::logf: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::log", reason = "use libm::logf(x) / libm::logf(base): std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::log2", reason = "use libm::log2f: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::log10", reason = "use libm::log10f: std maths gives different results on different platforms (ADR-0001)" },
