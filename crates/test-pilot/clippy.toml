# House rules for the five core crates: maths, physics, flight-controller, sim
# and test-pilot. The Simulation must give bit-identical results on every
# computer (ADR-0001), and it never reads a clock or opens a file (ADR-0003).
#
# Clippy reads this file for this crate only, so edge crates, the game and
# xtask are not affected. All five core crates carry the same file; the
# readable checks in crates/xtask/tests/house_rules.rs keep the copies the same
# and prove Clippy flags every entry. Changing it is a Repo rules change.

disallowed-methods = [
    # std's maths functions call the platform's maths library, so their
    # results differ between Windows, macOS and Linux. Use the `libm` crate.
    # The exact operations stay allowed: + - * / %, sqrt, mul_add, abs,
    # floor, ceil, round, trunc and div_euclid.
    { path = "f64::sin", reason = "use libm::sin: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::cos", reason = "use libm::cos: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::tan", reason = "use libm::tan: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::sin_cos", reason = "use libm::sincos: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::asin", reason = "use libm::asin: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::acos", reason = "use libm::acos: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::atan", reason = "use libm::atan: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::atan2", reason = "use libm::atan2: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::sinh", reason = "use libm::sinh: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::cosh", reason = "use libm::cosh: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::tanh", reason = "use libm::tanh: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::asinh", reason = "use libm::asinh: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::acosh", reason = "use libm::acosh: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::atanh", reason = "use libm::atanh: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::exp", reason = "use libm::exp: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::exp2", reason = "use libm::exp2: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::exp_m1", reason = "use libm::expm1: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::ln", reason = "use libm::log: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::log", reason = "use libm::log(x) / libm::log(base): std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::log2", reason = "use libm::log2: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::log10", reason = "use libm::log10: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::ln_1p", reason = "use libm::log1p: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::powf", reason = "use libm::pow: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::powi", reason = "multiply it out, or use libm::pow: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::cbrt", reason = "use libm::cbrt: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::hypot", reason = "use libm::hypot: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::abs_sub", reason = "use libm::fdim: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f64::to_degrees", reason = "multiply by 180.0 / PI yourself: std's version gives different results on different platforms (ADR-0001)" },
