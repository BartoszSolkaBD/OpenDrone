    { path = "f64::algebraic_add", reason = "use +: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f64::algebraic_sub", reason = "use -: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f64::algebraic_mul", reason = "use *: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f64::algebraic_div", reason = "use /: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f64::algebraic_rem", reason = "use %: the algebraic operations may give different results from run to run (ADR-0001)" },
    { path = "f32::sin", reason = "use libm::sinf: std maths gives different results on different platforms (ADR-0001)" },
    { path = "f32::cos", reason = "use libm::cosf: std maths gives different results on different platforms (ADR-0001)" },
