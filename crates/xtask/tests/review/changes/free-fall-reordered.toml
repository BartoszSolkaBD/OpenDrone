# A fixture: the same Expectations in another order, written with other
# spacing and comments, plus one new Rule Expectation. Nothing is weakened.
format = 1
name = "Free fall is exactly g"

[start]
kind = "physics"
quad = "test/whoop-65-no-drag"
map = "test/empty-air"
position = "0 m east, 0 m north, 0 m up"
attitude = "level, heading 0°"
speed = "0 m/s"
rotation = "0 °/s"
random_seed = 1

[inputs]
timeline = [{ at = "0 s", motors = "0%" }]

# The Observed one first now.
[[expect]]
what = "horizontal speed"
at = "0.5 s"
value = "0 m/s ± 0.001 m/s"
basis = "observed: what the Simulation did when this was written"

[[expect]]
basis = "source: the Test Map's gravity, 9.81 m/s², in the built-in Test Maps"
what = "vertical acceleration"
over = "0 s to 1 s"
mean = "-9.81 m/s² ± 0.01 m/s²"

[[expect]]
what = "height"
at = "1 s"
value = "-4.905 m ± 0.001 m"
basis = "rule: distance fallen = ½ × g × t² = 4.905 m"

[[expect]]
what = "vertical speed"
at = "1 s"
value = "-9.81 m/s ± 0.00001 m/s"
basis = "rule: speed = g × t = 9.81 m/s² × 1 s, downward"

[[expect]]
what = "vertical speed"
at = "0.5 s"
value = "-4.905 m/s ± 0.00001 m/s"
basis = "rule: speed = g × t = 9.81 m/s² × 0.5 s, downward"
