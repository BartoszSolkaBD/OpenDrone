# A fixture: Results after a change that moved the end roll by 1°.
format   = 1
scenario = "A free tumble keeps its spin"

[[expect]]
what     = "roll rate, lowest over 0 s to 1.125 s"
basis    = "Rule"
expected = "2000 °/s ± 0.001 °/s"
measured = "2000 °/s"

[[expect]]
what     = "roll at 1.125 s"
basis    = "Rule"
expected = "90° ± 0.001°"
measured = "91.0°"

