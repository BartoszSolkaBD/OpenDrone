# The walls between OpenDrone's crates (ADR-0003), checked in CI on every PR by
# `cargo xtask walls`. Changing this file is a Repo rules change: the Reviewer
# decides, and the ticket must ask for it.

# The five core crates make up the Simulation. They follow the house rules
# (ADR-0001), never use Bevy, and never touch the operating system: no clock,
# no files, no threads, no devices, no network.
core = [
    "opendrone-maths",
    "opendrone-physics",
    "opendrone-flight-controller",
    "opendrone-sim",
    "opendrone-test-pilot",
]

# Every crate, and each of its targets, is on this Rust edition: the workspace's,
# which each crate takes with `edition.workspace = true`. The Review Report
# reads code the way rustc reads it in this edition, so moving to another one
# is decided here.
edition = "2024"

# The game crate, the only one that builds Bevy (ADR-0003). While it has Bevy
# among its dependencies, the shared-glam lists below apply.
game = "opendrone"

# Who may use whom. Every crate in the workspace is listed here with the
# OpenDrone crates it may declare as dependencies (of any kind), and the rule
# behind that. A crate missing from this list fails the check.

[crates.opendrone-maths]
may-use = []
rule = "maths is the shared number types, and uses no other OpenDrone crate (ADR-0003)"

[crates.opendrone-physics]
may-use = ["opendrone-maths"]
rule = "physics and the Flight Controller each use only maths, and never each other (ADR-0003)"

[crates.opendrone-flight-controller]
may-use = ["opendrone-maths"]
rule = "physics and the Flight Controller each use only maths, and never each other (ADR-0003)"

[crates.opendrone-sim]
may-use = ["opendrone-maths", "opendrone-physics", "opendrone-flight-controller"]
rule = "the Simulation is the only place where physics and the Flight Controller meet (ADR-0003)"

[crates.opendrone-test-pilot]
may-use = ["opendrone-maths", "opendrone-sim"]
rule = "the Test Pilot drives the Simulation from outside, through Flight Inputs (ADR-0003)"

# ADR-0003 names no uses for input, pack and blackbox. They hand the core plain
# data or read what it puts out, so they may use the core crates. Input also
# reads Input Device profiles as the Pack checker hands them over (#61), as the
# Scenario runner reads Quad definitions: pack reads Pack files, input never does.
[crates.opendrone-input]
may-use = ["opendrone-maths", "opendrone-physics", "opendrone-flight-controller", "opendrone-sim", "opendrone-test-pilot", "opendrone-pack"]
rule = "input may use the core crates, and pack for the Input Device profiles the Pack checker reads (#61), but no other edge crate and not the game"

[crates.opendrone-pack]
may-use = ["opendrone-maths", "opendrone-physics", "opendrone-flight-controller", "opendrone-sim", "opendrone-test-pilot"]
rule = "ADR-0003 names no uses for this edge crate, so it may use the core crates but not another edge crate or the game"

[crates.opendrone-blackbox]
may-use = ["opendrone-maths", "opendrone-physics", "opendrone-flight-controller", "opendrone-sim", "opendrone-test-pilot"]
rule = "ADR-0003 names no uses for this edge crate, so it may use the core crates but not another edge crate or the game"

[crates.opendrone-scenario]
may-use = ["opendrone-maths", "opendrone-sim", "opendrone-flight-controller", "opendrone-test-pilot", "opendrone-pack", "opendrone-blackbox"]
rule = "the Scenario runner uses the Simulation, the Flight Controller, the Test Pilot, pack and blackbox, plus maths' number types (ADR-0003)"

[crates.opendrone-sound]
may-use = []
rule = "sound uses no other OpenDrone crate; the game hands it each frame's state (ADR-0003)"

[crates.opendrone]
may-use = [
    "opendrone-maths",
    "opendrone-physics",
    "opendrone-flight-controller",
    "opendrone-sim",
    "opendrone-test-pilot",
    "opendrone-input",
    "opendrone-pack",
    "opendrone-scenario",
    "opendrone-blackbox",
    "opendrone-sound",
]
rule = "the game uses everything except xtask (ADR-0003)"

[crates.xtask]
may-use = [
    "opendrone-maths",
    "opendrone-physics",
    "opendrone-flight-controller",
    "opendrone-sim",
    "opendrone-test-pilot",
    "opendrone-input",
    "opendrone-pack",
    "opendrone-scenario",
    "opendrone-blackbox",
    "opendrone-sound",
]
rule = "xtask holds developer tools and is never shipped (ADR-0003); it may use any OpenDrone library, but not the game"

# Outside libraries the core may reach, directly or through another library,
# each with why it never touches the operating system. Any other outside
# library anywhere in a core crate's dependencies fails the check, so a new one
# is added here, with its reason, in the PR that brings it in.
[core-libraries]
libm = "pure-Rust maths functions that give the same bits on every platform (ADR-0001)"

# parry3d's 64-bit edition answers the physics' collision questions, in its
# enhanced-determinism mode and without its `std` feature (ADR-0004, #43).
# Everything below it is pure Rust that computes in memory; none of it reads a
# clock or a file, starts a thread or talks to a device or the network.
#
# std itself is always among parry3d's own dependencies (it takes indexmap with
# indexmap's default std feature), so parry3d's own maths method calls go to
# std's maths: [core-platform-maths] below lists the two its code makes, and
# why neither runs. The libraries it computes with (glamx and below) must keep
# std out of their dependencies: see [never-in-core-features].
parry3d-f64 = "the collision geometry library: what touches what, where, and when a moving shape first meets another, in 64-bit (ADR-0004)"
approx = "compares numbers to within a tolerance, for parry3d's maths types"
arrayvec = "lists of a fixed greatest length, kept in place"
autocfg = "checks which Rust features the compiler has, while num-traits builds"
bitflags = "sets of on/off flags, such as parry3d's mesh options"
bytemuck = "reads plain numbers as bytes and back, for wide's number types"
byteorder = "reads and writes numbers in a set byte order, for hash32"
downcast-rs = "turns parry3d's shapes back into their own kinds"
either = "a value of one of two kinds"
equivalent = "key comparisons for indexmap"
foldhash = "a fixed-seed hash for parry3d's maps; no operating-system randomness"
glam = "vector and quaternion maths for parry3d, switched to plain non-SIMD maths and libm by parry3d's determinism mode (ADR-0004)"
glamx = "poses, rotations and eigenvalues on top of glam, for parry3d; while std is nowhere in its own dependencies its maths goes through simba's libm-forced functions (see [never-in-core-features]), and glam's through libm"
hash32 = "32-bit hashing for heapless"
hashbrown = "the hash map behind indexmap; parry3d's determinism mode iterates its maps in a fixed order through indexmap"
heapless = "fixed-size collections for rstar"
indexmap = "maps that keep their insertion order, which parry3d's determinism mode uses for every map it iterates"
log = "a logging interface: it writes nothing unless the program installs a logger, and the core installs none"
num-complex = "complex numbers for simba's number traits"
num-derive = "writes number-trait code while parry3d builds"
num-traits = "number traits shared by parry3d's maths libraries"
ordered-float = "floats with a fixed sort order"
proc-macro2 = "used by code-writing macros while parry3d builds; never part of the running program"
quote = "used by code-writing macros while parry3d builds; never part of the running program"
rstar = "an R*-tree of shapes, in parry3d's tools"
safe_arch = "x86 processor instructions for wide's number types; parry3d's 64-bit queries never compute with them"
serde = "serialisation traits; nothing in the core serialises"
serde_core = "serialisation traits; nothing in the core serialises"
serde_derive = "writes serialisation code while building; never part of the running program"
simba = "number traits for parry3d and glamx, with every maths function forced to libm by parry3d's determinism mode (ADR-0004)"
smallvec = "short lists kept in place"
stable_deref_trait = "a marker for heapless's pointers"
syn = "reads Rust code for code-writing macros while parry3d builds; never part of the running program"
thiserror = "writes error types' messages while parry3d builds"
thiserror-impl = "writes error types' messages while parry3d builds; never part of the running program"
unicode-ident = "tells letters in Rust names apart for code-writing macros while building"
wide = "SIMD number types simba keeps compiled; parry3d's 64-bit queries never compute with them"

# Features of outside libraries the core must never have turned on, written
# "library/feature", with why. cargo merges each library's features across the
# whole workspace, so a feature that any crate turns on counts.
#
# Once std is anywhere among a library's dependencies, Rust resolves its
# `x.acos()` on a number to std's own maths method, ahead of the libm-forced
# maths trait it imports. glamx works out eigenvalues that way, and parry3d's
# convex-hull builders, its mass properties (Shape::mass_properties and the
# MassProperties type) and utils::obb run them, so each feature below, which
# would put std among glamx's dependencies, would send that maths to the
# operating system (ADR-0001). The physics calls none of those (every convex
# Map shape goes through SharedShape::convex_mesh, #141, and it works out its
# own inertia) and the core crates' clippy.toml bans every public way in, the
# eigen types and functions included (#142), so that maths never runs in the
# Simulation: [shared-glam-features] below relies on it. glam's own maths stays on libm
# through its libm feature, but glam/std still puts std among glamx's
# dependencies. `cargo xtask core-maths` checks the compiled code too, so a
# way round this list still fails CI.
[never-in-core-features]
"parry3d-f64/std" = "it turns on glamx's std feature (see glamx/std)"
"glamx/std" = "glamx then works out eigenvalues with std's acos, cos and powi, which differ from one operating system to another, instead of libm; parry3d's convex-hull builders, mass properties and utils::obb run them (ADR-0001)"
"glam/std" = "it puts std among glamx's dependencies, so glamx's eigenvalues use std's maths (see glamx/std)"
"simba/std" = "it puts std among glamx's dependencies, so glamx's eigenvalues use std's maths (see glamx/std)"
"approx/std" = "it puts std among glamx's dependencies, so glamx's eigenvalues use std's maths (see glamx/std)"
"num-traits/std" = "it puts std among glamx's dependencies, so glamx's eigenvalues use std's maths (see glamx/std)"
"num-complex/std" = "it puts std among glamx's dependencies, so glamx's eigenvalues use std's maths (see glamx/std)"
"wide/std" = "it puts std among glamx's dependencies, so glamx's eigenvalues use std's maths (see glamx/std)"
"bytemuck/extern_crate_std" = "it puts std among glamx's dependencies, so glamx's eigenvalues use std's maths (see glamx/std)"

# Bevy 0.20 and parry3d share one copy of glam (ADR-0021), so with Bevy in the
# game, Bevy's glam features reach the core crates as well, and nothing can
# switch them off. The two lists below name what that brings in, each with why
# it is harmless there. They apply only while the `game` crate above has Bevy
# among its dependencies, so a build without Bevy stays as strict as the lists
# above say. A library counts only when a library brings it in, not when a core
# crate uses it itself, and a feature only when it is on this list: anything
# else still fails the check.
# What keeps the Simulation free of the operating system's maths is `cargo
# xtask core-maths`, which reads the compiled code, and the core crates'
# clippy.toml, which bans every public way into glamx's eigenvalue maths:
# parry3d's convex-hull builders, mass properties and utils::obb, and the
# eigen types and functions (#142).
#
# Features, written "library/feature".
[shared-glam-features]
"glam/std" = "Bevy's rendering needs it. It puts std among glamx's dependencies, so glamx's eigenvalues use std's maths, but only parry3d's convex-hull builders, mass properties and utils::obb run them, and the core crates' clippy.toml bans every public way into them"
"approx/std" = "Bevy's maths turns it on. Same reach as glam/std: it makes approx's own maths methods call std's; glamx's eigenvalues are the only code in the core's build it changes, and no code in the Simulation runs them"
"num-traits/std" = "Bevy's maths turns it on. It makes num-traits' `Float` and `Real` maths for f64 and f32 call std's functions, in every library that uses them, and puts std among glamx's dependencies (see glam/std). The core's own code and the libraries it computes with take their maths from libm, so the Simulation runs none of it, and `cargo xtask core-maths` reads the compiled code and fails on any such call that [core-platform-maths] below doesn't allow"
"glam/rand" = "Bevy's maths turns it on. It only adds ways to draw random vectors from a generator; nothing in the core draws from it, because the core's randomness is its own and seeded (ADR-0001)"
"glam/encase" = "Bevy's rendering turns it on. It only adds ways to lay glam's types out as shader data; nothing in the core does"

# Libraries that Bevy's features bring into the core, most of them through the
# shared glam, written by name.
[shared-glam-libraries]
rand = "glam's `rand` feature brings it in for random vectors; the core draws none (see glam/rand)"
rand_core = "rand's traits for random number generators (see rand)"
getrandom = "rand's source of operating-system randomness, reached only by drawing from rand's own operating-system generator, which nothing in the core does; its operating-system calls are not part of the Simulation (see glam/rand)"
libc = "getrandom's calls into the operating system's C library, reached only through getrandom (see getrandom)"
cfg-if = "chooses code by platform while getrandom builds"
r-efi = "getrandom's UEFI bindings, compiled for UEFI targets only"
encase = "glam's `encase` feature brings it in to lay types out as shader data; the core does not (see glam/encase)"
encase_derive = "writes encase's layout code while building; never part of the running program"
encase_derive_impl = "writes encase's layout code while building; never part of the running program"
const_panic = "compile-time panics for encase's checks"
typewit = "type-level helpers for const_panic"
bytemuck_derive = "bytemuck's `derive` feature, which Bevy turns on, brings it in: it writes bytemuck's byte-reading code while building and is never part of the running program"

# Calls to the operating system's maths library (`cos`, `acos`, `log2` and the
# rest) that the core's compiled code may keep, written "library/function",
# with the only functions allowed to make them and why those can never run in
# the Simulation. `cargo xtask core-maths` reads the compiled code of every
# library the core is built with and fails on any other call, or on one of
# these made from anywhere else (ADR-0001).
[core-platform-maths]
"parry3d-f64/acos" = { from = ["<parry3d_f64::shape::trimesh::TriMesh>::compute_pseudo_normals"], reason = "it runs only once a mesh has the ORIENTED or FIX_INTERNAL_EDGES flag (parry3d's TriMesh::set_flags), or to redo pseudo-normals a mesh already has; opendrone-physics builds every mesh with TriMesh::new and no flags and never changes one (map.rs, whose test checks every Map mesh has no flags and no pseudo-normals), and the core crates' clippy.toml bans every public way to give a mesh flags or to redo its pseudo-normals: TriMesh::set_flags, TriMesh::with_flags, TriMesh::update_vertices, TriMesh::set_vertices, TriMesh::append, TriMesh::connected_component_meshes, TriMeshConnectedComponents::to_meshes, SharedShape::trimesh_with_flags and transformation::volume_mesh" }
"parry3d-f64/log2" = { from = ["<parry3d_f64::partitioning::bvh::bvh_tree::Bvh>::optimize_incremental"], reason = "it rebalances a tree whose shapes move; nothing in parry3d's own code calls it (only its tests do), and the core crates' clippy.toml bans it, so opendrone-physics never does" }

# glamx works out the eigenvalues of a 3 x 3 symmetric matrix with `acos` and
# `cos`. In parry3d 0.31.1 these reach it: the convex-hull builders (they
# start from a point cloud's covariance), MassProperties::with_inertia_matrix
# and everything that calls it (Shape::mass_properties, the MassProperties
# constructors and their `+`, `-` and sum), utils::obb, and glamx's own
# MatExt::symmetric_eigen, symmetric_eigenvalues and eigen types. The physics
# calls none of them (every convex Map shape goes through
# SharedShape::convex_mesh, #141, and it works out its own inertia), and the
# core crates' clippy.toml bans every one (#142). The 32-bit versions are the
# same code.
"glamx/acos" = { from = ["<glamx::eigen3::DSymmetricEigen3>::eigenvalues"], reason = "never runs in the Simulation: only parry3d's convex-hull builders, mass properties and utils::obb, and glamx's own eigen functions, reach it, and Clippy bans every public way in for the core (clippy.toml)" }
"glamx/cos" = { from = ["<glamx::eigen3::DSymmetricEigen3>::eigenvalues"], reason = "never runs in the Simulation: only parry3d's convex-hull builders, mass properties and utils::obb, and glamx's own eigen functions, reach it, and Clippy bans every public way in for the core (clippy.toml)" }
"glamx/acosf" = { from = ["<glamx::eigen3::SymmetricEigen3>::eigenvalues", "<glamx::eigen3::SymmetricEigen3A>::eigenvalues"], reason = "never runs in the Simulation: the 32-bit version of the same eigenvalue code, which only the same ways in reach, and Clippy bans every public way in for the core (clippy.toml)" }
"glamx/cosf" = { from = ["<glamx::eigen3::SymmetricEigen3>::eigenvalues", "<glamx::eigen3::SymmetricEigen3A>::eigenvalues"], reason = "never runs in the Simulation: the 32-bit version of the same eigenvalue code, which only the same ways in reach, and Clippy bans every public way in for the core (clippy.toml)" }

# With Bevy in the game, `num-traits` (which Bevy turns on the `std` feature
# of) has its maths compiled into Bevy's shader compilers and into rand_distr.
# None of it runs in the Simulation. An allowance names the function that
# makes the call, not who calls that function, so each one also accepts any
# other caller of it; what makes that safe is stated in each reason.
"num-traits/exp" = { from = ["<f64 as num_traits::float::Float>::exp"], reason = "this covers any caller of `<f64 as Float>::exp`, not only rand_distr, which is the one that calls it today (glam's `rand` feature brings it in for random vectors, and the core draws none). It is safe because the core's own code never names num_traits, and parry3d, glamx and simba take their maths from libm; a core library that started calling Float::exp on an f64 would be accepted here, so a change that adds one needs a Reviewer's eye" }
"num-traits/acosf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::acos"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/acoshf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::acosh"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/asinf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::asin"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/asinhf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::asinh"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/atan2f" = { from = ["<half::binary16::f16 as num_traits::real::Real>::atan2"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/atanf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::atan"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/cosf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::cos"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/coshf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::cosh"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/exp2f" = { from = ["<half::binary16::f16 as num_traits::real::Real>::exp2"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/expf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::exp"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/log1pf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::atanh"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/log2f" = { from = ["<half::binary16::f16 as num_traits::real::Real>::log2"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/logf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::ln"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/powf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::powf"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
"num-traits/sinf" = { from = ["<half::binary16::f16 as num_traits::real::Real>::sin"], reason = "half::f16 maths that shader compilers use to fold constants in shaders, compiled into naga and wgsl-types, which only the game's rendering uses; the Simulation never runs a shader compiler, and it computes with no f16 (this covers any caller of that f16 function)" }
