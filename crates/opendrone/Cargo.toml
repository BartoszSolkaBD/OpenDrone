[package]
name = "opendrone"
description = "The OpenDrone game, and the only crate that uses Bevy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
opendrone-maths.workspace = true
opendrone-physics.workspace = true
opendrone-flight-controller.workspace = true
opendrone-sim.workspace = true
opendrone-test-pilot.workspace = true
opendrone-input.workspace = true
opendrone-pack.workspace = true
opendrone-scenario.workspace = true
opendrone-blackbox.workspace = true
opendrone-sound.workspace = true

# No `[lints] workspace = true` here: this crate may use `unsafe`, because
# it talks to Bevy, SDL and the operating system (#15 §4). Every other crate forbids it.
