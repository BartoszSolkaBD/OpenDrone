# Textures made from scratch (ADR-0024, #292). No download and no licence to
# credit: a generator in assets-src/generators/ makes each one from the seed,
# and the pictures are committed in assets-src/generated/<name>/. `pixels` is
# the width and height of the picture and `size` what one repeat covers.
# `cargo xtask generate-textures` makes them and `--check` says whether the
# committed pictures are the very same bytes.

[textures.brick_red_weathered]
generator = "brick_red_weathered"
seed      = 1
pixels    = 1024
size      = "1.8 m"

[textures.brick_painted_peeling]
generator = "brick_painted_peeling"
seed      = 1
pixels    = 1024
size      = "1.8 m"

[textures.concrete_floor_worn]
generator = "concrete_floor_worn"
seed      = 1
pixels    = 2048
size      = "3 m"

[textures.concrete_wall_rough]
generator = "concrete_wall_rough"
seed      = 1
pixels    = 1024
size      = "2 m"

[textures.steel_beam_rusted]
generator = "steel_beam_rusted"
seed      = 1
pixels    = 1024
size      = "1 m"

[textures.roof_corrugated_rusted]
generator = "roof_corrugated_rusted"
seed      = 1
pixels    = 1024
size      = "1.2 m"

[textures.ground_dirt_rubble]
generator = "ground_dirt_rubble"
seed      = 1
pixels    = 1024
size      = "2 m"

[textures.grass_weeds]
generator = "grass_weeds"
seed      = 1
pixels    = 1024
size      = "2 m"

# Decals' pictures (#321): `size` is how big the picture was drawn to be; a
