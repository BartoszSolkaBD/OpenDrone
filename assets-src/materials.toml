# The material library: every surface a Map draws, by name, and the CC0
# textures behind it (ADR-0014, #63).
#
# - A Map's Blender script gives each object a material named after an entry
#   in [materials] (it reads this file, so the names and colours can't drift).
#   The `.glb` carries only that name and a flat `colour`; the game swaps in
#   the textures by name.
# - [textures] lists each outside picture with where it comes from, its
#   licence and the SHA-256 of the file. `cargo xtask textures` downloads them
#   into assets-src/textures/ (never committed), refuses a file whose checksum
#   differs, and `cargo xtask textures --pin` writes the checksums of a new
#   entry. `cargo xtask credits` writes CREDITS.md from this file.
# - Only CC0 pictures from Poly Haven and ambientCG, at 1K, as JPG.
# - A texture with a `generator` is made from scratch instead (ADR-0024, #292):
#   no download, no licence to credit, `cargo xtask generate-textures` makes it.

[materials]

[materials.concrete_plaza]
colour    = [0.40, 0.40, 0.38]
roughness = 0.90
texture   = "concrete_floor_worn_001"

[materials.concrete_smooth]
