# Made from scratch (ADR-0024, #292): the eight materials of the Factory's
# first slice. They also ask the game not to show where their picture repeats
# (#304): `break_repeat` draws the picture in hex tiles, `turn_cells` lets each
# tile turn and mirror it (only for a picture with no grain), `snap = [u, v]`
# shifts tiles by whole multiples of 1/u and 1/v of the picture so that its
# bricks or ridges stay in line (0 for any shift), and `macro_strength` is how
# strongly the large [macro] picture shows (0 for none).
# `roughness_map = true` reads the texture's `roughness.jpg` for each pixel's
# roughness (#320), and `ao_map` and `metallic_map` do the same for an `ao.jpg`
# and a `metallic.jpg` if the texture's folder has them (the generators make
# none yet). `metallic` (0 to 1) is how metal the surface is, and with a
# `metallic_map` it scales the picture. `wetness` (0 to 1) makes the surface
# darker, glossier and a little more reflective. A material that says none of
# these is drawn as before.
# Each names a texture below that a generator makes; the flat colour and the
# roughness are the picture's averages, what the Map shows without the
# pictures.
[materials.brick_red_weathered]
colour    = [0.15, 0.06, 0.03]
roughness = 0.82
texture   = "brick_red_weathered"
break_repeat   = true
snap           = [8, 12]
macro_strength = 0.50
roughness_map  = true

[materials.brick_painted_peeling]
colour    = [0.24, 0.28, 0.20]
roughness = 0.58
texture   = "brick_painted_peeling"
break_repeat   = true
snap           = [8, 12]
macro_strength = 0.50
roughness_map  = true

[materials.concrete_floor_worn]
colour    = [0.17, 0.17, 0.15]
roughness = 0.78
texture   = "concrete_floor_worn"
break_repeat   = true
snap           = [2, 2]
macro_strength = 0.60
roughness_map  = true

[materials.concrete_wall_rough]
colour    = [0.20, 0.19, 0.17]
roughness = 0.84
texture   = "concrete_wall_rough"
break_repeat   = true
snap           = [2, 2]
macro_strength = 0.50
roughness_map  = true

[materials.steel_beam_rusted]
colour    = [0.10, 0.07, 0.08]
roughness = 0.66
texture   = "steel_beam_rusted"
break_repeat   = true
snap           = [0, 1]
macro_strength = 0.30
roughness_map  = true
metallic       = 0.4

[materials.roof_corrugated_rusted]
colour    = [0.21, 0.18, 0.16]
roughness = 0.74
texture   = "roof_corrugated_rusted"
break_repeat   = true
snap           = [12, 1]
macro_strength = 0.40
roughness_map  = true
metallic       = 0.7

[materials.ground_dirt_rubble]
colour    = [0.12, 0.08, 0.05]
roughness = 0.92
texture   = "ground_dirt_rubble"
break_repeat   = true
turn_cells     = true
macro_strength = 0.70
roughness_map  = true

[materials.grass_weeds]
colour    = [0.09, 0.11, 0.02]
roughness = 0.84
texture   = "grass_weeds"
break_repeat   = true
turn_cells     = true
macro_strength = 0.60
roughness_map  = true

# Decals (#321): one picture each, put once on a surface by a Map's script
# (`MapBuilder.decal`), never a tile, so they ask for no `break_repeat` or
# `macro_strength`. Each texture's folder has a fourth picture, `mask.jpg`: how
# much of the decal covers the surface under it. `cover` (0 to 1, 1 if left
# out) is how much of the decal's own colour shows where the mask is whole, and
# `wetness` (0 to 1) how wet the decal makes the surface under it there: darker
# and glossier, with the surface's own picture showing through where `cover`
# is less than 1. A damp patch is all wetness and no colour.
[materials.decal_moss]
colour        = [0.03, 0.04, 0.01]
roughness     = 0.85
texture       = "decal_moss"
roughness_map = true

[materials.decal_stain]
colour        = [0.02, 0.015, 0.01]
roughness     = 0.77
texture       = "decal_stain"
roughness_map = true
cover         = 0.85
wetness       = 0.25

[materials.decal_damp]
colour    = [0.055, 0.047, 0.036]
roughness = 0.35
texture   = "decal_damp"
cover     = 0.0
wetness   = 1.0

# No picture: leaves are a flat colour.
[materials.foliage]
colour    = [0.10, 0.24, 0.07]
roughness = 0.95

# The large-scale picture that the materials above ask for with `macro_strength`
# (#304): made from scratch like the textures below, laid over the world by where
# a surface is, 80 m to the picture. See `assets-src/generators/macro_variation.py`.
[macro]
texture = "macro_variation"

