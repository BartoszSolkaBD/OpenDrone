# The required checks, on every PR and every push to main (#15 §4, ADR-0010).
#
# Every job here always runs and reports. A PR that touches only docs skips
# the Rust work inside each job (see .github/scripts/changes.sh), so the jobs
# still pass and required checks never hang waiting for a job that never ran.
# The docs site's job is the exception: it always does its work, because docs
# are what it checks.
#
# A push to main runs every Rust check on macOS, Windows and Linux. A PR runs
# every Rust check on Linux only. On macOS and Windows it runs only the
# Scenarios, for the agreement check, and only when the PR can change a
# flight result; otherwise those two jobs skip their work and pass (#240).
# So a macOS- or Windows-only break in code that can't move a flight is found
# by main's CI after the merge: the maintainer chose that cost.
#
# Changing this file is a Repo rules change: the Reviewer decides, and the
# ticket must ask for it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels that PR's older run. Runs on main all finish.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS and Windows build the whole game more slowly than Linux, and from
    # a cold cache (a changed Cargo.lock) that took right about 45 minutes
    # on Windows (#240).
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            timeout: 60
          - name: Windows
            os: windows-latest
            timeout: 60
          - name: Linux
            os: ubuntu-latest
            timeout: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        # all_checks: every Rust check runs here (Linux, or a push to main).
        # scenarios: the Scenarios run here, for the agreement check (every
        # check, or a PR that can change a flight result).
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml)
        if: steps.changes.outputs.scenarios == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Install the Linux packages SDL's source build, Bevy's window and the sound need
        # opendrone-input builds SDL 3.4 from source with CMake (preinstalled
        # on every runner) as a no-window console build, so no X11 or Wayland
        # headers (ADR-0018). libudev's headers let SDL notice Input Devices
        # being plugged in and out through udev. The game's window (Bevy's
        # winit, #62) links Wayland's client library, so it needs its
        # headers; X11 it loads while running, with no headers. The sound
        # (Firewheel through cpal, ADR-0023) links the system's alsa-lib,
        # which deny.toml names, so it needs libasound2-dev.
        if: steps.changes.outputs.all_checks == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libwayland-dev libasound2-dev pkg-config

      - name: Reuse the build cache
        if: steps.changes.outputs.scenarios == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Only main's runs save the cache, which PRs then restore. A main
          # run that fails keeps its cache too, so a retry is faster.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-nextest
        if: steps.changes.outputs.all_checks == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Formatting (rustfmt)
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo fmt --all --check

      - name: Clippy, warnings as errors, with the house rules in the core crates
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build (unsafe is forbidden outside opendrone-input and the game)
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo build --workspace --locked

      - name: SDL's Linux build loads libudev and leaves out libusb and D-Bus (ADR-0014)
        # deny.toml names libudev, which SDL loads from the system while
        # running, never linked: this fails if SDL stops loading it that way.
        # libusb and D-Bus are switched off in crates/input/sdl-linux.cmake;
        # this fails if either crept back in.
        if: steps.changes.outputs.all_checks == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for config in target/debug/build/sdl3-sys-*/out/build/include-config-*/build_config/SDL_build_config.h; do
            [[ -f "$config" ]] || continue
            found=1
            echo "$config:"
            grep -E "HAVE_LIBUDEV_H|SDL_UDEV_DYNAMIC|HAVE_LIBUSB|SDL_LIBUSB_DYNAMIC|HAVE_DBUS_DBUS_H" "$config"
            if grep -qE "^#define (HAVE_LIBUSB|HAVE_DBUS_DBUS_H)" "$config"; then
              echo "::error::SDL's Linux build turned on libusb or D-Bus; switch it off in crates/input/sdl-linux.cmake, or name it in deny.toml (ADR-0014)"
              exit 1
            fi
            # deny.toml says libudev is loaded from the system and never
            # linked: SDL must load it by name while running.
            if ! grep -qE '^#define SDL_UDEV_DYNAMIC "libudev\.so' "$config"; then
              echo "::error::SDL's Linux build doesn't load libudev from the system while running (SDL_UDEV_DYNAMIC), as deny.toml says it does (ADR-0014)"
              exit 1
            fi
          done
          if [[ "$found" == 0 ]]; then
            echo "::error::SDL's build settings weren't found under target/debug/build"
            exit 1
          fi

      - name: Tests (cargo-nextest)
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo nextest run --workspace --locked --profile ci

      - name: The game flies the reference Scenarios exactly as the headless runner does
        # Each Scenario flown through the game's own stepping, in the game's
        # build (the core compiled together with Bevy), must give the run
        # fingerprint its Results file holds, which the headless runner
        # wrote (ADR-0003, "Checks in CI"). One flies our Flight Controller
        # into a wall; another a whoop into a rail, a convex Map shape; the
        # third a whoop landed on the Skate Park's Launch Spot, so the game's
        # build reads a Map from its .glb to the very same bytes (#63).
        if: steps.changes.outputs.all_checks == 'true'
        run: >-
          cargo run --locked --quiet --package opendrone -- --reference
          scenarios/flight-controller/a-quad-that-hits-a-wall-stays-armed.toml
          scenarios/physics/whoop-into-a-6-cm-rail-at-30-m-s.toml
          scenarios/physics/landed-whoop-stays-still-on-the-skate-parks-launch-spot.toml

      - name: The game starts and steps headless, with no sound device
        # GitHub's machines have no screen and no sound device. The game runs
        # with no window for 3 s, with its input thread and its sound's
        # thread, which finds no device and runs silent, and fails if the
        # Simulation didn't step (ADR-0003, "Checks in CI"; ADR-0023).
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo run --locked --quiet --package opendrone -- --headless --seconds 3

      - name: Examples in the docs (doctests, which cargo-nextest doesn't run)
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo test --workspace --doc --locked

      - name: The core is free of Bevy and the operating system (crate walls)
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo xtask walls

      - name: The core's compiled code calls none of the operating system's maths
        # Builds the core crates together with the game and the Scenario
        # runner, so every feature they turn on in a library the core uses
        # counts, then reads the compiled code of every library the core is
        # built with, and the core's functions compiled into the game's and
        # the runner's code: none may call the operating system's maths
        # library (cos, acos, log2, …), whose results differ from one OS to
        # another, except where crates/xtask/walls.toml allows a call with its
        # reason (ADR-0001). Each OS checks its own build, so a library or
        # feature only one OS uses counts too.
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo xtask core-maths --with opendrone --with opendrone-scenario

      - name: Packs (every Pack and Test Quad passes the Pack checker)
        # The checker the game uses, over packs/ and scenarios/test-quads/.
        # Any problem blocks, listed with its file, line and a plain sentence
        # (#16, ADR-0011).
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo xtask packs

      - name: CREDITS.md is generated from the material library and up to date
        # CREDITS.md lists every outside texture with its source, licence and
        # checksum, generated from assets-src/materials.toml (ADR-0014, #63).
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo xtask credits --check

      - name: Feel Test log rules (an Estimate moves with a log row and inside its range; a locked number changes with its source)
        # Compares every Quad definition with this PR's base: HEAD^1 of the
        # merge commit (fetch-depth 2), or main's previous commit on a push
        # (#16 §3).
        if: steps.changes.outputs.all_checks == 'true'
        run: cargo xtask feel-tests --base HEAD^1

      - name: Scenarios (every Expectation, the repeat check, up-to-date Results)
        # Runs every Scenario in scenarios/ twice and blocks on a failed
        # Expectation, two runs that differ, or a Results file that is out of
        # date (#11 §5). It also writes the fingerprint after every step, for
        # the agreement check below.
        if: steps.changes.outputs.scenarios == 'true'
        run: cargo run --locked --quiet --package opendrone-scenario -- check --fingerprints fingerprints

      - name: Keep this OS's fingerprints for the agreement check
        # Kept even when a Scenario failed, so the agreement check can say
        # where this OS split from the others.
        if: ${{ !cancelled() && steps.changes.outputs.scenarios == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fingerprints-${{ matrix.name }}
          path: fingerprints/
          if-no-files-found: warn
          retention-days: 30

  agreement:
    # The whole Simulation gives the same bits on every OS (ADR-0001): the
    # fingerprint after every step of every Scenario must agree across macOS,
    # Windows and Linux. On a mismatch it names the Scenario and the first step
    # where the OSes split (#11 §5). On a PR it compares them only when the
    # PR can change a flight result, as only then do macOS and Windows fly
    # the Scenarios (#240); otherwise it skips its work and passes.
    name: Scenarios agree on every OS
    needs: rust
    # Runs even when an OS's job failed, because a split often explains why.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml)
        if: steps.changes.outputs.flight == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Reuse the build cache
        if: steps.changes.outputs.flight == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch each OS's fingerprints
        if: steps.changes.outputs.flight == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: fingerprints-*
          path: fingerprints

      - name: Compare the fingerprints, step by step
        if: steps.changes.outputs.flight == 'true'
        run: >-
          cargo run --locked --quiet --package opendrone-scenario --
          agree fingerprints/fingerprints-macOS fingerprints/fingerprints-Windows fingerprints/fingerprints-Linux

  mobile:
    # The five core crates must build for phones, to keep the mobile door
    # open (ADR-0001, ADR-0003). Only the core: the game isn't built for them.
    name: Core builds for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            os: macos-latest
            target: aarch64-apple-ios
          - name: Android
            os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml) and the ${{ matrix.name }} target
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Reuse the build cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the core crates for ${{ matrix.name }}
        if: steps.changes.outputs.rust == 'true'
        # The five core crates, as listed in crates/xtask/walls.toml.
        run: >-
          cargo build --locked --target ${{ matrix.target }}
          -p opendrone-maths
          -p opendrone-physics
          -p opendrone-flight-controller
          -p opendrone-sim
          -p opendrone-test-pilot

  maps:
    # The built-in Pack's Maps are build outputs: a Blender script in
    # assets-src/ makes each `.glb`. When assets-src/ or a Pack's maps/
    # changes, this rebuilds every Map with the pinned Blender (the version in
    # assets-src/blender-version.toml, which `cargo xtask maps` reads too) and
    # requires the very same bytes as the committed `.glb`. It also renders
    # preview pictures of each Map, for the Review Report (#63).
    name: Maps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml)
        if: steps.changes.outputs.maps == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Install the packages the xtask build and Blender need
        # xtask builds opendrone-input, which builds SDL from source with
        # libudev's headers (ADR-0018); Blender loads OpenGL, X11 and
        # xkbcommon even with no window.
        if: steps.changes.outputs.maps == 'true'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libudev-dev pkg-config libgl1 libegl1 libx11-6 libxi6 libxxf86vm1
          libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6

      - name: Reuse the build cache
        if: steps.changes.outputs.maps == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: maps
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the pinned Blender and check its SHA-256
        # The address and checksum are in assets-src/blender-version.toml.
        if: steps.changes.outputs.maps == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url=$(sed -n 's/^linux_url *= *"\(.*\)"/\1/p' assets-src/blender-version.toml)
          sha=$(sed -n 's/^linux_sha256 *= *"\(.*\)"/\1/p' assets-src/blender-version.toml)
          test -n "$url" && test -n "$sha"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/blender.tar.xz" "$url"
          echo "$sha  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/blender"
          tar --extract --xz --file "$RUNNER_TEMP/blender.tar.xz" --directory "$RUNNER_TEMP/blender" --strip-components=1
          echo "BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Rebuild the Maps with Blender and require the same bytes as the committed .glb
        if: steps.changes.outputs.maps == 'true'
        run: cargo xtask maps --check --previews target/map-previews

      - name: Keep the Maps Blender built
        # Kept even when they differ: a Map built on another computer can
        # take the one CI built, which is the one this check compares with.
        if: ${{ !cancelled() && steps.changes.outputs.maps == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: maps
          path: target/maps-check/
          if-no-files-found: warn
          retention-days: 30

      - name: Keep the preview renders for the Review Report
        # A plan, a three-quarter view and the FPV shots of every Map.
        if: ${{ !cancelled() && steps.changes.outputs.maps == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: map-previews
          path: target/map-previews/
          if-no-files-found: warn
          retention-days: 30

  docs:
    # The docs site: one mdBook from docs/, with rustdoc for every crate
    # (internal items included) under api/, and no broken links (#15 §4 and
    # §11). It skips nothing on a docs-only PR: docs are what it checks.
    # .github/workflows/pages.yml publishes the same build from main.
    name: Docs site and rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - name: Install the Linux packages SDL's source build, Bevy's window and the sound need
        # rustdoc builds opendrone-input, which builds SDL 3.4 from source
        # (ADR-0018), the game, whose window links Wayland's client library
        # (#62), and opendrone-sound, which links alsa-lib (ADR-0023), as the
        # Rust job does.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libwayland-dev libasound2-dev pkg-config

      - name: Reuse the build cache
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with the Pages workflow, which builds the same book.
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install mdBook (the version in book.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Build the book and rustdoc, and check every link
        run: cargo xtask book

  licences:
    # Libraries must be permissive or MPL-2.0, from crates.io (ADR-0014).
    # The policy is deny.toml.
    name: Licences and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Install cargo-deny
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences, sources and banned libraries (cargo-deny)
        if: steps.changes.outputs.rust == 'true'
        run: cargo deny --locked check bans licenses sources

      - name: Known security advisories, when this PR adds or upgrades a library
        # An advisory published later is for the daily scan to report (#81),
        # so it never blocks unrelated PRs (ADR-0014).
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.libraries == 'true'
        run: cargo deny --locked check advisories
