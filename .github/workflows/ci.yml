# The required checks, on every PR and every push to main (#15 §4, ADR-0010).
#
# Every job here always runs and reports. A PR that touches only docs skips
# the Rust work inside each job (see .github/scripts/changes.sh), so the jobs
# still pass and required checks never hang waiting for a job that never ran.
# The docs site's job is the exception: it always does its work, because docs
# are what it checks.
#
# Changing this file is a Repo rules change: the Reviewer decides, and the
# ticket must ask for it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels that PR's older run. Runs on main all finish.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Reuse the build cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Formatting (rustfmt)
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: Clippy, warnings as errors, with the house rules in the core crates
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build (unsafe is forbidden outside opendrone-input and the game)
        if: steps.changes.outputs.rust == 'true'
        run: cargo build --workspace --locked

      - name: Tests (cargo-nextest)
        if: steps.changes.outputs.rust == 'true'
        run: cargo nextest run --workspace --locked --profile ci

      - name: Examples in the docs (doctests, which cargo-nextest doesn't run)
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace --doc --locked

      - name: The core is free of Bevy and the operating system (crate walls)
        if: steps.changes.outputs.rust == 'true'
        run: cargo xtask walls

      - name: Scenarios (every Expectation, the repeat check, up-to-date Results)
        # Runs every Scenario in scenarios/ twice and blocks on a failed
        # Expectation, two runs that differ, or a Results file that is out of
        # date (#11 §5). It also writes the fingerprint after every step, for
        # the agreement check below.
        if: steps.changes.outputs.rust == 'true'
        run: cargo run --locked --quiet --package opendrone-scenario -- check --fingerprints fingerprints

      - name: Keep this OS's fingerprints for the agreement check
        # Kept even when a Scenario failed, so the agreement check can say
        # where this OS split from the others.
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fingerprints-${{ matrix.name }}
          path: fingerprints/
          if-no-files-found: warn
          retention-days: 30

  agreement:
    # The whole Simulation gives the same bits on every OS (ADR-0001): the
    # fingerprint after every step of every Scenario must agree across macOS,
    # Windows and Linux. On a mismatch it names the Scenario and the first step
    # where the OSes split (#11 §5).
    name: Scenarios agree on every OS
    needs: rust
    # Runs even when an OS's job failed, because a split often explains why.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Reuse the build cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch each OS's fingerprints
        if: steps.changes.outputs.rust == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: fingerprints-*
          path: fingerprints

      - name: Compare the fingerprints, step by step
        if: steps.changes.outputs.rust == 'true'
        run: >-
          cargo run --locked --quiet --package opendrone-scenario --
          agree fingerprints/fingerprints-macOS fingerprints/fingerprints-Windows fingerprints/fingerprints-Linux

  mobile:
    # The five core crates must build for phones, to keep the mobile door
    # open (ADR-0001, ADR-0003). Only the core: the game isn't built for them.
    name: Core builds for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            os: macos-latest
            target: aarch64-apple-ios
          - name: Android
            os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml) and the ${{ matrix.name }} target
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Reuse the build cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the core crates for ${{ matrix.name }}
        if: steps.changes.outputs.rust == 'true'
        # The five core crates, as listed in crates/xtask/walls.toml.
        run: >-
          cargo build --locked --target ${{ matrix.target }}
          -p opendrone-maths
          -p opendrone-physics
          -p opendrone-flight-controller
          -p opendrone-sim
          -p opendrone-test-pilot

  docs:
    # The docs site: one mdBook from docs/, with rustdoc for every crate
    # (internal items included) under api/, and no broken links (#15 §4 and
    # §11). It skips nothing on a docs-only PR: docs are what it checks.
    # .github/workflows/pages.yml publishes the same build from main.
    name: Docs site and rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - name: Reuse the build cache
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with the Pages workflow, which builds the same book.
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install mdBook (the version in book.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Build the book and rustdoc, and check every link
        run: cargo xtask book

  licences:
    # Libraries must be permissive or MPL-2.0, from crates.io (ADR-0014).
    # The policy is deny.toml.
    name: Licences and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide what to check
        id: changes
        shell: bash
        run: bash .github/scripts/changes.sh

      - name: Install the pinned Rust (rust-toolchain.toml)
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Install cargo-deny
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licences, sources and banned libraries (cargo-deny)
        if: steps.changes.outputs.rust == 'true'
        run: cargo deny --locked check bans licenses sources

      - name: Known security advisories, when this PR adds or upgrades a library
        # An advisory published later is for the daily scan to report (#81),
        # so it never blocks unrelated PRs (ADR-0014).
        if: steps.changes.outputs.rust == 'true' && steps.changes.outputs.libraries == 'true'
        run: cargo deny --locked check advisories
