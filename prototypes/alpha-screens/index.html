<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Screens Prototype</title>
<!--
  PROTOTYPE. Throwaway. Not the app (the app will be Bevy).
  Ticket #23: "What screens does the alpha have, and how does a pilot move between them?"
  Plan: four radically different screen flows for the alpha in one file, switchable with
  ?variant=A|B|C|D or the yellow bar at the bottom ([ and ] keys). Layout and flow are the
  question. Visual style is not. State lives in memory only; reload = fresh install.
-->
<style>
:root{
  --bg:#0b0e13; --panel:#151b24; --panel2:#1c2531; --line:#2c3848; --text:#e9eef4; --muted:#97a5b6;
  --accent:#ffb020; --accent-ink:#1b1300; --focus:#ffffff; --proto:#ffe14d; --proto-ink:#111;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#05070a;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:minmax(0,1fr) 64px;height:100vh;overflow:hidden}
#stage{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center;padding:12px 12px 0;min-width:0;min-height:0}
#game{position:relative;aspect-ratio:16/9;width:min(100%, calc((100vh - 90px) * 16 / 9));container-type:inline-size;
  background:var(--bg);border:1px solid #2a2a2a;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#ui{position:absolute;inset:0;font-size:calc(1.22cqw * var(--ts,1));line-height:1.35;outline:none}

/* ---------- shared game UI ---------- */
.layer{position:absolute;inset:0;overflow:auto}
.scr{background:radial-gradient(ellipse at 25% 0%,#1d2a3a,#0b0e13 70%)}
#ui button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:.4em;padding:.5em .9em;cursor:pointer;text-align:left}
#ui button:disabled{opacity:.35;cursor:default}
#ui button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
#ui button.link{background:transparent;border:0;text-decoration:underline;color:var(--muted)}
#ui [data-nav]:focus{outline:.2em solid var(--focus);outline-offset:.15em;z-index:1}
#ui [data-nav]:focus:not(.a-fly){position:relative}
#ui [data-nav]:focus::before{content:"▶";position:absolute;left:-1.1em;top:50%;transform:translateY(-50%);font-size:.8em;color:var(--focus)}
#ui h1{font-size:1.9em;margin:.1em 0 .4em}
#ui h2{font-size:1.4em;margin:.1em 0 .5em}
#ui h3{font-size:.95em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:1.3em 0 .5em;display:flex;align-items:center;gap:1em}
#ui small{display:block;color:var(--muted);font-size:.8em;margin-top:.15em;font-weight:400}
#ui .muted{color:var(--muted)}
#ui .note{color:var(--muted);font-size:.85em;margin:.4em 0}
#ui .cur{font-size:.75em;font-weight:700;border:1px solid currentColor;border-radius:.3em;padding:0 .3em;margin-left:.4em}
.logo{font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.btnrow{display:flex;gap:.7em;margin-top:1.2em;flex-wrap:wrap}
.answers{display:grid;gap:.6em;margin:1em 0}
#ui .answer{display:block;width:100%;padding:.8em 1.1em}
#ui .answer b{font-size:1.1em}
.devs{display:grid;gap:.4em;margin:.8em 0}
.dev{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:.4em;padding:.6em .9em}
.placeholder{border:.15em dashed #6b7787;border-radius:.5em;padding:.8em 1em;color:#c3ccd7;background:repeating-linear-gradient(135deg,transparent 0 .8em,rgba(255,255,255,.03) .8em 1.6em);margin:.8em 0;font-size:.9em}
.warn{border-left:.3em solid var(--accent);padding:.5em .8em;background:rgba(255,176,32,.08);margin:.6em 0}
.facts{margin:.4em 0 1em;padding-left:1.2em}
.facts li{margin:.25em 0}

/* settings */
.settings{display:flex;flex-direction:column;gap:.4em}
.settings.vert{display:grid;grid-template-columns:13em 1fr;gap:1.5em;align-items:start;padding-top:1em}
.tabs{display:flex;gap:.4em;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.5em}
.settings.vert .tabs{flex-direction:column;align-items:stretch;border:0;position:sticky;top:0}
#ui .tab{background:transparent;border:1px solid transparent}
#ui .tab.on{border-color:var(--line);background:var(--panel2);font-weight:800;text-decoration:underline;text-underline-offset:.3em}
.tabhint{margin-left:auto;font-size:.75em;color:var(--muted)}
.tabbody section{margin-bottom:.6em}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 11em;align-items:center;gap:1em;padding:.4em .7em;border-radius:.4em;background:var(--panel);margin:.25em 0}
.row.dis{opacity:.45}
.rc{display:flex;align-items:center;gap:.3em}
#ui .arr{padding:.15em .45em;background:transparent;border:0;color:var(--muted)}
.rv{min-width:8.5em;text-align:center;font-weight:700}
.chg{font-size:.8em;color:var(--accent);font-weight:700}
.chg small{color:var(--muted)}
.presetrow{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
#ui .preset{min-width:9em}
#ui .preset.on{border-width:.15em;border-color:var(--accent)}
.plabel{margin-left:.6em}
.ratesflex{display:flex;gap:1.2em;align-items:flex-start;flex-wrap:wrap;margin:.5em 0}
.rgrid{display:grid;grid-template-columns:auto repeat(4,minmax(7em,auto));gap:.3em;align-items:center}
.rh{font-size:.75em;color:var(--muted);text-align:center}
.rax{font-weight:700;padding-right:.4em}
.cell{display:flex;align-items:center;justify-content:space-between;gap:.2em;background:var(--panel);border:1px solid var(--line);border-radius:.35em;padding:.2em .25em;cursor:pointer;font-weight:600;white-space:nowrap}
#ui .cell .mini{padding:0 .4em;border:0;background:transparent;font-weight:800;color:var(--muted)}
.cell.editing{background:var(--accent);color:var(--accent-ink);border-style:dashed}
.curve{margin:0;width:17em}
.curve svg{width:100%;height:auto;color:var(--text)}
.curve .ax{stroke:#56657a;stroke-width:1}
.curve text{fill:var(--muted);font-size:10px}
.curve figcaption{font-size:.75em;color:var(--muted)}
table.binds{border-collapse:separate;border-spacing:.3em;width:100%}
table.binds th{text-align:left;font-weight:600;color:var(--muted);font-size:.85em}
#ui .bindb{width:100%;text-align:center;padding:.3em .5em}
.seg{display:flex;gap:.4em;margin:.4em 0}
#ui .segb.on{border-width:.15em;border-color:var(--accent);font-weight:800}
.picker{display:flex;flex-direction:column;gap:.5em}
.picker-h{font-size:.85em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
#ui .opt{display:block;width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1em}
#ui .card{display:flex;flex-direction:column;padding:0;overflow:hidden;min-height:11em}
.card .pic{display:flex;align-items:center;justify-content:center;height:7.5em}
.card .cap{display:block;padding:.6em .9em}
.qpic{background:radial-gradient(circle at 50% 55%,#323b47,#141920 70%)}
.mapbg-skate{background:linear-gradient(180deg,#76abe0 0%,#cfe3f5 52%,#a3aab0 53%,#7a8389 100%)}
.mapbg-bando{background:repeating-linear-gradient(90deg,transparent 0 18%,rgba(20,18,16,.75) 18% 26%,transparent 26% 40%),linear-gradient(180deg,#4b4f55 0%,#8f8b83 52%,#56524c 53%,#383532 100%)}
.quadart{position:relative;display:inline-block;width:6.5em;height:6.5em}
.quadart i{position:absolute;display:block}
.quadart .arm{left:50%;top:50%;width:84%;height:.55em;background:#2a2a2a;border-radius:.3em;transform:translate(-50%,-50%) rotate(45deg)}
.quadart .a2{transform:translate(-50%,-50%) rotate(-45deg)}
.quadart .pp{width:40%;height:40%;border-radius:50%;border:.12em solid rgba(220,220,220,.55);background:rgba(255,255,255,.05)}
.quadart .p1{left:0;top:0}.quadart .p2{right:0;top:0}.quadart .p3{left:0;bottom:0}.quadart .p4{right:0;bottom:0}
.quadart.whoop{width:5em;height:5em}
.quadart.whoop .pp{border:.45em solid #3f73d8;background:rgba(63,115,216,.15)}
.quadart .bod{left:50%;top:50%;width:26%;height:32%;background:#3b3b3b;border:.12em solid #8a8a8a;border-radius:.4em;transform:translate(-50%,-50%)}
.modal-bg{background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{width:min(40em,92%);max-height:92%;overflow:auto;background:#121820;border:1px solid var(--line);border-radius:.8em;padding:1.3em 1.6em;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.wide{width:min(58em,95%)}
.chlist{background:var(--panel);border-radius:.5em;padding:.5em .8em;max-height:11em;overflow:auto;font-size:.88em}
.chh{font-weight:700;margin-bottom:.3em}
.chr{display:flex;justify-content:space-between;gap:1em;padding:.15em 0;border-bottom:1px solid var(--line)}
.chr em{color:var(--accent);font-style:normal;font-weight:700}
#ui textarea{width:100%;height:8.5em;font:.75em ui-monospace,Menlo,monospace;background:#0a0d12;color:var(--text);border:1px solid var(--line);border-radius:.4em;padding:.6em}
.samples{font-size:.85em;color:var(--muted);margin:.5em 0;display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
#ui .samples button{padding:.25em .6em}
table.chg-t{width:100%;border-collapse:collapse;font-size:.88em;margin:.5em 0}
table.chg-t td,table.chg-t th{border-bottom:1px solid var(--line);padding:.2em .4em;text-align:left}
.toast{position:absolute;top:.6em;left:50%;transform:translateX(-50%);background:#f2f4f7;color:#111;padding:.5em 1.1em;border-radius:2em;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.countdown{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:25;pointer-events:none;text-shadow:0 2px 12px #000}
.countdown span{font-size:7em;font-weight:900}
.countdown small{font-size:1.1em!important;color:#fff!important}

/* ---------- flight view ---------- */
.fpv{position:absolute;inset:0;overflow:hidden;background:#000}
.fpv .frame{position:absolute;inset:0;overflow:hidden}
.fpv .frame.f43{left:50%;right:auto;width:auto;height:100%;aspect-ratio:4/3;transform:translateX(-50%)}
.a-tsrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.5em;align-items:center;margin-bottom:.4em}
.a-tsrow .row{grid-template-columns:minmax(0,1fr) auto;margin:.15em 0}
.a-tsrow .row .rmk{display:none}
.loading{background:#07090c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;text-align:center}
.loading .big{font-size:2.4em;font-weight:900}
.loading .bar{width:22em;height:.4em;background:var(--panel2);border-radius:1em;overflow:hidden}
.loading .bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;animation:load 1.4s linear forwards}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.loading .keys{margin-top:1.2em;color:var(--muted);font-size:.9em}
.fpv .sky{position:absolute;left:0;right:0;top:0;height:var(--hy);background:linear-gradient(#6aa0d6,#d3e5f5)}
.fpv .ground{position:absolute;left:0;right:0;top:var(--hy);bottom:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 .2em,transparent .2em 3em),linear-gradient(#a3aaaf,#6c7378)}
.fpv.map-bando .sky{background:linear-gradient(#53575d,#a39f96)}
.fpv.map-bando .ground{background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 .2em,transparent .2em 3em),linear-gradient(#5c5852,#34312e)}
.fpv.air .ground{animation:fly .5s linear infinite}
@keyframes fly{to{background-position:0 3em,0 0}}
.fpv .scene{position:absolute;left:0;right:0;top:var(--hy);height:0;transform:scale(var(--zoom));transform-origin:50% 0}
.fpv .pr{position:absolute;bottom:-2em;display:block}
.pr.ramp{background:linear-gradient(#c3c3be,#8d8d88);clip-path:polygon(0 100%,100% 100%,100% 0)}
.pr.ramp.r2{clip-path:polygon(0 100%,100% 100%,0 0)}
.pr.box{background:#9b9b95}
.pr.rail{border-top:.35em solid #444;background:linear-gradient(90deg,transparent 0 8%,#444 8% 10%,transparent 10% 90%,#444 90% 92%,transparent 92%)}
.pr.wall{background:linear-gradient(transparent 0 15%,rgba(10,10,10,.85) 15% 45%,transparent 45%) 0 0/7em 100% repeat-x,#6d6962}
.pr.pillar{background:#7a766e}
.noise{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,rgba(0,0,0,.09) 1px 3px);animation:nz .14s steps(2) infinite}
.noise.n-Light{opacity:.3}.noise.n-Medium{opacity:.6}.noise.n-Realistic{opacity:1}
@keyframes nz{50%{transform:translateY(2px)}}
.frozen *{animation-play-state:paused!important}
.ptag,.fmsg{position:absolute;font:600 .72em ui-monospace,Menlo,monospace;background:var(--proto);color:var(--proto-ink);padding:.15em .5em}
.ptag{top:.6em;left:.6em}
.fmsg{top:.6em;right:.6em;max-width:45%}
.osdph{position:absolute;left:1em;bottom:1em;border:.12em dashed rgba(255,255,255,.7);color:#fff;padding:.4em .7em;font-size:.8em;background:rgba(0,0,0,.25)}
.readout{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:.3em .9em;font:700 1.5em ui-monospace,Menlo,monospace;border-radius:.3em}

/* ---------- Variant A: Quick Fly hub ---------- */
.a-center{display:flex;align-items:center;justify-content:center}
.a-qcard{width:min(46em,90%);background:rgba(18,24,32,.92);padding:1.6em 2em;border-radius:1em;border:1px solid var(--line)}
.a-hub{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:1.3em 2em;gap:1em;overflow:hidden}
.a-top{display:flex;gap:1em;align-items:baseline}
.a-top .logo{font-size:1.3em}
.a-body{display:grid;grid-template-columns:minmax(0,1fr) 21em;gap:1.4em;min-height:0}
.a-hero{position:relative;border-radius:1em;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:1.5em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.a-hero .big{font-size:2.6em;font-weight:900}
#ui .a-fly{position:absolute;right:1.1em;bottom:1.1em;font-size:2em;padding:.45em 1.5em;font-weight:900;background:var(--accent);color:var(--accent-ink);border:0;text-shadow:none}
.a-side{display:flex;flex-direction:column;gap:.7em;overflow:auto;padding:.3em .3em .3em 1.2em}
#ui .chip{display:grid;grid-template-columns:1fr auto;width:100%;padding:.8em 1em}
.chip .k{grid-column:1/3;font-size:.75em;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.chip .val{font-size:1.2em;font-weight:800}
.chip .go{font-size:.8em;color:var(--muted);align-self:center}
.a-foot{display:flex;gap:.7em;align-items:center}
.a-foot .hint{margin-left:1em;font-size:.85em}
.a-drawer{background:rgba(0,0,0,.45)}
.a-drawer-in{position:absolute;top:0;right:0;bottom:0;width:68%;background:#10151c;border-left:1px solid var(--line);padding:1.1em 1.6em 2em 2.2em;overflow:auto}
.dr-head{display:flex;justify-content:space-between;align-items:center}
.a-pause{background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:1em}
.a-pcard{width:21em;background:#10151c;border:1px solid var(--line);padding:1.1em 1.1em 1.1em 1.6em;border-radius:.8em;display:flex;flex-direction:column;gap:.45em}

/* ---------- Variant B: classic ---------- */
.b-title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;background:linear-gradient(#0b0e13,#1b2737)}
.b-title .logo{font-size:4em}
#ui .b-any{font-size:1.3em;background:transparent;border:0;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.b-scr{padding:1.3em 2.4em 2em}
.b-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:.6em;margin-bottom:1em}
.b-head .logo{font-size:1em;margin-right:.8em}
.b-head .ttl{font-size:1.2em;font-weight:700}
.crumbs span{margin:0 .3em;color:var(--muted)}
.crumbs span.on{color:var(--text);font-weight:800;text-decoration:underline;text-underline-offset:.3em}
.b-mid{max-width:44em;margin:1em auto}
.b-mainbody{display:grid;grid-template-columns:24em 1fr;gap:3em;margin-top:2em;padding-left:1.5em}
.b-menu{display:flex;flex-direction:column;gap:.8em}
#ui .b-menu button{font-size:1.6em;padding:.55em 1em;font-weight:700}
.b-last{background:var(--panel);border-radius:.8em;padding:1em 1.4em;align-self:start}
.b-step{max-width:60em;margin:0 auto;padding-left:1.2em}
.b-ready{display:grid;grid-template-columns:1fr 20em;gap:2em}
.b-sum{background:var(--panel);border-radius:.8em;padding:1em 1.4em;display:grid;gap:.5em}
.b-sum .k{display:inline-block;width:8em;color:var(--muted)}
.b-readybtns{display:flex;flex-direction:column;gap:.6em}
#ui .big{font-size:1.8em;text-align:center;padding:.5em}
.b-pause{background:rgba(5,7,10,.72);display:flex;align-items:center;justify-content:center}
.b-pmenu{display:flex;flex-direction:column;gap:.6em;width:20em;text-align:center}
#ui .b-pmenu button{font-size:1.25em;text-align:center}

/* ---------- Variant C: hangar ---------- */
.c-first{display:grid;grid-template-columns:18em minmax(0,40em);gap:3em;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 120%,#3b2d1c,#120f0c 70%)}
.pilotcard{background:linear-gradient(135deg,#f4e7cf,#d9c49c);color:#2b2112;border-radius:.8em;padding:1.2em;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:rotate(-3deg)}
.pc-h{font-weight:900;letter-spacing:.15em;margin-bottom:.8em}
.pc-r{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(43,33,18,.4);padding:.35em 0}
.c-hangar{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:1.1em 1.8em;gap:1em;background:radial-gradient(ellipse at 50% 110%,#3d2f1e,#141210 70%);overflow:hidden}
.c-top{display:flex;gap:.7em;align-items:center}
.c-top .logo{font-size:1.3em}
.c-top .sp{flex:1}
.c-main{display:grid;grid-template-columns:15em minmax(0,1fr) 22em;gap:1.4em;min-height:0}
.c-shelf{display:flex;flex-direction:column;gap:.7em;padding-left:1.1em}
.c-shelf h3{margin-top:0!important}
#ui .qtile{display:block;width:100%;padding:.8em}
#ui .qtile.on{border-width:.18em;border-color:var(--accent)}
.c-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 45%,#4a3b29,transparent 62%);border-radius:1em}
.c-stage .quadart{width:13em;height:13em}
.c-stage .quadart.whoop{width:10em;height:10em}
.c-cam{overflow:auto;padding-left:1.1em}
.c-cam h3{margin-top:0!important}
.c-cam .row{grid-template-columns:1fr auto;}
.c-cam .row .rmk{grid-column:1/3}
.c-fly{display:flex;gap:1em;align-items:center;padding-left:1.1em}
.c-flyl{font-weight:700}
#ui .mtile{width:15em;height:4.2em;font-size:1.2em;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.7);color:#fff}
.c-page{padding:1.1em 1.8em 2em 2.4em;background:radial-gradient(ellipse at 50% 120%,#2f2416,#121010 70%)}
.c-page .c-top{margin-bottom:.8em}
.c-pit{display:grid;grid-template-columns:19em minmax(0,30em);gap:1.2em;align-items:start;padding:1.5em;background:linear-gradient(90deg,rgba(20,14,8,.92) 0 20.5em,rgba(0,0,0,.35) 20.5em)}
.c-pitcol{display:flex;flex-direction:column;gap:.45em;padding-left:1.1em}
.c-pitpane{background:#151210;border:1px solid #4a3b29;border-radius:.8em;padding:1em 1em 1em 1.6em}

/* ---------- Variant D: straight to the Launch Spot ---------- */
.d-first{background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.d-firstcard{width:min(44em,88%);background:rgba(12,16,22,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:1em;padding:1.5em 2em}
.d-menu{display:grid;grid-template-columns:17em minmax(0,1fr);background:linear-gradient(90deg,rgba(5,8,12,.94) 0 17em,rgba(5,8,12,.6) 17em)}
.d-col{display:flex;flex-direction:column;gap:.3em;padding:1.4em 1em 1.4em 1.8em}
.d-col .logo{margin-bottom:.8em}
#ui .d-item{background:transparent;border:1px solid transparent;font-size:1.1em;padding:.5em .7em}
#ui .d-item.on{border-color:var(--line);background:var(--panel2);font-weight:800}
.d-pane{padding:1.4em 2em 2em 2.4em;overflow:auto}
.d-hint{margin-top:6em;max-width:28em}

/* reduce motion (Accessibility setting) */
body.rm #ui *{animation:none!important;transition:none!important}

/* ---------- prototype chrome (not part of the design) ---------- */
#side{grid-column:2;grid-row:1/3;overflow:auto;background:#121212;border-left:4px solid var(--proto);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#ddd;padding:10px 12px 40px}
#side .ph{background:var(--proto);color:#111;font-weight:800;padding:2px 6px;display:inline-block}
#side .pq{color:#fff;font-weight:700;margin:6px 0}
#side h4{margin:14px 0 4px;color:var(--proto);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#side p{margin:4px 0}
#side .dim{color:#999}
#side .bignum{font-size:20px;font-weight:800;color:#fff}
#side button{font:inherit;background:#232323;color:#eee;border:1px solid #484848;border-radius:4px;padding:3px 8px;margin:2px 3px 2px 0;cursor:pointer}
#side button.on{background:var(--proto);color:#111;font-weight:800}
#side table{border-collapse:collapse;width:100%}
#side th{text-align:left;color:#999;font-weight:400;padding:1px 6px 1px 0;vertical-align:top;white-space:nowrap}
#side td{padding:1px 0}
#side ul,#side ol{margin:4px 0;padding-left:18px}
#side .padgrid{display:grid;grid-template-columns:repeat(3,auto);gap:3px;justify-content:start;margin:4px 0}
#side .padgrid button{min-width:44px;text-align:center}
#switcher{position:fixed;bottom:14px;left:calc((100vw - 350px) / 2);transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--proto);color:#111;font:700 13px ui-monospace,Menlo,monospace;border-radius:999px;padding:6px 12px;box-shadow:0 4px 18px rgba(0,0,0,.6);z-index:50;white-space:nowrap}
#switcher button{font:inherit;background:#111;color:var(--proto);border:0;border-radius:999px;width:28px;height:28px;cursor:pointer}
#switcher .swk{font-weight:400;opacity:.7}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto 64px;height:auto;overflow:auto}
  #game{width:100%}
  #side{grid-column:1;grid-row:2;border-left:0;border-top:4px solid var(--proto)}
  #switcher{left:50%}
}

const BF_MAP = { rates_type:'ratesType', roll_rc_rate:'roll_rc', pitch_rc_rate:'pitch_rc', yaw_rc_rate:'yaw_rc', roll_expo:'roll_e', pitch_expo:'pitch_e', yaw_expo:'yaw_e',
  roll_srate:'roll_s', pitch_srate:'pitch_s', yaw_srate:'yaw_s', roll_rate_limit:'roll_lim', pitch_rate_limit:'pitch_lim', yaw_rate_limit:'yaw_lim',
  thr_mid:'thrMid', thr_expo:'thrExpo', throttle_limit_type:'thrLimitType', throttle_limit_percent:'thrLimitPct', quickrates_rc_expo:'quickExpo' };
function convBF(k, val){
  if (k === 'rates_type') return String(val).toUpperCase();
  if (k === 'throttle_limit_type') return { OFF:'Off', SCALE:'Scale', CLIP:'Clip' }[String(val).toUpperCase()] || 'Off';
  if (k === 'quickrates_rc_expo') return /^(on|1)$/i.test(String(val));
  return parseInt(val, 10);
}
function parseBF(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  if (!lines.length) return { error:'Nothing to read yet. Paste the output of diff all, diff or dump.' };
  let cur = null, last = null, setCount = 0; const sec = {}, loose = {};
  for (const l of lines){
    let m;
    if ((m = l.match(/^rateprofile\s+(\d+)$/i))){ cur = +m[1]; last = cur; sec[cur] = sec[cur] || {}; continue; }
    if (/^profile\s+\d+$/i.test(l)){ cur = null; continue; }
    if ((m = l.match(/^set\s+([a-z0-9_]+)\s*=\s*(.*)$/i))){ setCount++; const k = m[1].toLowerCase(); if (k in BF_DEF) (cur === null ? loose : sec[cur])[k] = m[2].trim(); }
  }
  if (!setCount && last === null) return { error:'This doesn’t look like Betaflight CLI output. Paste the output of diff all, diff or dump.' };
  const picked = last === null ? loose : (sec[last] || {});
  const raw = Object.assign({}, BF_DEF, picked), nv = {};
  for (const [bk, sk] of Object.entries(BF_MAP)) nv[sk] = convBF(bk, raw[bk]);
  const used = Object.keys(picked).length, ignored = lines.length - used;
  const ch = Object.keys(nv).filter(k => S.v[k] !== nv[k]).map(k => ({ label:lab(k), from:fmtv(k), to:fmt(k, nv[k]) }));
  const prof = last === null ? 'No “rateprofile” line found, so rate fields were read wherever they were.' : `Used rate profile ${last}, the active one (the last “rateprofile” line).`;
  return { nv, changes:ch, summary:`${prof} Took ${used} rate field${used === 1 ? '' : 's'} and ignored ${ignored} other line${ignored === 1 ? '' : 's'}. Rate fields missing from the paste use Betaflight’s defaults.` };
}

function curveSvg(){
  if (S.v.ratesType !== 'ACTUAL') return `<p class="note" style="width:16em">The curve preview is drawn for Actual rates only in this prototype.</p>`;
  const W = 280, H = 160, P = 30, ys = AXES.map(a => S.v[a + '_s'] * 10), top = Math.max(200, ...ys, ...AXES.map(a => S.v[a + '_rc'] * 10));

  const q = S.quad, tilt = S.v[`cam_${q}_tilt`], fov = S.v[`cam_${q}_fov`], f = S.flight || freshFlight();
  const vfov = fov * 0.48, pitch = f.airborne ? tilt * 0.85 : 0, hy = clamp(50 + ((tilt - pitch) / vfov) * 100, 5, 97);
  const frozen = S.paused || S.countdown > 0 || (S.variant === 'D' && S.nav.first);
  return `<div class="fpv map-${S.map}${f.airborne ? ' air' : ''}${frozen ? ' frozen' : ''}" style="--hy:${hy.toFixed(1)}%;--zoom:${(150 / fov).toFixed(3)}">
    <div class="frame${S.v.imageShape === '4:3' ? ' f43' : ''}">
      <div class="sky"></div><div class="ground"></div><div class="scene">${S.map === 'skate' ? SKATE_PROPS : BANDO_PROPS}</div>
      <div class="noise n-${S.v.noise}"></div>
      <div class="osdph">OSD goes here · not yet specified (map fog)</div>
      ${S.readout ? `<div class="readout">${esc(S.readout)}</div>` : ''}</div>
    <div class="ptag">PROTOTYPE · Free Flight · ${MAPS[S.map].name} · ${QUADS[q].name} · ${S.v.look} · Breakup ${S.v.noise} · ${S.v.imageShape}</div>
    <div class="fmsg">${esc(f.msg)}</div></div>`;
}

  if (x === 'pause'){ if (!S.inFlight) return; if (S.paused && !S.modal){ if (S.counting) S.steps++; resume(); render(); } else if (!menus) pause(); return; }
  if ((x === 'arm' || x === 'thr' || x === 'reset') && !menus){ if (x === 'reset') doReset(); else flightAct(x); render(); }
}
document.addEventListener('keydown', e => {
  const t = e.target, typing = t && t.matches && t.matches('textarea, input');
  if (!typing && (e.key === '[' || e.key === ']')){ e.preventDefault(); switchVariant(e.key === '[' ? -1 : 1); return; }
  if (typing){ if (e.key === 'Escape'){ e.preventDefault(); back(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (ARROWS.includes(e.key)){ e.preventDefault(); if (!e.repeat) camKeyDown(e.key); return; }
    if (e.key === 'r' || e.key === 'R'){ doReset(); render(); return; }
    if (e.key === 'Escape'){ e.preventDefault(); pause(); }
    return;
  }
  if (S.variant === 'B' && !S.inFlight && V.B.cur() === 'press' && !S.modal){ e.preventDefault(); act('v:press'); return; }
  if (ARROWS.includes(e.key)){ e.preventDefault(); navKey(e.key.replace('Arrow', '').toLowerCase()); return; }
  if (e.key === 'Enter'){ e.preventDefault(); select(); return; }
  if (e.key === 'Escape' || e.key === 'Backspace'){ e.preventDefault(); back(); return; }
  if (e.key === 'q' || e.key === 'Q') tabCycle(-1);
  if (e.key === 'e' || e.key === 'E') tabCycle(1);
});
document.addEventListener('keyup', e => { if (ARROWS.includes(e.key)) camKeyUp(); });

freshInstall();
