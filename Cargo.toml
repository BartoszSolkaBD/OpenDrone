# The OpenDrone workspace: twelve unpublished crates that share one version
# (ADR-0003). Who may use whom is written in crates/xtask/walls.toml and
# checked in CI by `cargo xtask walls`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BartoszSolkaBD/OpenDrone"
publish = false

[workspace.dependencies]
# OpenDrone's own crates.
opendrone-maths = { path = "crates/maths" }
opendrone-physics = { path = "crates/physics" }
opendrone-flight-controller = { path = "crates/flight-controller" }
opendrone-sim = { path = "crates/sim" }
opendrone-test-pilot = { path = "crates/test-pilot" }
opendrone-input = { path = "crates/input" }
opendrone-pack = { path = "crates/pack" }
opendrone-scenario = { path = "crates/scenario" }
opendrone-blackbox = { path = "crates/blackbox" }
opendrone-sound = { path = "crates/sound" }

# Outside libraries, pinned to exact versions. Only permissive or MPL-2.0
# licences, from crates.io (ADR-0014); deny.toml enforces that.
libm = "=0.2.16"
# The physics' collision geometry, 64-bit, always in its determinism mode
# (ADR-0004). Only opendrone-physics uses it.
parry3d-f64 = { version = "=0.31.1", default-features = false, features = ["required-features", "alloc", "enhanced-determinism"] }
# Only xtask uses these two, to read the core's compiled code and name its
# functions (`cargo xtask core-maths`).
object = { version = "=0.40.0", default-features = false, features = ["read_core", "archive", "elf", "macho", "coff", "std"] }
rustc-demangle = "=0.1.28"
# Only xtask uses it, to find the links in the docs when it builds the book.
pulldown-cmark = { version = "=0.13.4", default-features = false }
# rustc's own lexer, as rust-analyzer publishes it. Only xtask uses it, so the
# Review Report reads Rust code exactly as the compiler does (#102). 0.174.0's
# src/lib.rs is byte for byte compiler/rustc_lexer/src/lib.rs of Rust 1.99.0,
# the pinned Rust; move it with the Rust version. It needs unicode-ident and
# unicode-properties on the same Unicode version, so Cargo.lock keeps the pair
# Rust 1.99.0's own Cargo.lock has: unicode-ident 1.0.24, unicode-properties
# 0.1.4.
ra-ap-rustc_lexer = "=0.174.0"
# SDL 3.4, built from source and statically linked with only its joystick and
# HIDAPI parts (ADR-0018). Zlib licence. Only opendrone-input uses it.
sdl3-sys = { version = "=0.7.2", default-features = false }
# The game engine, 0.20.0 final (ADR-0021). Only the game uses it (ADR-0003).
# No default features: only what the game draws with, its window and its
# keyboard. Not Bevy's audio (the sound is Firewheel's, ADR-0023), nor its
# gamepads (Input Devices go through SDL, ADR-0018). `tonemapping_luts` gives
# the default tonemapping its look-up tables, which need `ktx2` and
# `zstd_rust` to read. `bevy_post_process` is for the FPV Camera's
# Auto-exposure, and `bevy_curve` for the compensation curve that keeps it in
# each Video Look's limits. `jpeg` reads the Maps' CC0 textures (#63). On Linux
# it draws on X11 and Wayland, as Bevy's own default does.
bevy = { version = "=0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "keyboard",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_light",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_color",
    "bevy_image",
    "bevy_shader",
    "bevy_material",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_post_process",
    "bevy_curve",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "jpeg",
] }
# The sound engine, used directly with no Bevy add-on (ADR-0023). Only
# opendrone-sound uses it. Its API still changes often, so it moves on
# purpose. No default features: only its graph, its stock nodes and cpal, its
# backend for the sound device; not its tracing, nor its sample player
# (symphonium) until clips arrive (#75). It borrows bevy_platform 0.19, which
# needn't match the game's Bevy.
firewheel = { version = "=0.14.0", default-features = false, features = ["std", "cpal"] }
# The latest Quad state, handed to the sound's own thread with no waiting
# (MPL-2.0). Firewheel itself uses it.
triple_buffer = "=9.0.0"
# Firewheel's buffer views, so the Quad's sound can be made with no sound
# device, in tests (ADR-0023).
audioadapter-buffers = { version = "=5.2.0", default-features = false, features = ["std"] }
# The GPU's own timestamps, to measure what the FPV Camera costs a frame: the
# same wgpu Bevy 0.20.0 draws with, whose query types it doesn't re-export.
# Only the game uses it.
wgpu = { version = "=30.0.1", default-features = false }
serde_json = "=1.0.151"
toml = "=1.1.6"
# The format migration steps rewrite Scenario and Pack files with it, keeping
# every comment and the layout (#60). opendrone-pack holds the steps, because
# the Pack reader upgrades an older file in memory with them.
toml_edit = "=0.25.15"
# Only xtask uses these two, to check a downloaded texture against the
# manifest's checksum and to take a file out of the zip ambientCG gives (#63).
# MIT or Apache-2.0, and MIT. The zip crate keeps only deflate, in pure Rust.
sha2 = "=0.11.1"
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2"] }
# The zip crate leaves the inflate backend to its user: Rust's own, miniz_oxide.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

# Every crate takes these lints with `[lints] workspace = true`, except
# opendrone-input and the game, which may use `unsafe` to talk to SDL and the
# operating system (#15 §4).
[workspace.lints.rust]
unsafe_code = "forbid"

# The physics, its maths and parry3d run eight thousand steps a
# Simulation-second, collisions included, so they are optimised even in
# development builds, where CI runs the Scenarios and tests: a two-minute
# landed Scenario takes about 15 s instead of 60 s. Optimising never changes a
# result, because Rust never reorders or fuses floating-point maths: the
# Scenarios' fingerprints are the same either way (ADR-0001).
[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.opendrone-physics]
opt-level = 3

[profile.dev.package.opendrone-maths]
opt-level = 3

# The Quad's sound is made sample by sample, 48,000 times a second, on the
# sound device's own thread (ADR-0023). Unoptimised, it can fall behind and
# break up, so it is optimised in development builds too, Firewheel with it.
[profile.dev.package.opendrone-sound]
opt-level = 3

[profile.dev.package.firewheel-core]
opt-level = 3

[profile.dev.package.firewheel-graph]
opt-level = 3

[profile.dev.package.firewheel-cpal]
opt-level = 3
