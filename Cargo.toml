# The OpenDrone workspace: twelve unpublished crates that share one version
# (ADR-0003). Who may use whom is written in crates/xtask/walls.toml and
# checked in CI by `cargo xtask walls`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BartoszSolkaBD/OpenDrone"
publish = false

[workspace.dependencies]
# OpenDrone's own crates.
opendrone-maths = { path = "crates/maths" }
opendrone-physics = { path = "crates/physics" }
opendrone-flight-controller = { path = "crates/flight-controller" }
opendrone-sim = { path = "crates/sim" }
opendrone-test-pilot = { path = "crates/test-pilot" }
opendrone-input = { path = "crates/input" }
opendrone-pack = { path = "crates/pack" }
opendrone-scenario = { path = "crates/scenario" }
opendrone-blackbox = { path = "crates/blackbox" }
opendrone-sound = { path = "crates/sound" }

# Outside libraries, pinned to exact versions. Only permissive or MPL-2.0
# licences, from crates.io (ADR-0014); deny.toml enforces that.
libm = "=0.2.16"
# The physics' collision geometry, 64-bit, always in its determinism mode
# (ADR-0004). Only opendrone-physics uses it.
parry3d-f64 = { version = "=0.31.1", default-features = false, features = ["required-features", "alloc", "enhanced-determinism"] }
# Only xtask uses these two, to read the core's compiled code and name its
# functions (`cargo xtask core-maths`).
object = { version = "=0.40.0", default-features = false, features = ["read_core", "archive", "elf", "macho", "coff", "std"] }
rustc-demangle = "=0.1.28"
# Only xtask uses it, to find the links in the docs when it builds the book.
pulldown-cmark = { version = "=0.13.4", default-features = false }
# rustc's own lexer, as rust-analyzer publishes it. Only xtask uses it, so the
# Review Report reads Rust code exactly as the compiler does (#102). 0.174.0's
# src/lib.rs is byte for byte compiler/rustc_lexer/src/lib.rs of Rust 1.99.0,
# the pinned Rust; move it with the Rust version. It needs unicode-ident and
# unicode-properties on the same Unicode version, so Cargo.lock keeps the pair
# Rust 1.99.0's own Cargo.lock has: unicode-ident 1.0.24, unicode-properties
# 0.1.4.
ra-ap-rustc_lexer = "=0.174.0"
# SDL 3.4, built from source and statically linked with only its joystick and
# HIDAPI parts (ADR-0018). Zlib licence. Only opendrone-input uses it.
sdl3-sys = { version = "=0.7.2", default-features = false }
serde_json = "=1.0.151"
toml = "=1.1.6"
# The format migration steps rewrite Scenario and Pack files with it, keeping
# every comment and the layout (#60). opendrone-pack holds the steps, because
# the Pack reader upgrades an older file in memory with them.
toml_edit = "=0.25.15"

# Every crate takes these lints with `[lints] workspace = true`, except
# opendrone-input and the game, which may use `unsafe` to talk to SDL and the
# operating system (#15 §4).
[workspace.lints.rust]
unsafe_code = "forbid"

# The physics, its maths and parry3d run eight thousand steps a
# Simulation-second, collisions included, so they are optimised even in
# development builds, where CI runs the Scenarios and tests: a two-minute
# landed Scenario takes about 15 s instead of 60 s. Optimising never changes a
# result, because Rust never reorders or fuses floating-point maths: the
# Scenarios' fingerprints are the same either way (ADR-0001).
[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.opendrone-physics]
opt-level = 3

[profile.dev.package.opendrone-maths]
opt-level = 3
